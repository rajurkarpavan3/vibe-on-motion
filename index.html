  // ═══════════════════════════════════════════════════════════════════════════
  // EASING HELPERS
  // ═══════════════════════════════════════════════════════════════════════════
  const EASINGS = [
    ['linear','Linear'],['ease-in','Ease In'],['ease-out','Ease Out'],['ease-in-out','Ease In Out'],
    ['cubic-bezier(0.34,1.56,0.64,1)','Ease Out Back'],['cubic-bezier(0.175,0.885,0.32,1.275)','Bouncy'],
    ['cubic-bezier(0.16,1,0.3,1)','Gentle'],['cubic-bezier(0.22,1,0.36,1)','Quick'],
    ['steps(1,end)','Instant'],
  ];
  function easingLabel(v) { const e = EASINGS.find(([val])=>val===v); return e ? e[1] : 'Ease Out'; }

  function toggleEasingDrop(e) { if(e) e.stopPropagation(); document.getElementById('easing-drop')?.classList.toggle('hidden'); }
  function pickEasingByIdx(idx, e) {
    if(e) e.stopPropagation();
    const l = getSelLayer(); if(!l) return;
    const pair = EASINGS[idx]; if(!pair) return;
    if (l.easing === pair[0]) return;
    pushUndo('Easing');
    l.easing = pair[0];
    const lbl = document.getElementById('easing-lbl'); if(lbl) lbl.textContent = pair[1];
    document.getElementById('easing-drop')?.classList.add('hidden');
    renderGraphic();
  }

  function toggleStrokeModeDrop(e) { if(e) e.stopPropagation(); document.getElementById('stroke-mode-drop')?.classList.toggle('hidden'); }
  function pickStrokeMode(mode, e) {
    if(e) e.stopPropagation();
    setPP('stroke-color-mode', mode);
    document.getElementById('stroke-mode-drop')?.classList.add('hidden');
  }

  function pct(v, min, max) { return Math.max(0, Math.min(100, Math.round(((v-min)/(max-min))*100))); }

  // ═══════════════════════════════════════════════════════════════════════════
  // LAYER MUTATIONS
  // ═══════════════════════════════════════════════════════════════════════════
  function getSelLayer() { return S.layers.find(l => l.id === S.sel) || null; }

  // ═══════════════════════════════════════════════════════════════════════════
  // MULTI-SELECT
  // ═══════════════════════════════════════════════════════════════════════════
  function getSelectedIds() {
    // Always includes activeAssetId + any shift-selected ones
    const ids = new Set(S.selectedAssetIds || []);
    if (S.activeAssetId) ids.add(S.activeAssetId);
    return [...ids];
  }

  function isMultiSelect() {
    return (S.selectedAssetIds || []).length > 0;
  }

  function clearMultiSelect() {
    S.selectedAssetIds = [];
    updateMultiSelectUI();
    buildTimeline();
    buildRightPanel();
  }

  function toggleMultiSelectAsset(id) {
    if (!S.selectedAssetIds) S.selectedAssetIds = [];
    // Ensure active asset is always in the set when starting multi-select
    if (S.selectedAssetIds.length === 0 && S.activeAssetId && S.activeAssetId !== id) {
      S.selectedAssetIds.push(S.activeAssetId);
    }
    const idx = S.selectedAssetIds.indexOf(id);
    if (idx >= 0) {
      S.selectedAssetIds.splice(idx, 1);
    } else {
      S.selectedAssetIds.push(id);
    }
    S.activeAssetId = id;
    S.file = getAsset(id);
    updateMultiSelectUI();
    buildTimeline();
    buildRightPanel();
  }

  function updateMultiSelectUI() {
    const banner = document.getElementById('multi-select-banner');
    const label  = document.getElementById('multi-select-label');
    const ids = getSelectedIds();
    const multi = isMultiSelect();
    if (banner) banner.classList.toggle('active', multi);
    if (label)  label.textContent = `${ids.length} layer${ids.length !== 1 ? 's' : ''} selected — click preset to apply to all`;
    // Highlight rows in timeline
    document.querySelectorAll('.timeline-row').forEach(row => {
      row.classList.toggle('multi-selected', multi && ids.includes(row.dataset.assetId));
    });
    // Highlight rows in right panel
    document.querySelectorAll('.right-layer-row').forEach(row => {
      const id = row.querySelector('.asset-name-label')?.dataset.assetId;
      row.classList.toggle('multi-selected', multi && id && ids.includes(id));
    });
  }

  function selectAssetRow(id, event) {
    const asset = getAsset(id);
    if (!asset) return;
    // Shift+click → toggle multi-select
    if (event && event.shiftKey) {
      toggleMultiSelectAsset(id);
      return;
    }
    // Normal click → clear multi-select, select single, clear preset selection
    S.selectedAssetIds = [];
    S.activeAssetId = asset.id;
    S.file = asset;
    S.sel = null; // clear preset selection — user clicked layer row not a preset
    buildPresets();
    renderGraphic();
    buildTimeline();
    buildRightPanel();
    hideLayerContextMenu();
  }

  function selectLayer(id, opts={}) {
    const layer = S.layers.find(l => l.id === id);
    if (!layer) return;
    S.activeAssetId = layer.assetId || S.activeAssetId;
    S.file = currentAsset();
    S.sel = layer.id;
    window._rpTab = 'animate'; // auto-switch to animate tab
    buildPresets();
    renderGraphic();
    if (opts.timeline !== false) buildTimeline();
    else syncTimelineSelection();
    buildRightPanel();
    hideLayerContextMenu();
  }

  function setLP(prop, val) {
    const l = getSelLayer(); if(!l) return;
    if (l[prop] === val) return;
    pushUndo('Layer setting');
    l[prop] = val;
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function setLPNum(prop, val, min, max) {
    const l = getSelLayer(); if(!l) return;
    let v = parseFloat(val); if(isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    if (l[prop] === v) return;
    pushUndo('Layer setting');
    l[prop] = v;
    const slider = document.getElementById(`rp-${prop}-slider`);
    if(slider) { slider.value = v; slider.style.setProperty('--rp', pct(v,parseFloat(slider.min),parseFloat(slider.max))+'%'); }
    renderGraphic(); buildTimeline();
  }

  function setLPSlider(prop, val, displayId) {
    const l = getSelLayer(); if(!l) return;
    const next = parseFloat(val);
    if (l[prop] !== next) pushUndoContinuous('lp-' + prop, 'Layer setting');
    l[prop] = next;
    const el = document.getElementById(displayId); if(el) el.value = parseFloat(val).toFixed(2);
    const sl = document.getElementById(`rp-${prop}-slider`);
    if(sl) sl.style.setProperty('--rp', pct(parseFloat(val),parseFloat(sl.min),parseFloat(sl.max))+'%');
    renderGraphic(); buildTimeline();
  }

  function setScale(val, record=true) {
    const next = parseFloat(val) || 1;
    if (record && S.scale !== next) pushUndoContinuous('canvas-scale', 'Canvas zoom');
    S.scale = next;
    const sl = document.getElementById('scale-slider');
    if(sl) { sl.value = S.scale; sl.style.setProperty('--rp', pct(S.scale, 0.1, 3) + '%'); }
    const ct = document.getElementById('canvas-target');
    if (ct) {
      ct.style.transform = `scale(${S.scale})`;
      ct.style.transformOrigin = 'center center';
    }
  }

  function setScaleSlider(val) {
    const next = parseFloat(val);
    if (S.scale !== next) pushUndoContinuous('canvas-scale', 'Canvas zoom');
    S.scale = next;
    const sl = document.getElementById('scale-slider');
    if (sl) sl.style.setProperty('--rp', Math.round(((S.scale-0.1)/(3-0.1))*100) + '%');
    const ct = document.getElementById('canvas-target');
    if (ct) {
      ct.style.transform = `scale(${S.scale})`;
      ct.style.transformOrigin = 'center center';
    }
    const rpDur = document.getElementById('rp-scale-val');
    if(rpDur) rpDur.value = S.scale.toFixed(2);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ALIGNMENT
  // ═══════════════════════════════════════════════════════════════════════════
  function alignAsset(direction) {
    const asset = currentAsset();
    if (!asset) return;

    const canvasEl = document.getElementById('canvas-target');
    const [wStr, hStr] = (S.size || '400x400').split('x');
    // Use the canvas element's actual layout size (unaffected by CSS scale transform)
    const cw = canvasEl ? canvasEl.offsetWidth  : (parseInt(wStr) || 400);
    const ch = canvasEl ? canvasEl.offsetHeight : (parseInt(hStr) || 400);

    // Read the asset wrapper's layout size (offsetWidth/Height ignores CSS transforms)
    const el = document.querySelector(`[data-asset-id="${asset.id}"]`);
    const aw = el ? el.offsetWidth  : (asset.w || cw);
    const ah = el ? el.offsetHeight : (asset.h || ch);

    pushUndo('Align ' + direction);
    // x=0,y=0 = canvas center. Asset origin = its center (transform: translate(-50%,-50%))
    switch (direction) {
      case 'left':    asset.x = -(cw / 2) + (aw / 2); break;
      case 'centerH': asset.x = 0;                     break;
      case 'right':   asset.x =  (cw / 2) - (aw / 2); break;
      case 'top':     asset.y = -(ch / 2) + (ah / 2);  break;
      case 'centerV': asset.y = 0;                      break;
      case 'bottom':  asset.y =  (ch / 2) - (ah / 2);  break;
    }
    applyGraphicPosition();
    renderGraphic();
  }

  function setPP(key, val, min, max) {
    const l = getSelLayer(); if(!l) return;
    if(typeof min === 'number' && typeof max === 'number') { let v=parseFloat(val); if(isNaN(v)) return; val=Math.max(min,Math.min(max,v)); }
    if (l.params[key] === val) return;
    pushUndo('Preset parameter');
    l.params[key] = val;
    renderGraphic(); buildRightPanel();
  }
  function setPPSlider(key, val, displayId) {
    const l = getSelLayer(); if(!l) return;
    const next = parseFloat(val);
    if (l.params[key] !== next) pushUndoContinuous('pp-' + key, 'Preset parameter');
    l.params[key] = next;
    const el=document.getElementById(displayId); if(el) el.value=parseFloat(val).toFixed(2);
    // Find the slider by the display ID pattern: pc-XXX-val -> pc-XXX-sl
    const slId = displayId.replace('-val', '-sl');
    const sl=document.getElementById(slId);
    if(sl) sl.style.setProperty('--rp',pct(parseFloat(val),parseFloat(sl.min),parseFloat(sl.max))+'%');
    renderGraphic();
  }
  function setPPDirect(key, val) {
    const l = getSelLayer(); if(!l) return;
    if (l.params[key] === val) return;
    pushUndo('Preset parameter');
    l.params[key] = val;
    renderGraphic();
  }

  function currentShapeAsset() {
    const asset = currentAsset();
    return asset && asset.type === 'shape' ? asset : null;
  }

  function setShapeKind(shapeType) {
    const asset = currentShapeAsset(); if(!asset) return;
    if (!['square','circle','triangle','star'].includes(shapeType)) shapeType = 'square';
    if (asset.shapeType === shapeType) return;
    pushUndo('Shape type');
    asset.shapeType = shapeType;
    asset.name = ({ square:'Square', circle:'Circle', triangle:'Triangle', star:'Star' })[shapeType] || 'Shape';
    if (shapeType === 'circle') { asset.w = asset.w || 150; asset.h = asset.h || 150; asset.radius = 50; }
    if (shapeType === 'triangle') { asset.radius = Math.min(asset.radius || 0, 40); }
    if (shapeType === 'star') { asset.points = asset.points || 5; asset.radius = Math.min(asset.radius || 0, 18); }
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function setShapeProp(key, val, min, max) {
    const asset = currentShapeAsset(); if(!asset) return;
    let next = parseFloat(val);
    if (isNaN(next)) return;
    next = Math.max(min, Math.min(max, next));
    if (asset[key] === next) return;
    pushUndo('Shape setting');
    asset[key] = next;
    renderGraphic(); buildRightPanel();
  }

  function setShapeSlider(key, val, displayId) {
    const asset = currentShapeAsset(); if(!asset) return;
    const next = parseFloat(val);
    if (asset[key] !== next) pushUndoContinuous('shape-' + key, 'Shape setting');
    asset[key] = next;
    const el = document.getElementById(displayId);
    if (el) el.value = Number.isFinite(next) ? next.toFixed(0) : '';
    const sl = document.getElementById(displayId.replace('-val','-sl'));
    if (sl) sl.style.setProperty('--rp', pct(next, parseFloat(sl.min), parseFloat(sl.max)) + '%');
    renderGraphic();
  }

  function setShapeDirect(key, val) {
    const asset = currentShapeAsset(); if(!asset) return;
    if (asset[key] === val) return;
    pushUndo('Shape color');
    asset[key] = val;
    renderGraphic(); buildRightPanel();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // LAYER ROW RIGHT-CLICK CONTEXT MENU (Rename / Duplicate / Delete)
  // ═══════════════════════════════════════════════════════════════════════════
  function showLayerRowContextMenu(ev, assetId) {
    hideSegmentContextMenu();
    hideLayerContextMenu();

    let menu = document.getElementById('layer-row-ctx-menu');
    if (!menu) {
      menu = document.createElement('div');
      menu.id = 'layer-row-ctx-menu';
      menu.style.cssText = 'position:fixed;z-index:100001;min-width:160px;background:#111;border:1px solid #333;box-shadow:4px 4px 0 rgba(0,0,0,.8);padding:4px;display:none;';
      document.body.appendChild(menu);
    }

    const asset = getAsset(assetId);
    if (!asset) return;

    menu.innerHTML = `
      <div style="padding:5px 10px 4px;font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#555;border-bottom:1px solid #222;margin-bottom:3px;">${asset.name}</div>
    `;

    const btn = (icon, label, cls, fn) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.style.cssText = 'width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:10px;font-weight:700;color:' + (cls === 'danger' ? '#f87171' : '#fff') + ';background:transparent;text-align:left;';
      b.innerHTML = icon + label;
      b.onmouseenter = () => b.style.background = cls === 'danger' ? '#2a0a0a' : '#222';
      b.onmouseleave = () => b.style.background = 'transparent';
      b.addEventListener('click', () => { menu.style.display = 'none'; fn(); });
      menu.appendChild(b);
    };

    // Rename — inline inside the layer row
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      'Rename', '', () => {
        // Find the name span in timeline OR right panel
        const span = document.querySelector(`.asset-name-label[data-asset-id="${assetId}"]`);
        if (!span) return;

        const original = asset.name;
        window.__renamingAsset = true; // block DOM rebuilds

        const input = document.createElement('input');
        input.type = 'text';
        input.value = original;
        input.style.cssText = 'background:transparent;border:none;border-bottom:1.5px solid #FFB000;outline:none;width:100%;min-width:0;font-size:inherit;font-weight:inherit;font-family:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:0;margin:0;line-height:inherit;';

        span.textContent = '';
        span.style.overflow = 'visible';
        span.appendChild(input);
        input.focus();
        input.select();

        let done = false;
        const commit = () => {
          if (done) return;
          done = true;
          window.__renamingAsset = false;
          const val = input.value.trim();
          if (val && val !== original) {
            pushUndo('Rename layer');
            asset.name = val;
          }
          buildTimeline();
          buildRightPanel();
        };
        const cancel = () => {
          if (done) return;
          done = true;
          window.__renamingAsset = false;
          span.textContent = original;
          span.style.overflow = '';
        };

        input.addEventListener('blur',    () => commit());
        input.addEventListener('keydown', e => {
          e.stopPropagation();
          if (e.key === 'Enter')  { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        });
        input.addEventListener('click',       e => e.stopPropagation());
        input.addEventListener('pointerdown', e => e.stopPropagation());
      });

    // Duplicate
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
      'Duplicate', '', () => {
        S.activeAssetId = assetId;
        duplicateSelectedAsset();
      });

    // Separator
    const sep = document.createElement('div');
    sep.style.cssText = 'height:1px;background:#222;margin:3px 0;';
    menu.appendChild(sep);

    // Delete
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
      'Delete', 'danger', () => removeAsset(assetId));

    // Position
    menu.style.display = 'block';
    menu.style.left = '0'; menu.style.top = '0';
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(ev.clientX, window.innerWidth  - r.width  - 8) + 'px';
    menu.style.top  = Math.min(ev.clientY, window.innerHeight - r.height - 8) + 'px';

    // Close on outside click
    const close = () => { menu.style.display = 'none'; window.removeEventListener('click', close); window.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    setTimeout(() => { window.addEventListener('click', close); window.addEventListener('keydown', onKey); }, 0);
  }

  function toggleAssetVis(id) {
    const asset = getAsset(id); if(!asset) return;
    pushUndo('Toggle layer visibility');
    asset.visible = asset.visible === false;
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function toggleVis(id) {
    const l = S.layers.find(l => l.id === id); if(!l) return;
    pushUndo('Toggle visibility');
    l.visible = !l.visible;
    renderGraphic(); buildTimeline(); if(S.sel===id) buildRightPanel();
  }

  function removeLayer(id) {
    const oldLayer = S.layers.find(l => l.id === id);
    if (!oldLayer) return;
    pushUndo('Remove layer');
    S.layers = S.layers.filter(l => l.id !== id);
    if(S.sel === id) S.sel = S.layers.find(l => l.assetId === oldLayer.assetId)?.id || S.layers[0]?.id || null;
    const selected = getSelLayer();
    if (selected) S.activeAssetId = selected.assetId;
    refreshAll();
  }

  function removeAsset(id) {
    const asset = getAsset(id);
    if (!asset) return;
    if (!confirm(`Remove ${asset.name}? Its effects will also be removed.`)) return;
    pushUndo('Remove asset');
    S.assets = S.assets.filter(a => a.id !== id);
    S.layers = S.layers.filter(l => l.assetId !== id);
    if (S.activeAssetId === id) S.activeAssetId = S.assets[0]?.id || null;
    S.file = currentAsset();
    if (S.sel && !S.layers.some(l => l.id === S.sel)) S.sel = S.layers.find(l => l.assetId === S.activeAssetId)?.id || null;
    refreshAll();
  }

  function deleteSelectedArtboardObject() {
    const asset = getAsset(S.activeAssetId);
    if (!asset) return false;
    pushUndo('Delete object');
    const oldIndex = S.assets.findIndex(a => a.id === asset.id);
    S.assets = S.assets.filter(a => a.id !== asset.id);
    S.layers = S.layers.filter(l => l.assetId !== asset.id);
    const nextAsset = S.assets[Math.min(Math.max(oldIndex, 0), S.assets.length - 1)] || S.assets[0] || null;
    S.activeAssetId = nextAsset?.id || null;
    S.file = currentAsset();
    S.sel = S.layers.find(l => l.assetId === S.activeAssetId)?.id || null;
    refreshAll();
    return true;
  }

  function duplicateSelectedAsset() {
    const asset = getAsset(S.activeAssetId);
    if (!asset) return false;
    pushUndo('Duplicate object');
    const newId = newAssetId();
    // Deep-clone the asset, give it a new id and offset position
    const clone = JSON.parse(JSON.stringify(asset));
    clone.id = newId;
    clone.name = asset.name.replace(/ copy(\s\d+)?$/, '') + ' copy';
    clone.x = (asset.x || 0) + 20;
    clone.y = (asset.y || 0) + 20;
    // Insert the clone directly after the original in the array
    const idx = S.assets.findIndex(a => a.id === asset.id);
    S.assets.splice(idx + 1, 0, clone);
    // Deep-clone all layers that belong to the original asset, reassign to new asset
    const originalLayers = S.layers.filter(l => l.assetId === asset.id);
    const clonedLayers = originalLayers.map(l => {
      const lc = JSON.parse(JSON.stringify(l));
      lc.id = newLayerId() + Math.floor(Math.random() * 9999);
      lc.assetId = newId;
      return lc;
    });
    // Insert cloned layers right after the original layers in S.layers
    if (originalLayers.length) {
      const lastOrigIdx = (() => { let li=-1; S.layers.forEach((l,i)=>{ if(l.assetId===asset.id) li=i; }); return li; })();
      S.layers.splice(lastOrigIdx + 1, 0, ...clonedLayers);
    } else {
      S.layers.push(...clonedLayers);
    }
    S.activeAssetId = newId;
    S.file = clone;
    S.sel = clonedLayers[0]?.id || null;
    refreshAll();
    return true;
  }

  function setBg(bg, record=true) {
    if (record && S.bg !== bg) pushUndo('Background');
    S.bg = bg;
    const c = document.getElementById('canvas-target');
    const colorInput = document.getElementById('bg-custom-color');
    const gradientInput = document.getElementById('bg-gradient-color');
    
    document.querySelectorAll('#bg-toggles [data-bg-option]').forEach(b => {
      const isSel = b.id === 'bg-'+bg;
      b.className = b.className.replace(/filter-option-selected|bg-brand-orange text-(?:white|black)(?: hover:bg-orange-600)?|bg-stone-800 text-white|bg-white text-stone-500 hover:bg-stone-100/g, '').trim();
      b.className += isSel ? ' filter-option-selected' : ' bg-white text-stone-500 hover:bg-stone-100';
    });
    const bgLabel = document.getElementById('bg-menu-lbl');
    if (bgLabel) bgLabel.textContent = bg === 'transparent' ? 'TRANSPARENT' : bg.toUpperCase();
    updateCustomBgModeUI();

    if (c) {

        const customCol = S.customBg || (colorInput ? colorInput.value : '#ffffff');

        c.style.backgroundImage = '';
        c.className = 'relative flex items-center justify-center border border-black shadow-[4px_4px_0_rgba(0,0,0,1)] overflow-hidden';

        const c2 = S.customBg2 || (gradientInput ? gradientInput.value : '#FFB000');
        c.style.backgroundColor = '';

        c.className = 'relative flex items-center justify-center border border-black shadow-[4px_4px_0_rgba(0,0,0,1)] overflow-hidden';
      } else {
        c.style.backgroundColor = '';
        c.style.backgroundImage = '';

  function handleAssetFile(file) {
    if(!file) return;
    const fn = file.name.toLowerCase();
    const isSvg = file.type==='image/svg+xml' || fn.endsWith('.svg');
    const isImg = file.type.startsWith('image/') || /\.(png|jpg|jpeg|webp|gif)$/.test(fn);
    const reader = new FileReader();
    if(isSvg) {
      reader.onload = ev => addAssetRecord('svg', ev.target.result, file.name);
      reader.readAsText(file);
    } else if(isImg) {
      reader.onload = ev => addAssetRecord('png', ev.target.result, file.name);
      reader.readAsDataURL(file);
    } else {
      alert('Please upload SVG, PNG, JPG, WEBP or GIF.');
    }
  }

  function handleAssetFiles(files) {
    Array.from(files || []).forEach(handleAssetFile);
  }

  document.getElementById('file-upload').onchange = function(e) {
    handleAssetFiles(e.target.files);
    e.target.value = '';
  };

  function initFileDrop() {
    const target = document.getElementById('canvas-target');
    if(!target) return;
    const hasFileDrag = e => Array.from(e.dataTransfer?.types || []).includes('Files');
    const clearDrop = () => target.classList.remove('drop-active');

    window.addEventListener('dragover', e => {
      if(hasFileDrag(e)) e.preventDefault();
    });
    window.addEventListener('drop', e => {
      if(hasFileDrag(e)) e.preventDefault();
      clearDrop();
    });
    target.addEventListener('dragenter', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      target.classList.add('drop-active');
    });
    target.addEventListener('dragover', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      target.classList.add('drop-active');
    });
    target.addEventListener('dragleave', e => {
      if(!target.contains(e.relatedTarget)) clearDrop();
    });
    target.addEventListener('drop', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      e.stopPropagation();
      clearDrop();
      handleAssetFiles(e.dataTransfer.files);
    });
  }

  function startInlineTextEdit(wrapperEl, asset) {
    // Find the inner text div
    const textDiv = wrapperEl.querySelector('div');
    if (!textDiv || wrapperEl.dataset.editing) return;
    wrapperEl.dataset.editing = '1';

    const original = asset.content || '';

    // Make it contenteditable in-place
    textDiv.contentEditable = 'true';
    textDiv.style.outline = '2px dashed #FFB000';
    textDiv.style.cursor = 'text';
    textDiv.style.userSelect = 'text';
    textDiv.style.webkitUserSelect = 'text';
    // Remove gradient clip so text is visible while editing
    if (asset.colorMode === 'gradient') {
      textDiv.style.webkitTextFillColor = asset.textColor || '#1F1F1F';
      textDiv.style.background = 'none';
    }
    textDiv.focus();

    // Place cursor at end
    const range = document.createRange();
    range.selectNodeContents(textDiv);
    range.collapse(false);
    const sel = window.getSelection();
    sel?.removeAllRanges();
    sel?.addRange(range);

    const commit = () => {
      if (!wrapperEl.dataset.editing) return;
      delete wrapperEl.dataset.editing;
      textDiv.contentEditable = 'false';
      textDiv.style.outline = '';
      textDiv.style.cursor = '';
      textDiv.style.userSelect = '';
      textDiv.style.webkitUserSelect = '';
      const newContent = textDiv.innerText || textDiv.textContent || '';
      if (newContent !== original) {
        pushUndo('Edit text');
        asset.content = newContent;
      }
      renderGraphic();
      buildRightPanel();
    };

    textDiv.addEventListener('blur', commit, { once: true });
    textDiv.addEventListener('keydown', e => {
      e.stopPropagation();
      // Shift+Enter = newline (default), plain Enter = commit
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        textDiv.blur();
      }
      if (e.key === 'Escape') {
        textDiv.innerText = original;
        textDiv.blur();
      }
    });
    // Prevent drag from firing while editing
    textDiv.addEventListener('pointerdown', e => e.stopPropagation());
  }

  function initObjectDrag() {
    const target = document.getElementById('canvas-target');
    const wrap = document.getElementById('graphic-wrapper');
    if(!target || !wrap) return;

    let drag = null;

    const finishDrag = () => {
      if (!drag) return;
      try { drag.el.releasePointerCapture(drag.pointerId); } catch(_) {}
      drag.el.classList.remove('dragging');

      if (drag.isDup && drag.moved) {
        // The element was visually dragged to a new position (asset.x/y updated live).
        // Capture final position, restore original, then create clone at that position.
        const finalX = drag.asset.x;
        const finalY = drag.asset.y;

        // Restore original to where it started
        drag.asset.x = drag.origX;
        drag.asset.y = drag.origY;

        // Create duplicate at the dropped position
        pushUndo('Duplicate object');
        const newId = newAssetId();
        const clone = JSON.parse(JSON.stringify(drag.asset));
        clone.id = newId;
        clone.name = drag.asset.name.replace(/ copy(\s\d+)?$/, '') + ' copy';
        clone.x = finalX;
        clone.y = finalY;

        const idx = S.assets.findIndex(a => a.id === drag.asset.id);
        S.assets.splice(idx + 1, 0, clone);

        const originalLayers = S.layers.filter(l => l.assetId === drag.asset.id);
        const clonedLayers = originalLayers.map(l => {
          const lc = JSON.parse(JSON.stringify(l));
          lc.id = 'L' + Date.now() + Math.floor(Math.random() * 99999);
          lc.assetId = newId;
          return lc;
        });
        if (clonedLayers.length) {
          const lastIdx = (() => {
            let li = -1;
            S.layers.forEach((l, i) => { if (l.assetId === drag.asset.id) li = i; });
            return li;
          })();
          if (lastIdx >= 0) S.layers.splice(lastIdx + 1, 0, ...clonedLayers);
          else S.layers.push(...clonedLayers);
        }

        S.activeAssetId = newId;
        S.file = clone;
        S.sel = clonedLayers[0]?.id || null;
        refreshAll();
      }

      drag = null;
    };

    // Double-click on text asset → inline edit directly on artboard
    wrap.addEventListener('dblclick', e => {
      const el = e.target.closest('.asset-wrapper');
      if (!el) return;
      const asset = getAsset(el.dataset.assetId);
      if (!asset || asset.type !== 'text') return;
      e.preventDefault();
      e.stopPropagation();
      startInlineTextEdit(el, asset);
    });

    wrap.addEventListener('pointerdown', e => {
      const el = e.target.closest('.asset-wrapper');
      if (!el || e.button !== 0) return;
      const asset = getAsset(el.dataset.assetId);
      if (!asset) return;
      e.preventDefault();
      e.stopPropagation();

      S.activeAssetId = asset.id;
      S.file = asset;
      S.sel = S.layers.find(l => l.assetId === asset.id)?.id || null;

      const rect = target.getBoundingClientRect();
      const scaleX = rect.width  ? target.offsetWidth  / rect.width  : 1;
      const scaleY = rect.height ? target.offsetHeight / rect.height : 1;

      drag = {
        pointerId: e.pointerId,
        el,
        asset,
        startX:  e.clientX,
        startY:  e.clientY,
        origX:   asset.x || 0,
        origY:   asset.y || 0,
        scaleX,
        scaleY,
        moved:   false,
        isDup:   e.altKey,
      };

      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      document.querySelectorAll('.asset-wrapper.selected').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
      buildPresets();
      buildTimeline();
      buildRightPanel();
    });

    wrap.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;

      if (!drag.moved && Math.hypot(dx, dy) > 3) {
        drag.moved = true;
        if (!drag.isDup) pushUndo('Move asset');
      }
      if (!drag.moved) return;

      // Both normal drag and alt+drag move the element visually — on release we decide
      drag.asset.x = drag.origX + dx * drag.scaleX;
      drag.asset.y = drag.origY + dy * drag.scaleY;
      clampAssetPosition(drag.asset);
      drag.el.style.cssText = assetPositionStyle(drag.asset);
    });

    wrap.addEventListener('pointerup',           finishDrag);
    wrap.addEventListener('pointercancel',        finishDrag);
    wrap.addEventListener('lostpointercapture',   finishDrag);
  }

        const dupBtn = document.createElement('button');

        dupBtn.className = 'menu-action';

  // ═══════════════════════════════════════════════════════════════════════════
  // RESIZABLE SIDE PANELS
  // ═══════════════════════════════════════════════════════════════════════════
  const PANEL_STORAGE_KEY = 'vom-panel-widths-v1';
  const TIMELINE_STORAGE_KEY = 'vom-timeline-height-v1';
  const TIMELINE_LABEL_STORAGE_KEY = 'vom-timeline-label-width-v1';
  const PANEL_LIMITS = {
    left: { min: 280, max: 540, def: 300 },
    right: { min: 240, max: 560, def: 320 },
    centerMin: 360,
    resizers: 2,
  };
  const TIMELINE_LIMITS = {
    min: 120,
    max: 440,
    def: 180,
    canvasMin: 220,
    toolbar: 40,
    resizer: 1,
  };
  const TIMELINE_LABEL_LIMITS = {
    min: 150,
    max: 420,
    def: 220,
    trackMin: 280,
    resizer: 1,
  };

  function clampPanelValue(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function readPanelWidth(side) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(`--${side}-panel-w`);
    return parseFloat(raw) || PANEL_LIMITS[side].def;
  }

  function fitPanelWidths(left, right) {
    const shell = document.getElementById('workspace-shell');
    const total = shell?.getBoundingClientRect().width || window.innerWidth || 1440;
    left = clampPanelValue(left, PANEL_LIMITS.left.min, PANEL_LIMITS.left.max);
    right = clampPanelValue(right, PANEL_LIMITS.right.min, PANEL_LIMITS.right.max);

    const maxSides = Math.max(
      PANEL_LIMITS.left.min + PANEL_LIMITS.right.min,
      total - PANEL_LIMITS.centerMin - PANEL_LIMITS.resizers
    );

    if (left + right > maxSides) {
      let overflow = left + right - maxSides;
      const leftFlex = Math.max(0, left - PANEL_LIMITS.left.min);
      const rightFlex = Math.max(0, right - PANEL_LIMITS.right.min);
      const flex = leftFlex + rightFlex;
      if (flex > 0) {
        const leftCut = Math.min(leftFlex, overflow * (leftFlex / flex));
        left -= leftCut;
        overflow -= leftCut;
        right -= Math.min(rightFlex, overflow);
      } else {
        left = PANEL_LIMITS.left.min;
        right = PANEL_LIMITS.right.min;
      }
    }

    return {
      left: Math.round(clampPanelValue(left, PANEL_LIMITS.left.min, PANEL_LIMITS.left.max)),
      right: Math.round(clampPanelValue(right, PANEL_LIMITS.right.min, PANEL_LIMITS.right.max)),
    };
  }

  function applyPanelWidths(left, right, persist=false) {
    const fitted = fitPanelWidths(left, right);
    document.documentElement.style.setProperty('--left-panel-w', fitted.left + 'px');
    document.documentElement.style.setProperty('--right-panel-w', fitted.right + 'px');
    if (persist) {
      try { localStorage.setItem(PANEL_STORAGE_KEY, JSON.stringify(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initPanelResize() {
    const shell = document.getElementById('workspace-shell');
    const leftHandle = document.getElementById('left-panel-resizer');
    const rightHandle = document.getElementById('right-panel-resizer');
    if (!shell || !leftHandle || !rightHandle) return;

    try {
      const saved = JSON.parse(localStorage.getItem(PANEL_STORAGE_KEY) || 'null');
      if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.right)) {
        applyPanelWidths(saved.left, saved.right, false);
      } else {
        applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false);
      }
    } catch(_) {
      applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false);
    }

    const startDrag = (side, handle, ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      const rect = shell.getBoundingClientRect();
      const start = {
        side,
        handle,
        left: readPanelWidth('left'),
        right: readPanelWidth('right'),
        shellLeft: rect.left,
        shellRight: rect.right,
      };

      handle.classList.add('is-dragging');
      document.body.classList.add('resizing-panels');
      try { handle.setPointerCapture(ev.pointerId); } catch(_) {}

      const move = e => {
        let nextLeft = start.left;
        let nextRight = start.right;
        if (side === 'left') {
          nextLeft = e.clientX - start.shellLeft;
        } else {
          nextRight = start.shellRight - e.clientX;
        }
        applyPanelWidths(nextLeft, nextRight, false);
      };

      const stop = e => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-panels');
        try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
        applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), true);
      };

      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
      move(ev);
    };

    const resizeByKeyboard = (side, delta) => {
      const left = readPanelWidth('left');
      const right = readPanelWidth('right');
      if (side === 'left') applyPanelWidths(left + delta, right, true);
      else applyPanelWidths(left, right + delta, true);
    };

    leftHandle.addEventListener('pointerdown', ev => startDrag('left', leftHandle, ev));
    rightHandle.addEventListener('pointerdown', ev => startDrag('right', rightHandle, ev));
    leftHandle.addEventListener('dblclick', () => applyPanelWidths(PANEL_LIMITS.left.def, readPanelWidth('right'), true));
    rightHandle.addEventListener('dblclick', () => applyPanelWidths(readPanelWidth('left'), PANEL_LIMITS.right.def, true));
    leftHandle.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        resizeByKeyboard('left', e.key === 'ArrowLeft' ? -20 : 20);
      }
    });
    rightHandle.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        resizeByKeyboard('right', e.key === 'ArrowLeft' ? 20 : -20);
      }
    });
    window.addEventListener('resize', () => applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false));
  }

  function readTimelineHeight() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--timeline-panel-h');
    return parseFloat(raw) || TIMELINE_LIMITS.def;
  }

  function fitTimelineHeight(height) {
    const center = document.getElementById('center-panel');
    const total = center?.getBoundingClientRect().height || window.innerHeight || 720;
    const availableMax = total - TIMELINE_LIMITS.toolbar - TIMELINE_LIMITS.resizer - TIMELINE_LIMITS.canvasMin;
    const max = Math.max(TIMELINE_LIMITS.min, Math.min(TIMELINE_LIMITS.max, availableMax));
    return Math.round(clampPanelValue(height, TIMELINE_LIMITS.min, max));
  }

  function applyTimelineHeight(height, persist=false) {
    const fitted = fitTimelineHeight(height);
    document.documentElement.style.setProperty('--timeline-panel-h', fitted + 'px');
    if (persist) {
      try { localStorage.setItem(TIMELINE_STORAGE_KEY, String(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initTimelineResize() {
    const center = document.getElementById('center-panel');
    const handle = document.getElementById('timeline-resizer');
    if (!center || !handle) return;

    try {
      const saved = parseFloat(localStorage.getItem(TIMELINE_STORAGE_KEY) || '');
      applyTimelineHeight(Number.isFinite(saved) ? saved : readTimelineHeight(), false);
    } catch(_) {
      applyTimelineHeight(readTimelineHeight(), false);
    }

    const startDrag = ev => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      const startY = ev.clientY;
      const startHeight = readTimelineHeight();

      handle.classList.add('is-dragging');
      document.body.classList.add('resizing-timeline');
      try { handle.setPointerCapture(ev.pointerId); } catch(_) {}

      const move = e => {
        applyTimelineHeight(startHeight - (e.clientY - startY), false);
      };

      const stop = e => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-timeline');
        try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
        applyTimelineHeight(readTimelineHeight(), true);
      };

      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
      move(ev);
    };

    handle.addEventListener('pointerdown', startDrag);
    handle.addEventListener('dblclick', () => applyTimelineHeight(TIMELINE_LIMITS.def, true));
    handle.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        applyTimelineHeight(readTimelineHeight() + (e.key === 'ArrowUp' ? 20 : -20), true);
      }
    });
    window.addEventListener('resize', () => applyTimelineHeight(readTimelineHeight(), false));
  }

  function readTimelineLabelWidth() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--timeline-label-w');
    return parseFloat(raw) || TIMELINE_LABEL_LIMITS.def;
  }

  function fitTimelineLabelWidth(width) {
    const body = document.getElementById('timeline-body');
    const total = body?.getBoundingClientRect().width || window.innerWidth || 900;
    const availableMax = total - TIMELINE_LABEL_LIMITS.trackMin - TIMELINE_LABEL_LIMITS.resizer;
    const max = Math.max(TIMELINE_LABEL_LIMITS.min, Math.min(TIMELINE_LABEL_LIMITS.max, availableMax));
    return Math.round(clampPanelValue(width, TIMELINE_LABEL_LIMITS.min, max));
  }

  function applyTimelineLabelWidth(width, persist=false) {
    const fitted = fitTimelineLabelWidth(width);
    document.documentElement.style.setProperty('--timeline-label-w', fitted + 'px');
    if (persist) {
      try { localStorage.setItem(TIMELINE_LABEL_STORAGE_KEY, String(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initTimelineColumnResize() {
    const handle = document.getElementById('timeline-column-resizer');
    if (!handle) return;

    try {
      const saved = parseFloat(localStorage.getItem(TIMELINE_LABEL_STORAGE_KEY) || '');

        document.removeEventListener('pointermove', move);

        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-timeline-column');

        applyTimelineLabelWidth(readTimelineLabelWidth(), true);

      document.addEventListener('pointermove', move);

      document.addEventListener('pointercancel', stop);
      move(ev);
    };

    handle.addEventListener('pointerdown', startDrag);
    handle.addEventListener('dblclick', () => applyTimelineLabelWidth(TIMELINE_LABEL_LIMITS.def, true));
    handle.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {

  function initSoftScrollbars() {
    const timers = new WeakMap();
    document.addEventListener('scroll', e => {
      const el = e.target;
      if (!(el instanceof HTMLElement)) return;
      el.classList.add('is-scrolling');
      const prev = timers.get(el);
      if (prev) window.clearTimeout(prev);
      timers.set(el, window.setTimeout(() => {
        el.classList.remove('is-scrolling');
        timers.delete(el);
      }, 850));
    }, true);
  }

  document.getElementById('json-import').onchange = function(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const cfg = JSON.parse(ev.target.result);
        // Validate it's a Vibe on Motion project file
        if (!cfg.layers && !cfg.file && !cfg.assets) { alert('This does not appear to be a Vibe on Motion project file.'); return; }
        pushUndo('Load project');
        if (cfg.assets && Array.isArray(cfg.assets)) {
          S.assets = cfg.assets.map(a => ({ ...a, id:a.id || newAssetId(), type:a.type, data:a.data, name:a.name || 'Asset', x:parseFloat(a.x)||0, y:parseFloat(a.y)||0, visible:a.visible !== false }));
          S.activeAssetId = cfg.activeAssetId || S.assets[0]?.id || null;
        } else if (cfg.file) {
          S.assets = [{ id:newAssetId(), type:cfg.file.type, data:cfg.file.data, name:cfg.file.name || 'Asset', x:parseFloat(cfg.assetX)||0, y:parseFloat(cfg.assetY)||0, visible:true }];
          S.activeAssetId = S.assets[0].id;
        }
        if (cfg.layers)  S.layers  = cfg.layers;
        if (cfg.scale)   S.scale   = cfg.scale;
        if (cfg.sel)     S.sel     = cfg.sel;
        if (cfg.size)    S.size    = cfg.size;
        if (cfg.bg)      S.bg      = cfg.bg;
        if (cfg.customBg) S.customBg = cfg.customBg;
        if (cfg.customBg2) S.customBg2 = cfg.customBg2;
        if (cfg.compDur) S.compDur = cfg.compDur;
        normalizeProjectState();
        setCustomBgInputs(S.customBg || '#FFFFFF', S.customBg2 || '#FFB000');
        refreshAll();
        setBg(S.bg);
        applySize(S.size);
        const durEl = document.getElementById('comp-dur-val');
        if (durEl) durEl.value = S.compDur.toFixed(1);
      } catch(err) { alert('Could not load project: '+err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  function resetLayer(id) {
    const l = S.layers.find(x => x.id === id); if(!l) return;
    const fresh = mkLayer(l.presetId); if(!fresh) return;
    pushUndo('Reset layer');
    Object.assign(l, { duration:fresh.duration, delay:fresh.delay, easing:fresh.easing, direction:fresh.direction, playback:fresh.playback, params:{...fresh.params} });
    refreshAll();
  }

  // PLAYBACK
  // ═══════════════════════════════════════════════════════════════════════════
  function togglePlay() {
    S.playing = !S.playing;
    const btn = document.getElementById('play-btn');
    if(btn) btn.innerHTML = S.playing ? '<i data-lucide="pause" class="w-3.5 h-3.5"></i>' : '<i data-lucide="play" class="w-3.5 h-3.5"></i>';
    lucide.createIcons();
    if(S.playing) {
      rafStart = performance.now() - S.time * 1000;
      raf = requestAnimationFrame(tick);
    } else {
      if(raf) cancelAnimationFrame(raf); raf = null;
    }
    renderGraphic();
  }

  function tick(ts) {
    if(!S.playing) return;
    const total = getTotalDur();
    const newTime = (ts - rafStart) / 1000;
    if (newTime >= total) {
      rafStart = ts;
      S.time = 0;
      renderGraphic();
    } else {
      S.time = newTime;
      renderGraphic();
    }
    updatePlayhead();
    raf = requestAnimationFrame(tick);
  }

  function restartAnim() {
    S.time = 0;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
    if(S.playing) {
      rafStart = performance.now();
      raf = requestAnimationFrame(tick);
    } else {
      renderGraphic();
      updatePlayhead();
    }
  }

  function exportBaseName(ext='') {
    const base = currentAsset() ? currentAsset().name.replace(/\.[^.]+$/, '') : 'vibe-project';
    return base + (ext ? '.' + ext.replace(/^\./, '') : '');
  }

  async function saveBlob(blob, filename) {
    if (window.showSaveFilePicker) {
      try {
        const ext = (filename.split('.').pop() || '').toLowerCase();
        const mime = blob.type || 'application/octet-stream';
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'Vibe on Motion export', accept: { [mime]: ['.' + ext] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  function dataURLToBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = (parts[0].match(/:(.*?);/) || [,'application/octet-stream'])[1];
    const bin = atob(parts[1] || '');
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  async function exportJSON() {
    normalizeProjectState();
    const cfg = { assets: S.assets, activeAssetId: S.activeAssetId, layers: S.layers, scale: S.scale, sel: S.sel, size: S.size, bg: S.bg, customBg: S.customBg, customBg2: S.customBg2, file: currentAsset(), compDur: S.compDur };
    const blob = new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'});
    await saveBlob(blob, (currentAsset() ? currentAsset().name.replace(/\.[^.]+$/, '') + '-vibe' : 'vibe-project') + '.json');
  }

  function buildCSSCode() {
    if (!S.layers.length) { alert('No animations applied yet. Add a preset first.'); return ''; }
    // Build CSS keyframe + class for each visible layer
    const lines = [];
    lines.push('/* === Vibe on Motion — CSS Animation Code === */');
    lines.push('/* Paste these styles into your stylesheet,     */');
    lines.push('/* then add class "vom-animated" to any element */');
    lines.push('');

    // Collect unique keyframe names
    const usedKf = [...new Set(S.layers.filter(l => l.visible).map(l => l.kf))];
    usedKf.forEach(kf => {
      // Map known keyframe names to their definitions
      const kfMap = {
        'kf-fade':        '@keyframes kf-fade        { 0%{opacity:0} 100%{opacity:1} }',
        'kf-slide':       '@keyframes kf-slide       { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0));opacity:var(--slide-fade,0)} 100%{transform:translate(0,0);opacity:1} }',
        'kf-move':        '@keyframes kf-move        { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0))} 100%{transform:translate(0,0)} }',
        'kf-grow':        '@keyframes kf-grow        { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }',
        'kf-shrink':      '@keyframes kf-shrink      { 0%{transform:scale(1.6);opacity:0} 100%{transform:scale(1);opacity:1} }',
        'kf-spin':        '@keyframes kf-spin        { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }',
        'kf-float':       '@keyframes kf-float       { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--float-y,-24px))} }',
        'kf-bounce':      '@keyframes kf-bounce      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--bounce-y,-36px))} }',
        'kf-pulse':       '@keyframes kf-pulse       { 0%,100%{transform:scale(1)} 50%{transform:scale(var(--pulse-scale,1.1))} }',
        'kf-rotate':      '@keyframes kf-rotate      { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }',
        'kf-blur':        '@keyframes kf-blur        { 0%{filter:blur(var(--blur-px,20px))} 100%{filter:blur(0)} }',
        'kf-blur-slide':  '@keyframes kf-blur-slide  { 0%{filter:blur(var(--blur-px,20px));transform:translateX(-40px)} 100%{filter:blur(0);transform:translateX(0)} }',
        'kf-blur-scale':  '@keyframes kf-blur-scale  { 0%{filter:blur(var(--blur-px,20px));transform:scale(1.5)} 100%{filter:blur(0);transform:scale(1)} }',
        'kf-soft-blur':   '@keyframes kf-soft-blur   { 0%{filter:blur(var(--blur-px,10px));opacity:0} 100%{filter:blur(0);opacity:1} }',
        'kf-mask-top':    '@keyframes kf-mask-top    { 0%{clip-path:inset(100% 0 0 0)} 100%{clip-path:inset(0)} }',
        'kf-mask-bottom': '@keyframes kf-mask-bottom { 0%{clip-path:inset(0 0 100% 0)} 100%{clip-path:inset(0)} }',
        'kf-mask-left':   '@keyframes kf-mask-left   { 0%{clip-path:inset(0 0 0 100%)} 100%{clip-path:inset(0)} }',
        'kf-mask-right':  '@keyframes kf-mask-right  { 0%{clip-path:inset(0 100% 0 0)} 100%{clip-path:inset(0)} }',
        'kf-mask-center': '@keyframes kf-mask-center { 0%{clip-path:circle(0%)} 100%{clip-path:circle(100%)} }',
        'kf-mask-expand': '@keyframes kf-mask-expand { 0%{clip-path:ellipse(0% 0% at 50% 50%)} 100%{clip-path:ellipse(100% 100% at 50% 50%)} }',
        'kf-mask-slide':  '@keyframes kf-mask-slide  { 0%{clip-path:inset(0 100% 0 0);transform:translateX(-20px)} 100%{clip-path:inset(0);transform:translateX(0)} }',
        'kf-mask-resize': '@keyframes kf-mask-resize { 0%{clip-path:inset(20% 20% 20% 20%)} 100%{clip-path:inset(0)} }',
        'kf-scale-pop':   '@keyframes kf-scale-pop   { 0%{transform:scale(0)} 70%{transform:scale(var(--pop-scale,1.25))} 100%{transform:scale(1)} }',
        'kf-move-scale':  '@keyframes kf-move-scale  { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0)) scale(0)} 100%{transform:translate(0,0) scale(1)} }',
        'kf-trim-paths':  '@keyframes kf-trim-paths  { 0%{stroke-dashoffset:var(--path-len,2000)} 100%{stroke-dashoffset:var(--trim-offset,0)} }',
        'kf-wiggle':      '@keyframes kf-wiggle      { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }',
        'kf-wave':        '@keyframes kf-wave        { 0%,100%{transform:rotate(0deg) translateY(0)} 25%{transform:rotate(5deg) translateY(-6px)} 75%{transform:rotate(-5deg) translateY(6px)} }',
        'kf-glitch':      '@keyframes kf-glitch      { 0%,100%{transform:translate(0);filter:none} 10%{transform:translate(-4px,2px);filter:drop-shadow(-4px 0 0 red) drop-shadow(4px 0 0 blue)} 50%{transform:translate(0);filter:none} }',
        'kf-neon-glow':   '@keyframes kf-neon-glow   { 0%,100%{filter:drop-shadow(0 0 2px var(--glow-color,#FFB000))} 50%{filter:drop-shadow(0 0 12px var(--glow-color,#FFB000)) drop-shadow(0 0 24px var(--glow-color,#FFB000))} }',
        'kf-elastic-pop': '@keyframes kf-elastic-pop { 0%{transform:scale(0)} 50%{transform:scale(1.2)} 75%{transform:scale(.92)} 100%{transform:scale(1)} }',
        'kf-jelly':       '@keyframes kf-jelly       { 0%,100%{transform:scale(1,1)} 30%{transform:scale(1.2,.8)} 50%{transform:scale(.9,1.15)} 70%{transform:scale(1.05,.95)} }',
        'kf-luxury':      '@keyframes kf-luxury      { 0%{transform:translateY(20px) scale(.96);opacity:0;filter:blur(8px)} 100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)} }',
        'kf-loot-glow':   '@keyframes kf-loot-glow   { 0%,100%{filter:drop-shadow(0 0 4px gold) brightness(1)} 50%{filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 40px gold) brightness(1.4)} }',
        'kf-hover-bounce':'@keyframes kf-hover-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }',
        'kf-card-lift':   '@keyframes kf-card-lift   { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.02)} }',
      };
      if (kfMap[kf]) lines.push(kfMap[kf]);
    });

    lines.push('');

    // Generate a class per layer
    S.layers.filter(l => l.visible).forEach((l, i) => {
      const p = l.params || {};
      const iters = 'infinite'; // loops always show infinite; one-shots show '1'
      const preset = getPreset(l.presetId);
      const isLoop = preset ? preset.loop : false;
      const vars = [];
      if (p.blurAmt     !== undefined) vars.push(`  --blur-px: ${p.blurAmt}px;`);
      if (p.rotDeg      !== undefined) { vars.push(`  --rot-deg: ${p.rotDeg}deg;`); }
      if (p.floatDist   !== undefined) vars.push(`  --float-y: -${p.floatDist}px;`);
      if (p.bounceH     !== undefined) vars.push(`  --bounce-y: -${p.bounceH}px;`);
      if (p.pulseScale  !== undefined) vars.push(`  --pulse-scale: ${p.pulseScale};`);
      if (p.popScale    !== undefined) vars.push(`  --pop-scale: ${p.popScale};`);
      if (p.glowColor   !== undefined) vars.push(`  --glow-color: ${p.glowColor};`);
      if (p.slideDist   !== undefined) {
        const dir = p.slideDir || 'left';
        const x = (dir==='left'?-1:dir==='right'?1:0) * p.slideDist;
        const y = (dir==='top'?-1:dir==='bottom'?1:0) * p.slideDist;
        vars.push(`  --slide-x: ${x}px;`);
        vars.push(`  --slide-y: ${y}px;`);
      }
      if (l.presetId === 'trim-paths') {
        const trimEnd = Math.max(0, Math.min(100, parseFloat(p.trimEnd ?? 100)));
        const trimOffset = Math.round(2000 * (1 - trimEnd / 100));
        vars.push(`  /* Tip: set --path-len on each path to its getTotalLength() for accurate timing */`);
        vars.push(`  --path-len: 2000;`);
        vars.push(`  --trim-offset: ${trimOffset};`);
        vars.push(`  stroke-dasharray: var(--path-len);`);
        vars.push(`  fill: transparent;`);
        vars.push(`  stroke-width: ${p['stroke-width'] ?? 2}px;`);
        vars.push(`  stroke-linecap: ${p['stroke-cap'] ?? 'round'};`);
        vars.push(`  stroke-linejoin: round;`);
        vars.push(`  stroke: ${p['stroke-c1'] || '#FFB000'};`);
      }

      let kf = l.kf;
      if (l.presetId === 'mask-reveal' && p.maskDir) kf = 'kf-mask-' + p.maskDir;

      lines.push(`.vom-layer-${i+1} {`);
      if (vars.length) lines.push(...vars);
      lines.push(`  animation: ${kf} ${l.duration}s ${l.easing} ${l.delay}s ${isLoop ? 'infinite' : '1'} ${l.direction === 'out' ? 'reverse' : 'normal'} forwards;`);
      lines.push('}');
      lines.push('');
    });

    lines.push('/* HTML usage example:');
    S.layers.filter(l => l.visible).forEach((l, i) => {
      lines.push(`  <div class="vom-layer-${i+1}">`);
      if (i === S.layers.filter(x => x.visible).length - 1) lines.push('    <!-- your content here -->');
      lines.push('  </div>');
    });
    lines.push('*/');

    return lines.join('\n');
  }

  function copyCodeJSON() {
    const code = buildCSSCode();
    if (!code) return;
    try {
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copy-btn-lbl');
        if (btn) { btn.textContent = '✓ COPIED!'; setTimeout(() => btn.textContent = 'COPY CSS CODE', 2000); }
      }).catch(() => fallbackCopy(code));
    } catch(e) { fallbackCopy(code); }
  }

  function downloadCSSCode() {
    const code = buildCSSCode();
    if (!code) return;
    saveBlob(new Blob([code], {type:'text/css'}), exportBaseName('css'));
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copy-btn-lbl');
    if (btn) { btn.textContent = '✓ COPIED!'; setTimeout(() => btn.textContent = 'COPY CSS CODE', 2000); }
  }

  async function loadGifshot() {
    if (window.gifshot) return window.gifshot;
    return new Promise((resolve, reject) => {
      console.log("gifshot not found. Attempting fallback CDN...");
      const s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js";
      s.onload = () => {
        if (window.gifshot) resolve(window.gifshot);
        else reject(new Error("Loaded script did not define gifshot"));
      };
      s.onerror = () => {
        const s2 = document.createElement('script');
        s2.src = "https://unpkg.com/gifshot@0.4.5/dist/gifshot.min.js";
        s2.onload = () => {
          if (window.gifshot) resolve(window.gifshot);
          else reject(new Error("Loaded unpkg script did not define gifshot"));
        };
        s2.onerror = () => reject(new Error("Failed to load gifshot. Check your internet connection."));
        document.head.appendChild(s2);
      };
      document.head.appendChild(s);
    });
  }


  // Pre-rasterize SVG to a clean PNG data URL to avoid canvas taint
  function rasterizeSvgToDataURL(svgString, width, height) {
    return new Promise((resolve, reject) => {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width || 400;
      offCanvas.height = height || 400;
      const offCtx = offCanvas.getContext('2d');
      const svgBase64 = btoa(unescape(encodeURIComponent(svgString)));
      const dataUri = 'data:image/svg+xml;base64,' + svgBase64;
      const img = new Image();
      img.onload = () => {
        offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
        offCtx.drawImage(img, 0, 0, offCanvas.width, offCanvas.height);
        try { resolve(offCanvas.toDataURL('image/png')); }
        catch(e) { reject(e); }
      };
      img.onerror = () => reject(new Error('SVG rasterization failed'));
      img.src = dataUri;
    });
  }

  // ── Lottie Export (transform-based presets) ──────────────────────────────
  // Supports: fade, grow, shrink, spin, rotate, move*, pulse, float, bounce, wiggle, wave
  // Effects like blur/glitch/mask are skipped (no Lottie equivalent).
  function generateLottieJSON(state, assetDataUrl, assetW, assetH) {
    const [wStr, hStr] = (state.size || '400x400').split('x');
    const W = parseInt(wStr) || 400, H = parseInt(hStr) || 400;
    const fr = 30, totalDur = state.compDur || 5, op = Math.round(totalDur * fr);
    const cx = W/2 + (state.assetX || 0), cy = H/2 + (state.assetY || 0);
    const visLayers = state.layers.filter(l => l.visible);
    const ease = { i:{x:0.42,y:1}, o:{x:0.58,y:0} };
    const staticVal = (v) => ({ a: 0, k: v });
    const animVal = (kfs) => ({ a: 1, k: kfs });
    const maxSz = Math.min(W,H)*0.8;
    let dw=maxSz, dh=maxSz;
    if (assetW && assetH) { const ar=assetW/assetH; if(ar>1) dh=dw/ar; else dw=dh*ar; }
    function sampleAt(t) {
      let tx=0,ty=0,sc=1,rot=0,opacity=1;
      visLayers.forEach(l => {
        const p=l.params||{}, delay=l.delay||0, dur=l.duration||1.5, id=l.presetId;
        const isLoop=['float','pulse','bounce','rotate','spin','wiggle','wave'].includes(id);
        let prog;
        if(isLoop){ prog=((t-delay)/dur)%1; if(t<delay)prog=0; if(prog<0)prog=0; }
        else { if(t<delay)prog=0; else if(t>delay+dur)prog=1; else prog=(t-delay)/dur; }
        const dist=p.slideDist||60;
        if(id==='fade'){opacity*=(t<delay?0:prog);}
        else if(id==='grow'){sc*=prog;opacity*=prog;}
        else if(id==='shrink'){sc*=(1.6-0.6*prog);opacity*=prog;}
        else if(id==='spin'){rot+=-((p.rotDeg||360))*(1-prog);sc*=prog;opacity*=prog;}
        else if(id==='rotate'){rot+=(p.rotDeg||360)*prog;}
        else if(id.indexOf('move')===0){
          const dir=p.slideDir||(id==='move-in-right'?'right':id==='move-in-left'?'left':id==='move-top'?'top':id==='move-bottom'?'bottom':'left');
          const dx=(dir==='left'?-1:dir==='right'?1:0)*dist, dy=(dir==='top'?-1:dir==='bottom'?1:0)*dist;
          tx+=(1-prog)*dx; ty+=(1-prog)*dy;
        }
        else if(id==='pulse'){const peak=(p.pulseScale||1.1);sc*=(1+(peak-1)*Math.sin(prog*Math.PI));}
        else if(id==='float'){ty+=-Math.sin(prog*2*Math.PI)*(p.floatDist||24);}
        else if(id==='bounce'){ty+=-Math.abs(Math.sin(prog*Math.PI))*(p.bounceH||36);}
        else if(id==='wiggle'){rot+=Math.sin(prog*2*Math.PI)*6;}
        else if(id==='wave'){rot+=Math.sin(prog*2*Math.PI)*5;ty+=Math.sin(prog*2*Math.PI)*-6;}
      });
      return {tx,ty,sc,rot,op:opacity};
    }
    const posKf=[],scaleKf=[],rotKf=[],opKf=[];
    for(let f=0;f<=op;f++){
      const t=f/fr, s=sampleAt(t);
      posKf.push({t:f,s:[cx+s.tx,cy+s.ty,0]});
      scaleKf.push({t:f,s:[s.sc*100,s.sc*100,100]});
      rotKf.push({t:f,s:[s.rot]});
      opKf.push({t:f,s:[Math.max(0,Math.min(1,s.op))*100]});
    }
    function maybeStatic(kfs){
      const first=JSON.stringify(kfs[0].s);
      if(kfs.every(k=>JSON.stringify(k.s)===first)) return staticVal(kfs[0].s.length===1?kfs[0].s[0]:kfs[0].s);
      return animVal(kfs.map((k,i)=>i<kfs.length-1?{...k,...ease}:k));
    }
    return {
      v:"5.7.4",fr:fr,ip:0,op:op,w:W,h:H,nm:"Vibe on Motion Export",ddd:0,
      assets:[{id:"asset_0",w:Math.round(assetW||dw),h:Math.round(assetH||dh),u:"",p:assetDataUrl,e:1}],
      layers:[{ddd:0,ind:1,ty:2,nm:"Graphic",refId:"asset_0",sr:1,
        ks:{o:maybeStatic(opKf),r:maybeStatic(rotKf),p:maybeStatic(posKf),
            a:staticVal([(assetW||dw)/2,(assetH||dh)/2,0]),s:maybeStatic(scaleKf)},
        ao:0,ip:0,op:op,st:0,bm:0}],
      markers:[]
    };
  }

  function exportLottie() {
    const asset = currentAsset();
    if(!asset){ alert('No file uploaded.'); return; }
    const supported = ['fade','grow','shrink','spin','rotate','move-in-right','move-in-left','move-top','move-bottom','pulse','float','bounce','wiggle','wave'];
    const visLayers = S.layers.filter(l => l.visible && l.assetId === asset.id);
    const unsupported = visLayers.filter(l => !supported.includes(l.presetId)).map(l => l.name);
    if (visLayers.length && unsupported.length === visLayers.length) {
      alert('None of your current animations can be exported to Lottie. Lottie supports transform presets (fade, scale, move, rotate, pulse, float, bounce, etc.) but not effects like blur, glitch, or mask.');
      return;
    }
    const proceed = () => {
      // Determine asset dimensions
      const finishExport = (dataUrl, aw, ah) => {
        try {
          const exportState = { ...S, layers: visLayers, assetX: asset.x || 0, assetY: asset.y || 0 };
          const lottie = generateLottieJSON(exportState, dataUrl, aw, ah);
          const blob = new Blob([JSON.stringify(lottie)], {type:'application/json'});
          saveBlob(blob, (asset.name ? asset.name.replace(/\.[^.]+$/, '') : 'vibe-on-motion') + '.json');
          if (unsupported.length) {
            setTimeout(() => alert('Lottie exported! Note: these effects were skipped (no Lottie equivalent): ' + unsupported.join(', ')), 300);
          }
        } catch(e) { alert('Lottie export failed: ' + e.message); }
      };
      if (asset.type === 'svg') {
        // Rasterize SVG to PNG data URL for embedding (Lottie image layer)
        const [wStr,hStr] = (S.size||'400x400').split('x');
        const cw = parseInt(wStr)||400, ch = parseInt(hStr)||400;
        rasterizeSvgToDataURL(asset.data, cw, ch).then(png => {
          const im = new Image();
          im.onload = () => finishExport(png, im.width, im.height);
          im.onerror = () => finishExport(png, cw, ch);
          im.src = png;
        }).catch(() => {
          finishExport('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(asset.data))), 300, 300);
        });
      } else {
        const im = new Image();
        im.onload = () => finishExport(asset.data, im.width, im.height);
        im.onerror = () => finishExport(asset.data, 300, 300);
        im.src = asset.data;
      }
    };
    proceed();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GIF EXPORT — frame-capture via html-to-image (captures ALL visible effects)
  // ═══════════════════════════════════════════════════════════════════════════
  function _loadScript(src){
    return new Promise((res,rej)=>{
      if([...document.scripts].some(s=>s.src===src)) return res();
      const sc=document.createElement('script'); sc.src=src;
      sc.onload=()=>res(); sc.onerror=()=>rej(new Error('Failed to load '+src));
      document.head.appendChild(sc);
    });
  }

  async function _ensureLibs(){
    if(!window.htmlToImage) await _loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js');
    if(!window.gifshot) await loadGifshot();
    if(!window.htmlToImage) throw new Error('Could not load frame capture library.');
    if(!window.gifshot || typeof window.gifshot.createGIF !== 'function') throw new Error('Could not load GIF export library.');
  }

  function _setGifLoading(on,label){
    ['gif-btn','gif-btn2'].forEach(id=>{
      const b=document.getElementById(id); if(!b) return;
      b.disabled=on;
      b.innerHTML = on
        ? `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>${label||'Building…'}</span>`
        : '<i data-lucide="film" class="w-3.5 h-3.5"></i><span>EXPORT GIF</span>';
    });
    if(window.lucide) lucide.createIcons();
  }

  async function exportGIF(){
    if(!hasAssets()){ alert('Upload a file and apply a preset first.'); return; }
    if(!S.layers.filter(l=>l.visible).length){ alert('Apply at least one preset first.'); return; }

    const board = document.getElementById('canvas-target');
    if(!board){ alert('Nothing to export.'); return; }

    _setGifLoading(true,'Loading…');

    // Remember UI state so we can restore it after capture
    const prevPlaying = S.playing;
    const prevTime    = S.time;
    if(prevPlaying){ S.playing=false; }   // pause; we drive frames manually

    try{
      await _ensureLibs();

      const [wStr,hStr] = (S.size||'400x400').split('x');
      const cw = parseInt(wStr)||400, ch = parseInt(hStr)||400;

      const total = (typeof getTotalDur==='function') ? getTotalDur() : (S.compDur||S.duration||3);
      const FPS = 20;
      const N   = Math.max(2, Math.min(180, Math.ceil(total*FPS)));
      const delayMs = Math.max(20, Math.round((total*1000)/(N-1)));

      // GIF has no alpha, so transparent exports use a solid fallback color.
      let bgHex = '#ffffff';
      if(S.bg==='dark') bgHex='#000000';
      else if(S.bg==='light') bgHex='#fafaf9';
      else if(S.bg==='custom'){ const el=document.getElementById('bg-custom-color'); if(el) bgHex=el.value; }
      else if(S.bg==='gradient'){ const el=document.getElementById('bg-custom-color'); if(el) bgHex=el.value; }

      // Options tuned to avoid "tainted canvas / operation is insecure":
      //  - skipFonts/fontEmbedCSS: don't fetch cross-origin fonts
      //  - filter: drop any external <image>/<use href=http> nodes that taint the canvas
      const _filter = (node) => {
        if(!node || !node.tagName) return true;
        const tag = node.tagName.toLowerCase();
        if(tag === 'image'){
          const href = node.getAttribute && (node.getAttribute('href') || node.getAttribute('xlink:href') || '');
          if(href && /^https?:\/\//i.test(href) && href.indexOf(location.origin)!==0) return false;
        }
        return true;
      };
      const _captureOpts = {
        width: cw,
        height: ch,
        pixelRatio: 1,
        backgroundColor: bgHex,
        cacheBust: true,
        skipFonts: true,
        fontEmbedCSS: '',
        filter: _filter,
        style: {
          transform:'none',
          margin:'0',
          border:'0',
          boxShadow:'none',
          width:cw+'px',
          height:ch+'px',
          backgroundColor:bgHex
        }
      };

      const frames = [];
      S.renderingExport = true;

      // Capture each frame: set S.time, re-render DOM (negative-delay seek), snapshot
      for(let i=0;i<N;i++){
        const t = (i/(N-1))*total;
        S.time = t;
        renderGraphic();                    // seeks every layer to time t, paused
        // give the browser a tick to apply styles & lay out
        await new Promise(r=>requestAnimationFrame(()=>r()));

        let frameData;
        try{
          frameData = await htmlToImage.toPng(board, _captureOpts);
        }catch(e){
          // Fallback to canvas capture when PNG capture hits an edge case.
          try{
            const frameCanvas = await htmlToImage.toCanvas(board, _captureOpts);
            frameData = frameCanvas.toDataURL('image/png');
          }catch(e2){
            throw new Error('Frame capture failed at frame '+(i+1)+': '+e2.message);
          }
        }
        frames.push(frameData);

        _setGifLoading(true,`Frame ${i+1}/${N}`);
      }

      if(!frames.length) throw new Error('No frames were captured.');
      _setGifLoading(true,'Encoding…');

      await new Promise((resolve,reject)=>{
        window.gifshot.createGIF({
          images: frames,
          gifWidth: cw,
          gifHeight: ch,
          interval: delayMs/1000,
          numWorkers: 2,
          sampleInterval: 10,
          progressCallback: (progress) => {
            if(typeof progress === 'number') _setGifLoading(true,`Encoding ${Math.round(progress*100)}%`);
          }
        }, (obj) => {
          if(!obj || obj.error) {
            reject(new Error((obj && obj.errorMsg) || 'GIF render failed.'));
            return;
          }
          const asset = currentAsset();
          const filename=(asset&&asset.name?asset.name.replace(/\.[^.]+$/,''):'vibe-on-motion')+'.gif';
          saveBlob(dataURLToBlob(obj.image), filename).then(resolve).catch(reject);
        });
      });

    }catch(err){
      console.error(err);
      alert('GIF export failed: '+err.message);
    }finally{
      // restore UI state
      S.renderingExport = false;
      S.time = prevTime;
      S.playing = prevPlaying;
      renderGraphic();
      _setGifLoading(false);
    }
  }


  // ═══════════════════════════════════════════════════════════════════════════
  // REFRESH ALL
  // ═══════════════════════════════════════════════════════════════════════════
  function refreshAll() {
    buildPresets();
    renderGraphic();
    buildTimeline();
    buildRightPanel();
    updateMultiSelectUI();
  }

  function initScrubbing() {
    const ruler = document.getElementById('tl-ruler');
    const scroll = document.getElementById('tl-scroll');
    if (!ruler || !scroll) return;

    const onScrub = (ev, container) => {
      if (ev.button !== 0) return; // Left click only
      if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'BUTTON') return;
      ev.preventDefault();
      
      const wasPlaying = S.playing;
      if (wasPlaying) togglePlay(); // Pause playback while scrubbing

      const handler = (e) => {
        const rect = container.getBoundingClientRect();
        let x = e.clientX - rect.left + container.scrollLeft;
        x = Math.max(0, Math.min(getTotalDur() * PX_PER_SEC, x));
        S.time = Math.round((x / PX_PER_SEC) * 100) / 100;
        updatePlayhead();
        renderGraphic();
      };

      handler(ev);

      const mm = (e) => handler(e);
      const mu = () => {
        window.removeEventListener('mousemove', mm);
        window.removeEventListener('mouseup', mu);
      };
      window.addEventListener('mousemove', mm);
      window.addEventListener('mouseup', mu);
    };

    ruler.addEventListener('mousedown', (ev) => onScrub(ev, ruler));
    scroll.addEventListener('mousedown', (ev) => {
      if (ev.target.closest('.seg-block,.timeline-track-row')) return;
      onScrub(ev, scroll);
    });
  }

  function initUndoKeyboard() {
    window.addEventListener('keydown', e => {
      const target = e.target;
      const key = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && key === 's') {
        e.preventDefault();
        exportJSON();
        return;
      }
      const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
      if (typing) return;
      if ((e.ctrlKey || e.metaKey) && key === 'z') {
        e.preventDefault();
        if (e.shiftKey) redoProject();
        else undoProject();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && key === 'd') {
        e.preventDefault();
        duplicateSelectedAsset();
        return;
      }
      if (!e.ctrlKey && !e.metaKey && !e.altKey && (key === 'delete' || key === 'backspace')) {
        if (deleteSelectedArtboardObject()) e.preventDefault();
      }
    });
    window.addEventListener('pointerup', endContinuousUndo);
    window.addEventListener('mouseup', endContinuousUndo);
    window.addEventListener('keyup', endContinuousUndo);
    window.addEventListener('blur', endContinuousUndo);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════════════════════
  function init() {
    refreshAll();
    setBg(S.bg);
    applySize(S.size);
    lucide.createIcons();
    initScrubbing();
    initFileDrop();
    initObjectDrag();
    initArtboardContextMenu();
    initPanelResize();
    initTimelineResize();
    initTimelineColumnResize();
    initSoftScrollbars();

    // Wheel to scrub number inputs in transform panel
    document.addEventListener('wheel', e => {
      const wrap = e.target.closest?.('.tf-num-wrap');
      const el = e.target.classList?.contains('tf-num-input')
        ? e.target
        : wrap?.querySelector('.tf-num-input');
      if (!el) return;
      e.preventDefault();
      const step = parseFloat(el.step) || 1;
      const parsedMin = parseFloat(el.min);
      const parsedMax = parseFloat(el.max);
      const min  = Number.isFinite(parsedMin) ? parsedMin : -Infinity;
      const max  = Number.isFinite(parsedMax) ? parsedMax : Infinity;
      const cur  = parseFloat(el.value) || 0;
      const horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
      const direction = horizontal
        ? (e.deltaX > 0 ? 1 : -1)
        : (e.deltaY < 0 ? 1 : -1);
      const next = Math.max(min, Math.min(max, cur + direction * step));
      el.value = Math.round(next);
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }, { passive: false });
    initUndoKeyboard();

    // Close dropdowns on outside click
    window.addEventListener('click', () => {
      document.getElementById('size-drop')?.classList.add('hidden');
      document.getElementById('shape-drop')?.classList.add('hidden');
      document.getElementById('easing-drop')?.classList.add('hidden');
      document.getElementById('bg-custom-drop')?.classList.add('hidden');
      document.getElementById('stroke-mode-drop')?.classList.add('hidden');
      document.getElementById('bg-menu-btn')?.setAttribute('aria-expanded', 'false');
      document.getElementById('size-btn')?.setAttribute('aria-expanded', 'false');
      document.getElementById('shape-btn')?.setAttribute('aria-expanded', 'false');
    });

    // Alt key held → switch seg/row cursors to "copy"
    window.addEventListener('keydown', e => { if (e.key === 'Alt') document.body.classList.add('alt-held'); });
    window.addEventListener('keyup',   e => { if (e.key === 'Alt') document.body.classList.remove('alt-held'); });
    window.addEventListener('blur',    ()  => document.body.classList.remove('alt-held'));

    // Spacebar to play/pause
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        togglePlay();
      }
    });

    // Scroll to zoom
    const canvasContainer = document.getElementById('canvas-container');
    if (canvasContainer) {
      canvasContainer.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) return; // Ignore typical browser zoom
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        let newScale = S.scale + delta;
        newScale = Math.max(0.1, Math.min(3, newScale));
        setScale(newScale);
        window.clearTimeout(window.__vomScaleUndoTimer);
        window.__vomScaleUndoTimer = window.setTimeout(endContinuousUndo, 500);
      });
    }
  }
  if(document.readyState==='complete'||document.readyState==='interactive') init();
  else window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
