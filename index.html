<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe On Motion — Interactive Animation Workspace</title>
  <link rel="icon" type="image/png" href="VOM_favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { orange: '#FFB000', dark: '#050505' } } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js"></script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #000; height: 100vh; }
    body.theme-spatial .uppercase,
    body.theme-spatial [style*="text-transform:uppercase"],
    body.theme-spatial [style*="text-transform: uppercase"] { text-transform:none !important; }
    .font-outfit { font-family: 'Outfit', sans-serif; }
    .desktop-only-screen {
      display:none;
      min-height:100vh;
      padding:32px;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:#FAF9F6;
      color:#000;
    }
    .desktop-only-content { max-width:380px; }
    .desktop-only-logo {
      width:96px;
      height:auto;
      margin:0 auto 8px;
      display:block;
      object-fit:contain;
    }
    .desktop-only-brand {
      margin-bottom:18px;
      font-family:'Outfit', sans-serif;
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:none;
    }
    .desktop-only-screen h1 {
      margin:0 0 12px;
      font-family:'Outfit', sans-serif;
      font-size:32px;
      line-height:1;
      font-weight:900;
      letter-spacing:0;
      text-transform:none;
    }
    .desktop-only-screen p {
      margin:0;
      font-size:14px;
      line-height:1.6;
      color:#57534e;
    }
    @media (max-width: 1023px) {
      body > header,
      body > main { display:none !important; }
      .desktop-only-screen { display:flex; }
    }
    :root {
      --left-panel-w: 300px;
      --right-panel-w: 320px;
      --timeline-panel-h: 180px;
      --timeline-label-w: 220px;
      --panel-resizer-w: 1px;
      --panel-resizer-hit: 14px;
    }
    .workspace-header {
      display:block;
      grid-template-columns:var(--left-panel-w) minmax(0,1fr) var(--right-panel-w);
    }
    .workspace-shell {
      display:grid;
      grid-template-columns:var(--left-panel-w) var(--panel-resizer-w) minmax(360px,1fr) var(--panel-resizer-w) var(--right-panel-w);
    }
    .workspace-left,
    .workspace-center,
    .workspace-right,
    .workspace-header > * {
      min-width:0;
    }
    .panel-resizer {
      position:relative;
      z-index:45;
      width:var(--panel-resizer-hit);
      justify-self:center;
      background:transparent;
      cursor:ew-resize;
      touch-action:none;
      user-select:none;
    }
    .panel-resizer::before {
      content:none;
      display:none;
    }
    .panel-resizer::after {
      content:none;
      display:none;
    }
    .panel-resizer:hover,
    .panel-resizer.is-dragging {
      background:transparent;
    }
    .panel-resizer:hover::before,
    .panel-resizer.is-dragging::before {
      content:none;
      display:none;
    }
    .timeline-resizer {
      position:relative;
      z-index:30;
      flex:0 0 1px;
      height:1px;
      background:#d6d3d1;
      cursor:row-resize;
      touch-action:none;
      user-select:none;
    }
    .timeline-resizer::after {
      content:none;
      display:none;
    }
    .timeline-resizer:hover,
    .timeline-resizer.is-dragging {
      background:#a8a29e;
    }
    .timeline-column-resizer {
      position:relative;
      z-index:30;
      flex:0 0 1px;
      width:1px;
      background:#d6d3d1;
      cursor:col-resize;
      touch-action:none;
      user-select:none;
    }
    .timeline-column-resizer::after {
      content:none;
      display:none;
    }
    .timeline-column-resizer:hover,
    .timeline-column-resizer.is-dragging {
      background:#a8a29e;
    }
    body.resizing-panels {
      cursor:col-resize;
      user-select:none;
    }
    body.resizing-timeline {
      cursor:row-resize;
      user-select:none;
    }
    body.resizing-timeline-column {
      cursor:col-resize;
      user-select:none;
    }
    body.resizing-panels iframe,
    body.resizing-panels img,
    body.resizing-panels svg,
    body.resizing-timeline iframe,
    body.resizing-timeline img,
    body.resizing-timeline svg,
    body.resizing-timeline-column iframe,
    body.resizing-timeline-column img,
    body.resizing-timeline-column svg {
      pointer-events:none;
    }
    @media (max-width: 1279px) {
      :root {
        --left-panel-w: 250px;
        --right-panel-w: 280px;
      }
    }

    /* ── Keyframes ────────────────────────────────────────────────────────── */
    /* Fade group */
    @keyframes kf-fade         { 0%{opacity:0} 100%{opacity:1} }
    @keyframes kf-slide        { 0%{transform:translateX(var(--slide-x,-60px)) translateY(var(--slide-y,0px));opacity:var(--slide-fade,0)} 100%{transform:translate(0,0);opacity:1} }
    @keyframes kf-fade-slide   { 0%{transform:translateX(-40px);opacity:0} 100%{transform:translateX(0);opacity:1} }
    /* Move group (no fade) */
    @keyframes kf-move         { 0%{transform:translateX(var(--slide-x,-60px)) translateY(var(--slide-y,0px))} 100%{transform:translate(0,0)} }
    /* Scale group */
    @keyframes kf-grow         { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes kf-shrink       { 0%{transform:scale(1.6);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes kf-spin         { 0%{transform:rotate(var(--spin-deg,-180deg)) scale(0);opacity:0} 100%{transform:rotate(0deg) scale(1);opacity:1} }
    @keyframes kf-twist        { 0%{transform:scale(0) rotate(-270deg);opacity:0} 70%{transform:scale(1.1) rotate(8deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    @keyframes kf-move-scale   { 0%{transform:translateY(40px) scale(0.8);opacity:0} 100%{transform:translate(0,0) scale(1);opacity:1} }
    @keyframes kf-scale-pop    { 0%{transform:scale(0);opacity:0} 55%{transform:scale(var(--pop-scale,1.25))} 100%{transform:scale(1);opacity:1} }
    /* Mask group */
    @keyframes kf-mask-reveal  { 0%{clip-path:inset(100% 0 0 0)} 100%{clip-path:inset(0% 0 0 0)} }
    @keyframes kf-mask-center  { 0%{clip-path:inset(50% 50%)} 100%{clip-path:inset(0%)} }
    @keyframes kf-mask-resize  { 0%{clip-path:inset(0 50%)} 100%{clip-path:inset(0 0%)} }
    @keyframes kf-mask-slide   { 0%{clip-path:inset(0 100% 0 0);transform:translateX(-30px)} 100%{clip-path:inset(0 0% 0 0);transform:translateX(0)} }
    @keyframes kf-mask-expand  { 0%{clip-path:circle(0% at 50% 50%)} 100%{clip-path:circle(100% at 50% 50%)} }
    /* Blur group */
    @keyframes kf-blur         { 0%{filter:blur(var(--blur-px,20px));opacity:0} 100%{filter:blur(0px);opacity:1} }
    @keyframes kf-blur-slide   { 0%{filter:blur(16px);transform:translateX(-30px);opacity:0} 100%{filter:blur(0px);transform:translateX(0);opacity:1} }
    @keyframes kf-blur-scale   { 0%{filter:blur(12px);transform:scale(0.85);opacity:0} 100%{filter:blur(0px);transform:scale(1);opacity:1} }
    @keyframes kf-soft-blur    { 0%{filter:blur(6px);opacity:0.4} 100%{filter:blur(0px);opacity:1} }
    /* Basic Motion (loops) */
    @keyframes kf-float        { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--float-y,-24px))} }
    @keyframes kf-rotate       { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-bounce       { 0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(var(--bounce-y,-36px));animation-timing-function:cubic-bezier(0,0,.2,1)} }
    @keyframes kf-pulse        { 0%,100%{transform:scale(1)} 50%{transform:scale(var(--pulse-scale,1.1))} }
    @keyframes kf-wave         { 0%,100%{transform:rotate(0deg) translateY(0)} 25%{transform:rotate(5deg) translateY(-6px)} 75%{transform:rotate(-5deg) translateY(6px)} }
    @keyframes kf-wiggle       { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }
    /* UI Motion */
    @keyframes kf-hover-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes kf-icon-nudge   { 0%,100%{transform:translate(0,0)} 50%{transform:translate(4px,-4px)} }
    @keyframes kf-notif-pop    { 0%{transform:scale(0)} 75%{transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes kf-card-lift    { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.02)} }
    @keyframes kf-magnetic     { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-8px)} }
    /* Fade */
    @keyframes kf-fade         { 0%{opacity:0} 100%{opacity:1} }
    @keyframes kf-slide        { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0));opacity:var(--slide-fade,0)} 100%{transform:translate(0,0);opacity:1} }
    
    /* Move (no fade) */
    @keyframes kf-move         { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0))} 100%{transform:translate(0,0)} }
    @keyframes kf-prev-move-r  { 0%{transform:translateX(-10px)} 100%{transform:translateX(0)} }
    @keyframes kf-prev-move-l  { 0%{transform:translateX(10px)} 100%{transform:translateX(0)} }
    @keyframes kf-prev-move-t  { 0%{transform:translateY(10px)} 100%{transform:translateY(0)} }
    @keyframes kf-prev-move-b  { 0%{transform:translateY(-10px)} 100%{transform:translateY(0)} }

    /* Scale */
    @keyframes kf-grow         { 0%{transform:scale(var(--scale-from,0))} 100%{transform:scale(1)} }
    @keyframes kf-shrink       { 0%{transform:scale(var(--scale-from,2))} 100%{transform:scale(1)} }
    @keyframes kf-spin         { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-move-scale   { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0)) scale(0)} 100%{transform:translate(0,0) scale(1)} }
    @keyframes kf-scale-pop    { 0%{transform:scale(0)} 70%{transform:scale(var(--pop-scale,1.25))} 100%{transform:scale(1)} }
    
    /* Mask */
    @keyframes kf-mask-top    { 0%{clip-path:inset(100% 0 0 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-bottom { 0%{clip-path:inset(0 0 100% 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-left   { 0%{clip-path:inset(0 0 0 100%)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-right  { 0%{clip-path:inset(0 100% 0 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-center  { 0%{clip-path:circle(0%)} 100%{clip-path:circle(100%)} }
    @keyframes kf-mask-resize  { 0%{clip-path:inset(20% 20% 20% 20%)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-slide   { 0%{clip-path:inset(0 100% 0 0);transform:translateX(-20px)} 100%{clip-path:inset(0);transform:translateX(0)} }
    @keyframes kf-mask-expand  { 0%{clip-path:ellipse(0% 0% at 50% 50%)} 100%{clip-path:ellipse(100% 100% at 50% 50%)} }

    /* Blur */
    @keyframes kf-blur         { 0%{filter:blur(var(--blur-px,20px))} 100%{filter:blur(0)} }
    @keyframes kf-blur-slide   { 0%{filter:blur(var(--blur-px,20px));transform:translateX(-40px)} 100%{filter:blur(0);transform:translateX(0)} }
    @keyframes kf-blur-scale   { 0%{filter:blur(var(--blur-px,20px));transform:scale(1.5)} 100%{filter:blur(0);transform:scale(1)} }
    @keyframes kf-soft-blur    { 0%{filter:blur(var(--blur-px,10px));opacity:0} 100%{filter:blur(0);opacity:1} }

    /* Basic Motion */
    @keyframes kf-float        { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--float-y,-24px))} }
    @keyframes kf-rotate       { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-bounce       { 0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(var(--bounce-y,-36px));animation-timing-function:cubic-bezier(0,0,.2,1)} }
    @keyframes kf-pulse        { 0%,100%{transform:scale(1)} 50%{transform:scale(var(--pulse-scale,1.1))} }
    @keyframes kf-wave         { 0%,100%{transform:rotate(0deg) translateY(0)} 25%{transform:rotate(5deg) translateY(-6px)} 75%{transform:rotate(-5deg) translateY(6px)} }
    @keyframes kf-wiggle       { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }
    
    /* UI Motion */
    @keyframes kf-hover-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes kf-notif-pop    { 0%{transform:scale(0)} 75%{transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes kf-card-lift    { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.02)} }
    @keyframes kf-magnetic     { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-8px)} }
    
    /* Premium */
    @keyframes kf-luxury       { 0%{transform:translateY(20px) scale(.96);opacity:0;filter:blur(8px)} 100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)} }
    @keyframes kf-soft-hover   { 0%,100%{transform:scale(1) translateY(0)} 50%{transform:scale(1.02) translateY(-3px)} }
    @keyframes kf-glass-shimmer{ 0%,100%{opacity:.85;filter:brightness(1)} 50%{opacity:1;filter:brightness(1.12)} }
    
    /* Previews */
    @keyframes kf-prev-move-r { 0% {transform:translateX(-10px); opacity:0;} 100% {transform:translateX(0); opacity:1;} }
    @keyframes kf-prev-move-l { 0% {transform:translateX(10px); opacity:0;} 100% {transform:translateX(0); opacity:1;} }
    @keyframes kf-prev-move-t { 0% {transform:translateY(10px); opacity:0;} 100% {transform:translateY(0); opacity:1;} }
    @keyframes kf-prev-move-b { 0% {transform:translateY(-10px); opacity:0;} 100% {transform:translateY(0); opacity:1;} }
    @keyframes kf-prev-blur { 0% {filter:blur(8px); opacity:0.25;} 50% {filter:blur(0); opacity:1;} 100% {filter:blur(8px); opacity:0.25;} }
    @keyframes kf-prev-blur-slide { 0% {filter:blur(8px); opacity:0.25; transform:translateX(-10px);} 50% {filter:blur(0); opacity:1; transform:translateX(0);} 100% {filter:blur(8px); opacity:0.25; transform:translateX(0);} }
    @keyframes kf-prev-blur-scale { 0% {filter:blur(8px); opacity:0.25; transform:scale(0.85);} 50% {filter:blur(0); opacity:1; transform:scale(1);} 100% {filter:blur(8px); opacity:0.25; transform:scale(1);} }
    @keyframes kf-prev-soft-blur { 0% {filter:blur(4px); opacity:0.45;} 100% {filter:blur(0); opacity:1;} }
    
    /* Playful */
    @keyframes kf-elastic-pop  { 0%{transform:scale(0)} 50%{transform:scale(1.2)} 75%{transform:scale(.92)} 100%{transform:scale(1)} }
    @keyframes kf-jelly        { 0%,100%{transform:scale(1,1)} 30%{transform:scale(1.2,.8)} 50%{transform:scale(.9,1.15)} 70%{transform:scale(1.05,.95)} }
    @keyframes kf-bloom        { 0%{transform:scale(.4);filter:blur(10px);opacity:0} 100%{transform:scale(1);filter:blur(0);opacity:1} }
    @keyframes kf-bubble-rise  { 0%{transform:translateY(60px) scale(.5);opacity:0} 50%{transform:translateY(0) scale(1.05);opacity:1} 100%{transform:translateY(-60px) scale(.8);opacity:0} }
    @keyframes kf-orbit        { 0%{transform:rotate(0deg) translateX(var(--orbit-r,20px)) rotate(0deg)} 100%{transform:rotate(360deg) translateX(var(--orbit-r,20px)) rotate(-360deg)} }
    
    /* Tech */
    @keyframes kf-glitch       { 0%,100%{transform:translate(0);clip-path:inset(0);filter:none} 10%{transform:translate(-4px,2px);clip-path:inset(10% 0 60% 0);filter:drop-shadow(var(--rgb-split,-4px) 0 0 red) drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 blue)} 20%{transform:translate(4px,-2px);clip-path:inset(80% 0 5% 0);filter:drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 red) drop-shadow(var(--rgb-split,-4px) 0 0 blue)} 30%{transform:translate(-2px,2px);clip-path:inset(40% 0 40% 0);filter:none} 40%{transform:translate(2px,-2px);clip-path:inset(20% 0 20% 0);filter:drop-shadow(var(--rgb-split,-4px) 0 0 red)} 50%{transform:translate(0);clip-path:inset(0);filter:none} }
    @keyframes kf-hologram     { 0%,100%{opacity:1;filter:hue-rotate(0deg) brightness(1)} 33%{opacity:.7;filter:hue-rotate(90deg) brightness(1.3)} 66%{opacity:.9;filter:hue-rotate(180deg) brightness(.9)} }
    @keyframes kf-neon-glow    { 0%,100%{filter:drop-shadow(0 0 2px var(--glow-color,#FFB000))} 50%{filter:drop-shadow(0 0 12px var(--glow-color,#FFB000)) drop-shadow(var(--glow-x,0px) var(--glow-y,0px) 24px var(--glow-color-2,var(--glow-color,#FFB000)))} }
    @keyframes kf-pixel        { 0%{opacity:0;filter:contrast(2) brightness(1.3)} 100%{opacity:1;filter:contrast(1) brightness(1)} }
    @keyframes kf-rgb-split    { 0%,100%{filter:none} 50%{filter:drop-shadow(var(--rgb-split,-4px) 0 0 red) drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 blue)} }
    @keyframes kf-x-ray        { 0%,100%{filter:invert(1) grayscale(1) opacity(var(--xray-op,0.8)) drop-shadow(0 0 4px rgba(255,255,255,0.5))} 50%{filter:invert(1) grayscale(1) opacity(calc(var(--xray-op,0.8) + 0.2)) drop-shadow(0 0 12px rgba(255,255,255,0.8))} }

    /* Gaming */
    @keyframes kf-loot-glow    { 0%,100%{filter:drop-shadow(0 0 4px var(--glow-color,gold)) brightness(1)} 50%{filter:drop-shadow(0 0 20px var(--glow-color,gold)) drop-shadow(var(--glow-x,0px) var(--glow-y,0px) 40px var(--glow-color-2,var(--glow-color,gold))) brightness(1.4)} }
    @keyframes kf-damage-shake { 0%,100%{transform:translate(0,0) rotate(0deg)} 15%{transform:translate(-6px,2px) rotate(-2deg)} 30%{transform:translate(6px,-2px) rotate(2deg)} 45%{transform:translate(-4px,1px) rotate(-1deg)} 60%{transform:translate(4px,-1px) rotate(1deg)} }
    @keyframes kf-energy       { 0%{transform:scale(.9);filter:brightness(1) saturate(1)} 50%{transform:scale(1.05);filter:brightness(1.5) saturate(2)} 100%{transform:scale(1);filter:brightness(1) saturate(1)} }

    /* Stroke / Trim Paths: dasharray set per-element, no auto-animation (JS drives it via stroke-dashoffset) */
    .layer-trim-paths svg path, .layer-trim-paths svg line, .layer-trim-paths svg polyline, .layer-trim-paths svg polygon, .layer-trim-paths svg rect, .layer-trim-paths svg circle, .layer-trim-paths svg ellipse {
      stroke-dasharray: var(--path-len, 2000) !important;
      fill: transparent !important;
      stroke-width: var(--stroke-w, 2px) !important;
      stroke-linecap: var(--stroke-cap, round) !important;
      stroke-linejoin: var(--stroke-join, round) !important;
      stroke: var(--stroke-color, #FFB000) !important;
    }

    /* ── Utilities ──────────────────────────────────────────────────────────── */
    .bg-grid {
      background-size:20px 20px;
      background-image: linear-gradient(to right,rgba(0,0,0,.04) 1px,transparent 1px),
                        linear-gradient(to bottom,rgba(0,0,0,.04) 1px,transparent 1px);
    }
    .bg-checkerboard {
      background-image: linear-gradient(45deg, #e5e5e5 25%, transparent 25%), linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e5e5 75%), linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    /* Range sliders */
    input[type="range"] {
      -webkit-appearance:none; appearance:none; width:100%; height:4px;
      background:linear-gradient(to right,#FFB000 var(--rp,0%),#E5E7EB var(--rp,0%));
      outline:none; border:none; border-radius:0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none; width:12px; height:12px;
      border-radius:50%; background:#000; cursor:pointer;
    }
    input[type="range"]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#000; border:none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance:none;
      appearance:none;
      margin:0;
    }
    input[type="number"] {
      color-scheme:light;
      -moz-appearance:textfield;
    }
    input[type="number"].native-spin {
      -moz-appearance:auto;
      color-scheme:dark;
    }
    input[type="number"].native-spin::-webkit-inner-spin-button,
    input[type="number"].native-spin::-webkit-outer-spin-button {
      -webkit-appearance:auto;
      appearance:auto;
      opacity:1;
      margin-left:4px;
    }
    /* Scrollbars: hidden until scrolling, then soft and thin */
    * {
      scrollbar-width:thin;

    /* ==========================================================
       SPATIAL MINIMALISM THEME
       Warm off-white canvas, floating white panels, dark accent
       ========================================================== */
    body.theme-spatial {
      --bg-primary: #F8F8F8;
      --bg-secondary: #FAFAFA;
      --bg-tertiary: #FDFDFD;
      --surface-primary: #FDFDFD;
      --surface-secondary: #F8F8F8;
      --surface-hover: #F1F1F1;
      --surface-active: #EAEAEA;
      --border-subtle: rgba(0,0,0,0.04);
      --border-default: rgba(0,0,0,0.06);
      --border-strong: rgba(0,0,0,0.10);
      --text-primary: #1B1B1B;
      --text-secondary: #666666;
      --text-tertiary: #9A9A9A;
      --text-disabled: #BDBDBD;
      --accent-primary: #111111;
      --accent-hover: #2A2A2A;
      --accent-subtle: #F3F3F3;
      --radius-xs: 10px;
      --radius-sm: 12px;
      --radius-md: 14px;
      --radius-lg: 16px;
      --radius-xl: 18px;
      --radius-2xl: 22px;
      --shadow-xs: 0 2px 4px rgba(0,0,0,.03);
      --shadow-sm: 0 4px 12px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.05);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.06);
      --shadow-xl: 0 24px 80px rgba(0,0,0,.08);

      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      font-family: "SF Pro Display","Inter","Geist",sans-serif !important;
    }

    /* --- Top header → hidden (contents relocate into side panels) --- */
    body.theme-spatial .workspace-header {
      display: none !important;
    }
    body.theme-spatial #workspace-shell {
      height: 100vh !important;
    }

    /* --- Brand block at top of left panel --- */
    body.theme-spatial .lp-brand {
      border-bottom: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    body.theme-spatial .lp-brand .brand-wordmark {
      color: var(--text-primary);
      font-family: "SF Pro Display","Inter",sans-serif;
      letter-spacing: .14em;
    }

    /* --- CTA bar at top of right panel --- */
    body.theme-spatial .rp-static-header {
      border-bottom: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    body.theme-spatial .rp-static-header .vom-cta {
      background: var(--surface-primary) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: 14px !important;
      box-shadow: var(--shadow-xs);
      transition: all .15s cubic-bezier(.2,.8,.2,1);
    }
    body.theme-spatial .rp-static-header .vom-cta:hover {
      background: var(--surface-hover) !important;
      color: var(--text-primary) !important;
      border-color: var(--text-tertiary) !important;
    }
    body.theme-spatial .rp-static-header .vom-cta-primary,
    body.theme-spatial .rp-static-header .vom-cta-primary span,
    body.theme-spatial .rp-static-header .vom-cta-primary svg,
    body.theme-spatial .rp-static-header .vom-cta-primary i {
      color: #ffffff !important;
      stroke: #ffffff !important;
    }
    body.theme-spatial .rp-static-header .vom-cta-primary {
      background: linear-gradient(180deg, #2A2A2A 0%, #0A0A0A 100%) !important;
      border: 1px solid #000000 !important;
      border-radius: 14px !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 1px 2px rgba(0,0,0,.20),
        0 4px 12px rgba(0,0,0,.10) !important;
      transition: all .2s cubic-bezier(.2,.8,.2,1) !important;
    }
    body.theme-spatial .rp-static-header .vom-cta-primary:hover {
      background: linear-gradient(180deg, #3A3A3A 0%, #181818 100%) !important;
      border-color: #000000 !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        0 4px 16px rgba(0,0,0,.18) !important;
    }

    /* --- Workspace shell → padded canvas with floating panels --- */
    body.theme-spatial #workspace-shell {
      background: var(--bg-primary) !important;
      padding: 0 !important;
      display: block !important;
      position: relative !important;
      grid-template-columns: none !important;
      gap: 0 !important;
      overflow: hidden !important;
    }

    /* --- Left + Right panels → floating overlays over the canvas --- */
    body.theme-spatial .workspace-left,
    body.theme-spatial .workspace-right {
      background: var(--surface-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: var(--radius-xl) !important;
      box-shadow: var(--shadow-md);
      overflow: hidden !important;
      color: var(--text-primary) !important;
      position: absolute !important;
      top: 12px !important;
      bottom: 12px !important;
      z-index: 100 !important;
    }
    body.theme-spatial .workspace-left {
      left: 12px !important;
      width: var(--left-panel-w, 300px) !important;
    }
    body.theme-spatial .workspace-right {
      right: 12px !important;
      width: var(--right-panel-w, 300px) !important;
    }
    /* --- Center column fills the entire workspace; panels float on top --- */
    body.theme-spatial .workspace-center {
      background: transparent !important;
      border-radius: 0;
      overflow: hidden !important;
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
    }
    /* --- Hide panel-resizers (panels are now absolutely positioned overlays) --- */
    body.theme-spatial .panel-resizer {
      display: none !important;
    }
    /* --- Timeline panel: floats over the bottom of the canvas, doesn't squeeze it --- */
    body.theme-spatial #timeline-panel {
      position: absolute !important;
      bottom: 12px !important;
      left: calc(var(--left-panel-w, 300px) + 36px) !important;
      right: calc(var(--right-panel-w, 300px) + 36px) !important;
      margin: 0 !important;
      z-index: 90 !important;
    }
    /* --- Canvas toolbar: floats at the top of the canvas area, between the panels --- */
    body.theme-spatial #canvas-toolbar {
      position: absolute !important;
      top: 12px !important;
      left: calc(var(--left-panel-w, 300px) + 36px) !important;
      right: calc(var(--right-panel-w, 300px) + 36px) !important;
      margin: 0 !important;
      z-index: 90 !important;
    }
    /* --- Canvas container fills full center; panels overlay on top --- */
    body.theme-spatial #canvas-container {
      overflow: auto !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 96px 32px 232px !important;
    }

    /* --- Sub-headers inside panels (Presets / toolbars) → quiet --- */
    body.theme-spatial .workspace-left > div:first-child,
    body.theme-spatial .workspace-right > div:first-child {
      background: transparent !important;
      border: none !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: var(--text-primary) !important;
    }
    body.theme-spatial #canvas-toolbar {
      align-items: center !important;
      background: var(--surface-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 18px !important;
      box-shadow: var(--shadow-md) !important;
      color: var(--text-primary) !important;
      display: flex !important;
      height: 60px !important;
      overflow: visible !important;
      padding: 6px 10px !important;
      position: absolute !important;
      top: 12px !important;
      left: calc(var(--left-panel-w, 300px) + 36px) !important;
      right: calc(var(--right-panel-w, 300px) + 36px) !important;
      margin: 0 !important;
      z-index: 90 !important;
    }
    body.theme-spatial .workspace-left .text-xs,
    body.theme-spatial .workspace-right .text-xs,
    body.theme-spatial .workspace-left .text-\[10px\],
    body.theme-spatial .workspace-right .text-\[10px\] {
      color: var(--text-secondary) !important;
    }
    body.theme-spatial #presets-count {
      background: var(--surface-secondary) !important;
      color: var(--text-secondary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 999px !important;
    }

    /* --- Resizers → invisible gaps (still functional) --- */
    body.theme-spatial .panel-resizer,
    body.theme-spatial .timeline-resizer,
    body.theme-spatial .timeline-column-resizer {
      background: transparent !important;
    }
    body.theme-spatial .panel-resizer::after {
      background: transparent !important;
    }
    body.theme-spatial #left-panel-resizer {
      transform: translateX(var(--workspace-panel-edge-offset-neg));
    }
    body.theme-spatial #right-panel-resizer {
      transform: translateX(var(--workspace-panel-edge-offset));
    }
    body.theme-spatial .panel-resizer:hover,
    body.theme-spatial .panel-resizer.is-dragging,
    body.theme-spatial .timeline-resizer:hover,
    body.theme-spatial .timeline-resizer.is-dragging,
    body.theme-spatial .timeline-column-resizer:hover,

      font-size: 13px !important;
      color: var(--text-secondary) !important;
      background: transparent !important;
      border: none !important;
      transition: all .15s cubic-bezier(.2,.8,.2,1) !important;
    }
    body.theme-spatial .rp-tab.is-active {
      background: var(--surface-primary) !important;
      color: var(--text-primary) !important;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04) !important;
      font-weight: 600 !important;
    }
    body.theme-spatial .rp-tab + .rp-tab {
      border-left: none !important;
    }

    /* --- All compact segmented tabs → match Design / Animate treatment --- */
    body.theme-spatial .vom-segmented {
      display: grid !important;
      gap: 0 !important;
      padding: 3px !important;
      background: var(--surface-hover) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      box-shadow: none !important;
    }
    body.theme-spatial .vom-segment {
      min-height: 24px !important;
      padding: 4px 8px !important;
      border: none !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: var(--text-secondary) !important;
      box-shadow: none !important;
      font-weight: 600 !important;
      letter-spacing: .02em !important;
      text-transform: none !important;
      transition: all .15s cubic-bezier(.2,.8,.2,1) !important;
    }
    body.theme-spatial .vom-segment:hover {
      color: var(--text-primary) !important;
      background: rgba(255,255,255,.45) !important;
    }
    body.theme-spatial .vom-segment.is-selected,
    body.theme-spatial .vom-segment.filter-option-selected {
      background: var(--surface-primary) !important;
      color: var(--text-primary) !important;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04) !important;
      font-weight: 700 !important;
    }
    body.theme-spatial #canvas-toolbar .vom-segment,
    body.theme-spatial #right-panel .vom-segment,
    body.theme-spatial .workspace-right .vom-segment {
      border-radius: 8px !important;
      color: var(--text-secondary) !important;
    }
    body.theme-spatial #canvas-toolbar .vom-segment.is-selected,
    body.theme-spatial #canvas-toolbar .vom-segment.filter-option-selected,
    body.theme-spatial #right-panel .vom-segment.is-selected,
    body.theme-spatial #right-panel .vom-segment.filter-option-selected,
    body.theme-spatial .workspace-right .vom-segment.is-selected,
    body.theme-spatial .workspace-right .vom-segment.filter-option-selected {
      color: var(--text-primary) !important;
    }
    body.theme-spatial .vom-choice-grid {
      gap: 0 !important;
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      padding: 3px !important;
      background: var(--surface-hover) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
    }
    body.theme-spatial .vom-choice-btn {
      min-height: 24px !important;
      padding: 4px 8px !important;
      border: none !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: var(--text-secondary) !important;
      box-shadow: none !important;
      font-weight: 600 !important;
      letter-spacing: .02em !important;
      text-transform: none !important;
      transition: all .15s cubic-bezier(.2,.8,.2,1) !important;
    }
    body.theme-spatial .vom-choice-btn:hover {
      color: var(--text-primary) !important;
      background: rgba(255,255,255,.45) !important;
    }
    body.theme-spatial .vom-choice-btn.is-selected {
      background: var(--surface-primary) !important;
      color: var(--text-primary) !important;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04) !important;
      font-weight: 700 !important;
    }
    body.theme-spatial .vom-select-field,
    body.theme-spatial .vom-secondary-cta {
      background: var(--surface-secondary) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px !important;
      box-shadow: none !important;
    }
    body.theme-spatial .vom-select-field:hover,
    body.theme-spatial .vom-secondary-cta:hover {
      background: var(--surface-hover) !important;
      color: var(--text-primary) !important;
      border-color: var(--border-default) !important;
    }
    body.theme-spatial #easing-drop {
      background: var(--surface-primary) !important;
      color: var(--text-primary) !important;
      border-color: var(--border-subtle) !important;
      border-radius: 12px !important;
      box-shadow: var(--shadow-md) !important;
    }
    body.theme-spatial #easing-drop .vom-menu-row {
      background: transparent !important;
      color: var(--text-primary) !important;
    }
    body.theme-spatial #easing-drop .vom-menu-row:hover {
      background: var(--surface-hover) !important;
    }

    /* --- Layer rows → soft pill chips --- */
    body.theme-spatial .right-layer-row {
      background: var(--surface-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 14px !important;
      margin: 4px 0 !important;
      padding: 10px 14px !important;
      min-height: 44px !important;
      transition: all .15s cubic-bezier(.2,.8,.2,1) !important;
    }
    body.theme-spatial .right-layer-row:hover {
      background: var(--surface-hover) !important;
      border-color: var(--border-default) !important;
    }
    body.theme-spatial .right-layer-row.multi-selected {
      outline: 1px solid var(--border-default) !important;
      outline-offset: -2px;
      background: var(--surface-hover) !important;
    }
    body.theme-spatial .right-layer-box {
      background: var(--surface-primary) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 10px !important;
    }
  </style>

  <!-- ── Top Bar ───────────────────────────────────────────────────────────── -->
  <header class="workspace-header bg-black sticky top-0 z-[9999]" style="height:56px;position:relative;">
    <!-- Logo left -->
    <div class="flex items-center h-14 overflow-hidden" style="position:absolute;left:0;top:0;bottom:0">
      <div class="flex items-center justify-center pl-5 pr-1 h-14">
        <img src="VOM_favicon.png" alt="VOM" style="height:30px;width:auto;object-fit:contain;" onerror="this.style.display='none'">
      </div>
      <div class="flex items-center pl-0 pr-4 h-14 min-w-0 overflow-hidden">
        <span class="brand-wordmark font-outfit font-black tracking-widest text-[10px] text-white uppercase whitespace-nowrap">Vibe On Motion</span>
      </div>
    </div>
    <!-- Buttons right — absolutely positioned, never tied to panel widths -->
    <div class="flex items-center gap-2" style="position:absolute;right:16px;top:50%;transform:translateY(-50%)">
      <input type="file" id="json-import" accept=".json" class="hidden">
      <button onclick="document.getElementById('json-import').click()" class="vom-cta flex items-center space-x-2 px-4 text-[10px] font-bold bg-[#1A1A1A] text-[#AAA] hover:bg-[#2A2A2A] hover:text-white border border-[#333] transition-colors rounded-full" style="height:36px" title="Load a saved project JSON">
        <i data-lucide="folder-open" class="w-4 h-4"></i><span>Load Project</span>
      </button>
      <input type="file" id="file-upload" accept="image/*,.svg" multiple class="hidden">
      <button onclick="newProject()" class="vom-cta vom-cta-primary flex items-center space-x-2 px-4 text-[10px] font-bold bg-brand-orange text-black hover:bg-orange-400 transition-colors rounded-full" style="height:36px;font-weight:900" title="Start a new file">
        <i data-lucide="file-plus" class="w-4 h-4"></i><span>New File</span>
      </button>
    </div>
  </header>

  <!-- ── Main workspace ────────────────────────────────────────────────────── -->
  <main id="workspace-shell" class="flex-1 workspace-shell overflow-hidden" style="height:calc(100vh - 56px)">

    <!-- Left: Presets Library -->
    <section id="left-panel" class="workspace-left bg-white flex flex-col h-full overflow-hidden">
      <!-- Brand block -->
      <div class="lp-brand flex items-center gap-3 px-4 pt-4 pb-3 shrink-0">
        <img src="VOM_favicon.png" alt="VOM" style="height:24px;width:auto;object-fit:contain;" onerror="this.style.display='none'">
        <span class="brand-wordmark font-outfit font-black tracking-widest text-[11px] uppercase">Vibe On Motion</span>
      </div>
      <!-- Header -->
      <div class="flex items-center justify-between px-4 border-b border-black shrink-0 bg-white" style="height:40px">
        <span class="text-xs font-bold uppercase font-outfit tracking-wider">Presets</span>
        <span class="text-[10px] font-bold font-mono bg-stone-900 text-stone-200 border border-stone-700 px-2 py-0.5" id="presets-count">— Library</span>
      </div>
      <!-- Multi-select banner -->
      <div id="multi-select-banner" class="multi-select-banner shrink-0">
        <span id="multi-select-label">0 layers selected</span>
        <button onclick="clearMultiSelect()" style="font-size:9px;font-weight:900;background:rgba(0,0,0,.15);border:none;padding:2px 7px;cursor:pointer;">✕ Clear</button>
      </div>
      <!-- Scrollable preset grid -->
      <div class="flex-1 overflow-y-auto p-4 space-y-5" id="presets-container"></div>
    </section>

    <div id="left-panel-resizer" class="panel-resizer" role="separator" aria-label="Resize presets panel" aria-orientation="vertical" tabindex="0"></div>

    <!-- Center: Canvas + Timeline -->
    <section id="center-panel" class="workspace-center flex flex-col bg-[#FAF9F6] overflow-hidden">
      <!-- Canvas toolbar -->
      <div id="canvas-toolbar" class="flex items-stretch border-b border-black bg-white shrink-0 relative" style="height:40px;z-index:9998">
        <!-- Inline add buttons -->
        <div class="flex items-center gap-3 px-4" id="shape-controls">
          <input type="file" id="file-upload" accept="image/*,.svg" multiple class="hidden">
          <button onclick="document.getElementById('file-upload').click()" title="Add image" class="toolbar-add-btn">
            <i data-lucide="image" class="w-5 h-5"></i>
          </button>
          <button onclick="addTextAsset(event)" title="Add text" class="toolbar-add-btn">
            <i data-lucide="type" class="w-4 h-4"></i>
          </button>
          <button onclick="addShapeAsset('square',event)"   title="Square"   class="toolbar-add-btn"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg></button>
          <button onclick="addShapeAsset('circle',event)"   title="Circle"   class="toolbar-add-btn"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/></svg></button>
          <button onclick="addShapeAsset('triangle',event)" title="Triangle" class="toolbar-add-btn"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2.5L13.5 13H2.5z"/></svg></button>
          <button onclick="addShapeAsset('star',event)"     title="Star"     class="toolbar-add-btn"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6L8 9.7l-3.2 1.7.6-3.6L2.8 5.3l3.6-.5z"/></svg></button>
        </div>


        <div class="relative flex items-center ml-auto px-2" id="bg-toggles">
          <button onclick="toggleCustomBgDrop(event)" id="bg-menu-btn" aria-expanded="false" class="vom-cta flex items-center space-x-2 px-4 text-[10px] font-bold transition-colors h-8 uppercase">
            <span>Background</span>
            <span id="bg-menu-lbl" class="text-white">Light</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="opacity:0.5;flex-shrink:0"><path d="M1 3L5 7L9 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

      { id:'hologram',    name:'Hologram',      kf:'kf-hologram',    loop:true, easing:'linear',        controls:[] },
      { id:'neon-glow',   name:'Neon Glow',     kf:'kf-neon-glow',   loop:true, easing:'ease-in-out',   controls:['glow-color','glow-size'] },
      { id:'pixel',       name:'Pixel Dissolve',kf:'kf-pixel',       loop:false,easing:'ease-out',      controls:[] },
      { id:'rgb-split',   name:'RGB Split',     kf:'kf-rgb-split',   loop:true, easing:'ease-in-out',   controls:['rgb-split'] },
      { id:'x-ray',       name:'X-Ray',         kf:'kf-x-ray',       loop:true, easing:'ease-in-out',   controls:['xray-op'] },
    ]},
    { key:'gaming',  title:'Gaming',       presets:[
      { id:'loot-glow',   name:'Loot Glow',     kf:'kf-loot-glow',   loop:true,  easing:'ease-in-out', controls:['glow-color'] },
      { id:'damage-shake',name:'Damage Shake',  kf:'kf-damage-shake',loop:true,  easing:'ease-in-out', controls:[] },
      { id:'energy',      name:'Energy Charge', kf:'kf-energy',      loop:true,  easing:'ease-in-out', controls:[] },
