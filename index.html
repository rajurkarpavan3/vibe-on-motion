  function presetSpecificHTML(layer) {
    const p = layer.params || {};
    const preset = getPreset(layer.presetId);
    if (!preset || !preset.controls.length) return '';

    let innerHtml = '';

    const sRow = (key, label, min, max, step, valKey) => {
      const v = p[valKey] ?? min;
      const displayVal = step >= 1 ? Math.round(v) : parseFloat(v).toFixed(2);
      return `<div class="space-y-1">
        <div class="flex justify-between items-center">
          <span class="text-xs" style="color:#888">${label}</span>
          <input id="pc-${key}-val" type="text" value="${displayVal}" onchange="setPP('${valKey}',this.value,${min},${max})" class="w-14 text-center font-mono text-[11px] border border-[#2A2A2A] focus:outline-none py-0.5 bg-transparent text-inherit">
        </div>
        <input id="pc-${key}-sl" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setPPSlider('${valKey}',this.value,'pc-${key}-val')" class="w-full" style="--rp:${pct(v,min,max)}%">
      </div>`;
    };

    if (preset.controls.includes('opacity'))     innerHtml += sRow('opacity','Opacity',0,1,0.05,'opacity');
    if (preset.controls.includes('blur-amt'))    innerHtml += sRow('blur','Blur (px)',0,100,1,'blurAmt');
    if (preset.controls.includes('scale-range')) innerHtml += sRow('scale-from','Scale from',-2,5,0.05,'scaleFrom');
    if (preset.controls.includes('slide-dist'))  innerHtml += sRow('slide-dist','Distance (px)',0,500,1,'slideDist');
    if (preset.controls.includes('slide-fade'))  innerHtml += sRow('slide-fade','Fade Intensity %',0,100,1,'slideFade');
    if (preset.controls.includes('slide-dir')) {
      const dirs = ['left','right','top','bottom'];
      innerHtml += `<div class="space-y-1.5">
        <span class="text-xs" style="color:#888">Slide direction</span>
        <div class="vom-segmented grid-cols-2">
          ${dirs.map(d => `<button onclick="setPP('slideDir','${d}',null,null)" class="vom-segment py-1.5 text-[10px] font-bold transition-colors ${p.slideDir===d?'is-selected':''}">${toTitleCase(d)}</button>`).join('')}
        </div>
      </div>`;
    }
    if (preset.controls.includes('stroke-width')) innerHtml += sRow('stroke-width','Thickness (px)',0,50,0.5,'stroke-width');
    if (preset.controls.includes('trim-end')) innerHtml += sRow('trim-end','Path %',0,100,1,'trimEnd');
    if (preset.controls.includes('stroke-cap')) {
      const caps = ['round','square','butt'];
      innerHtml += `<div class="space-y-1.5">
        <span class="text-xs" style="color:#888">Stroke End</span>
        <div class="vom-segmented grid-cols-3">
          ${caps.map(c => `<button onclick="setPP('stroke-cap','${c}',null,null)" class="vom-segment py-1.5 text-[10px] font-bold transition-colors ${(p['stroke-cap']===c || (!p['stroke-cap'] && c==='round')) ? 'is-selected' : ''} uppercase">${toTitleCase(c)}</button>`).join('')}
        </div>
      </div>`;
    }
    if (preset.controls.includes('stroke-color')) {
      const mode = p['stroke-color-mode'] || 'solid';
      const c1 = p['stroke-c1'] || '#FFB000';
      const c2 = p['stroke-c2'] || '#FFB020';
      const strokeAngle = clampGradientAngle(p['stroke-gradient-angle'], 135);
      const strokeStops = gradientStops(p, 'stroke-gradient-stops', c1, c2, 'stroke-c1', 'stroke-c2');
      innerHtml += `<div class="space-y-1.5">
        <div class="flex justify-between items-center mb-2 relative" id="stroke-mode-wrap">
          <span class="rp-control-title">Stroke</span>
          <div class="vom-segmented" style="grid-template-columns:repeat(3,auto);display:inline-grid">
            <button onclick="setPP('stroke-color-mode','none')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${mode==='none'?'is-selected':''}">None</button>
            <button onclick="setPP('stroke-color-mode','solid')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${mode==='solid'?'is-selected':''}">Solid</button>
            <button onclick="setPP('stroke-color-mode','gradient')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${mode==='gradient'?'is-selected':''}">Grad</button>
          </div>
        </div>
        ${mode==='none'?`<div class="color-field" style="pointer-events:none;opacity:.4"><div style="width:36px;height:36px;background:#111;position:relative;overflow:hidden"><svg width="36" height="36" viewBox="0 0 36 36"><line x1="0" y1="0" x2="36" y2="36" stroke="#cc2222" stroke-width="1.5"/></svg></div><input type="text" value="None" disabled></div>`:mode==='gradient'?gradientEditorHTML('layer','stroke-gradient-stops','stroke-gradient-angle',strokeStops,strokeAngle,c1,c2):`
          <div class="color-field">
            <input type="color" value="${c1}" onchange="setPPDirect('stroke-c1',this.value);this.nextElementSibling.value=this.value.toUpperCase()">
            <input type="text" value="${c1.toUpperCase()}" onchange="setPPDirect('stroke-c1',this.value);this.previousElementSibling.value=this.value" placeholder="#000000">
          </div>
        `}
      </div>`;
    }
    if (preset.controls.includes('rot-deg'))     innerHtml += sRow('rot','Angle (°)',-360,360,1,'rotDeg');
    if (preset.controls.includes('pop-scale'))   innerHtml += sRow('pop-scale','Peak scale',-2,5,0.05,'popScale');
    if (preset.controls.includes('float-dist'))  innerHtml += sRow('float-dist','Distance (px)',-200,200,1,'floatDist');
    if (preset.controls.includes('bounce-h'))    innerHtml += sRow('bounce-h','Height (px)',-200,200,1,'bounceH');
    if (preset.controls.includes('pulse-scale')) innerHtml += sRow('pulse-scale','Scale peak',-2,3,0.05,'pulseScale');
    if (preset.controls.includes('orbit-r'))     innerHtml += sRow('orbit-r','Orbit radius (px)',0,150,1,'orbitR');
    if (preset.controls.includes('glitch-int'))  innerHtml += sRow('glitch','Intensity',0.2,3,0.1,'glitchInt');
    if (preset.controls.includes('rgb-split'))   innerHtml += sRow('rgb-split','Split Dist',-20,20,1,'rgbSplit');
    if (preset.controls.includes('xray-op'))     innerHtml += sRow('xray-op','Opacity',0,1,0.05,'xrayOp');
    if (preset.controls.includes('glow-color')) {
      const glowMode = p.glowColorMode || 'solid';
      const glow1 = p.glowColor || '#FFB000';
      const glow2 = p.glowColor2 || '#FF5C5C';
      const glowAngle = clampGradientAngle(p.glowGradientAngle, 135);
      const glowStops = gradientStops(p, 'glowGradientStops', glow1, glow2, 'glowColor', 'glowColor2');
      innerHtml += `<div class="space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <span class="rp-control-title">Glow</span>
          <div class="vom-segmented" style="grid-template-columns:repeat(3,auto);display:inline-grid">
            <button onclick="setPP('glowColorMode','none')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${glowMode==='none'?'is-selected':''}">None</button>
            <button onclick="setPP('glowColorMode','solid')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${glowMode==='solid'?'is-selected':''}">Solid</button>
            <button onclick="setPP('glowColorMode','gradient')" class="vom-segment px-2 py-0.5 text-[8px] font-bold uppercase transition-colors ${glowMode==='gradient'?'is-selected':''}">Grad</button>
          </div>
        </div>
        ${glowMode==='none'?`<div class="color-field" style="pointer-events:none;opacity:.4"><div style="width:36px;height:36px;background:#111;position:relative;overflow:hidden"><svg width="36" height="36" viewBox="0 0 36 36"><line x1="0" y1="0" x2="36" y2="36" stroke="#cc2222" stroke-width="1.5"/></svg></div><input type="text" value="None" disabled></div>`:glowMode==='gradient'?gradientEditorHTML('layer','glowGradientStops','glowGradientAngle',glowStops,glowAngle,glow1,glow2):`<div class="space-y-1.5">
          <div class="color-field">
            <input type="color" value="${glow1}" onchange="setPPDirect('glowColor',this.value);this.nextElementSibling.value=this.value.toUpperCase()">
            <input type="text" value="${glow1.toUpperCase()}" onchange="setPPDirect('glowColor',this.value);this.previousElementSibling.value=this.value" placeholder="#FFB000">
          </div>
        </div>`}
      </div>`;
    }
    if (preset.controls.includes('glow-size'))   innerHtml += sRow('glow-size','Glow size (px)',0,60,1,'glowSize');
    if (preset.controls.includes('mask-dir')) {
      const dirs = ['top','bottom','left','right'];
      innerHtml += `<div class="space-y-1.5">
        <span class="text-xs" style="color:#888">Mask direction</span>
        <div class="vom-segmented grid-cols-2">
          ${dirs.map(d => `<button onclick="setPP('maskDir','${d}',null,null)" class="vom-segment py-1.5 text-[10px] font-bold transition-colors ${p.maskDir===d?'is-selected':''}">${toTitleCase(d)}</button>`).join('')}
        </div>
      </div>`;
    }

    return rpSection('anim-preset', 'Preset Controls', innerHtml);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // EASING HELPERS
  // ═══════════════════════════════════════════════════════════════════════════
  const EASINGS = [
    ['linear','Linear'],['ease-in','Ease In'],['ease-out','Ease Out'],['ease-in-out','Ease In Out'],
    ['cubic-bezier(0.34,1.56,0.64,1)','Ease Out Back'],['cubic-bezier(0.175,0.885,0.32,1.275)','Bouncy'],
    ['cubic-bezier(0.16,1,0.3,1)','Gentle'],['cubic-bezier(0.22,1,0.36,1)','Quick'],
    ['steps(1,end)','Instant'],
  ];
  function easingLabel(v) { const e = EASINGS.find(([val])=>val===v); return e ? e[1] : 'Ease Out'; }

  function toggleEasingDrop(e) { if(e) e.stopPropagation(); document.getElementById('easing-drop')?.classList.toggle('hidden'); }
  function pickEasingByIdx(idx, e) {
    if(e) e.stopPropagation();
    const l = getSelLayer(); if(!l) return;
    const pair = EASINGS[idx]; if(!pair) return;
    if (l.easing === pair[0]) return;
    pushUndo('Easing');
    l.easing = pair[0];
    const lbl = document.getElementById('easing-lbl'); if(lbl) lbl.textContent = pair[1];
    document.getElementById('easing-drop')?.classList.add('hidden');
    renderGraphic();
  }

  function toggleStrokeModeDrop(e) { if(e) e.stopPropagation(); document.getElementById('stroke-mode-drop')?.classList.toggle('hidden'); }
  function pickStrokeMode(mode, e) {
    if(e) e.stopPropagation();
    setPP('stroke-color-mode', mode);
    document.getElementById('stroke-mode-drop')?.classList.add('hidden');
  }

  function pct(v, min, max) { return Math.max(0, Math.min(100, Math.round(((v-min)/(max-min))*100))); }

  // ═══════════════════════════════════════════════════════════════════════════
  // LAYER MUTATIONS
  // ═══════════════════════════════════════════════════════════════════════════
  function getSelLayer() { return S.layers.find(l => l.id === S.sel) || null; }

  // ═══════════════════════════════════════════════════════════════════════════
  // MULTI-SELECT
  // ═══════════════════════════════════════════════════════════════════════════
  function getSelectedIds() {
    // Always includes activeAssetId + any shift-selected ones
    const ids = new Set(S.selectedAssetIds || []);
    if (S.activeAssetId) ids.add(S.activeAssetId);
    return [...ids];
  }

  function isMultiSelect() {
    return (S.selectedAssetIds || []).length > 0;
  }

  function clearMultiSelect() {
    S.selectedAssetIds = [];
    updateMultiSelectUI();
    buildTimeline();
    buildRightPanel();
  }

  function toggleMultiSelectAsset(id) {
    if (!S.selectedAssetIds) S.selectedAssetIds = [];
    // Ensure active asset is always in the set when starting multi-select
    if (S.selectedAssetIds.length === 0 && S.activeAssetId && S.activeAssetId !== id) {
      S.selectedAssetIds.push(S.activeAssetId);
    }
    const idx = S.selectedAssetIds.indexOf(id);
    if (idx >= 0) {
      S.selectedAssetIds.splice(idx, 1);
    } else {
      S.selectedAssetIds.push(id);
    }
    S.activeAssetId = id;
    S.file = getAsset(id);
    updateMultiSelectUI();
    buildTimeline();
    buildRightPanel();
  }

  function updateMultiSelectUI() {
    const banner = document.getElementById('multi-select-banner');
    const label  = document.getElementById('multi-select-label');
    const ids = getSelectedIds();
    const multi = isMultiSelect();
    if (banner) banner.classList.toggle('active', multi);
    if (label)  label.textContent = `${ids.length} layer${ids.length !== 1 ? 's' : ''} selected — click preset to apply to all`;
    // Highlight rows in timeline
    document.querySelectorAll('.timeline-row').forEach(row => {
      row.classList.toggle('multi-selected', multi && ids.includes(row.dataset.assetId));
    });
    // Highlight rows in right panel
    document.querySelectorAll('.right-layer-row').forEach(row => {
      const id = row.querySelector('.asset-name-label')?.dataset.assetId;
      row.classList.toggle('multi-selected', multi && id && ids.includes(id));
    });
  }

  function selectAssetRow(id, event) {
    const asset = getAsset(id);
    if (!asset) return;
    // Shift+click → toggle multi-select
    if (event && event.shiftKey) {
      toggleMultiSelectAsset(id);
      return;
    }
    // Normal click → clear multi-select, select single, clear preset selection
    S.selectedAssetIds = [];
    S.activeAssetId = asset.id;
    S.file = asset;
    S.sel = null; // clear preset selection — user clicked layer row not a preset
    buildPresets();
    renderGraphic();
    buildTimeline();
    buildRightPanel();
    hideLayerContextMenu();
  }

  function selectLayer(id, opts={}) {
    const layer = S.layers.find(l => l.id === id);
    if (!layer) return;
    S.activeAssetId = layer.assetId || S.activeAssetId;
    S.file = currentAsset();
    S.sel = layer.id;
    window._rpTab = 'animate'; // auto-switch to animate tab
    buildPresets();
    renderGraphic();
    if (opts.timeline !== false) buildTimeline();
    else syncTimelineSelection();
    buildRightPanel();
    hideLayerContextMenu();
  }

  function setLP(prop, val) {
    const l = getSelLayer(); if(!l) return;
    if (l[prop] === val) return;
    pushUndo('Layer setting');
    l[prop] = val;
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function setLPNum(prop, val, min, max) {
    const l = getSelLayer(); if(!l) return;
    let v = parseFloat(val); if(isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    if (l[prop] === v) return;
    pushUndo('Layer setting');
    l[prop] = v;
    const slider = document.getElementById(`rp-${prop}-slider`);
    if(slider) { slider.value = v; slider.style.setProperty('--rp', pct(v,parseFloat(slider.min),parseFloat(slider.max))+'%'); }
    renderGraphic(); buildTimeline();
  }

  function setLPSlider(prop, val, displayId) {
    const l = getSelLayer(); if(!l) return;
    const next = parseFloat(val);
    if (l[prop] !== next) pushUndoContinuous('lp-' + prop, 'Layer setting');
    l[prop] = next;
    const el = document.getElementById(displayId); if(el) el.value = parseFloat(val).toFixed(2);
    const sl = document.getElementById(`rp-${prop}-slider`);
    if(sl) sl.style.setProperty('--rp', pct(parseFloat(val),parseFloat(sl.min),parseFloat(sl.max))+'%');
    renderGraphic(); buildTimeline();
  }

  function setScale(val, record=true) {
    const next = parseFloat(val) || 1;
    if (record && S.scale !== next) pushUndoContinuous('canvas-scale', 'Canvas zoom');
    S.scale = next;
    const sl = document.getElementById('scale-slider');
    if(sl) { sl.value = S.scale; sl.style.setProperty('--rp', pct(S.scale, 0.1, 3) + '%'); }
    const ct = document.getElementById('canvas-target');
    if (ct) {
      ct.style.transform = `scale(${S.scale})`;
      ct.style.transformOrigin = 'center center';
    }
    updateZoomLabel();
  }

  function setScaleSlider(val) {
    const next = parseFloat(val);
    if (S.scale !== next) pushUndoContinuous('canvas-scale', 'Canvas zoom');
    S.scale = next;
    const sl = document.getElementById('scale-slider');
    if (sl) sl.style.setProperty('--rp', Math.round(((S.scale-0.1)/(3-0.1))*100) + '%');
    const ct = document.getElementById('canvas-target');
    if (ct) {
      ct.style.transform = `scale(${S.scale})`;
      ct.style.transformOrigin = 'center center';
    }
    const rpDur = document.getElementById('rp-scale-val');
    if(rpDur) rpDur.value = S.scale.toFixed(2);
    updateZoomLabel();
  }

  function updateZoomLabel() {
    const lbl = document.getElementById('zoom-lbl');
    if (lbl) lbl.textContent = `${Math.round((S.scale || 1) * 100)}%`;
  }

  function toggleZoomDrop(e) {
    if (e) e.stopPropagation();
    const drop = document.getElementById('zoom-drop');
    const willOpen = drop?.classList.contains('hidden');
    document.getElementById('bg-custom-drop')?.classList.add('hidden');
    document.getElementById('bg-menu-btn')?.setAttribute('aria-expanded', 'false');
    document.getElementById('size-drop')?.classList.add('hidden');
    document.getElementById('size-btn')?.setAttribute('aria-expanded', 'false');
    document.getElementById('shape-drop')?.classList.add('hidden');
    document.getElementById('shape-btn')?.setAttribute('aria-expanded', 'false');
    if (willOpen) drop?.classList.remove('hidden');
    else drop?.classList.add('hidden');
    document.getElementById('zoom-btn')?.setAttribute('aria-expanded', drop && !drop.classList.contains('hidden') ? 'true' : 'false');
  }

  function pickZoom(value, e) {
    if (e) e.stopPropagation();
    setScale(value);
    document.getElementById('zoom-drop')?.classList.add('hidden');
    document.getElementById('zoom-btn')?.setAttribute('aria-expanded', 'false');
  }

  function updateToolbarPlayIcon() {
    const btn = document.getElementById('toolbar-play-btn');
    if (btn) btn.innerHTML = S.playing ? '<i data-lucide="pause" class="w-5 h-5"></i>' : '<i data-lucide="play" class="w-5 h-5"></i>';
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ALIGNMENT
  // ═══════════════════════════════════════════════════════════════════════════
  function alignAsset(direction) {
    const asset = currentAsset();
    if (!asset) return;

    const canvasEl = document.getElementById('canvas-target');
    const [wStr, hStr] = (S.size || '400x400').split('x');
    // Use the canvas element's actual layout size (unaffected by CSS scale transform)
    const cw = canvasEl ? canvasEl.offsetWidth  : (parseInt(wStr) || 400);
    const ch = canvasEl ? canvasEl.offsetHeight : (parseInt(hStr) || 400);

    // Read the asset wrapper's layout size (offsetWidth/Height ignores CSS transforms)
    const el = document.querySelector(`[data-asset-id="${asset.id}"]`);
    const aw = el ? el.offsetWidth  : (asset.w || cw);
    const ah = el ? el.offsetHeight : (asset.h || ch);

    pushUndo('Align ' + direction);
    // x=0,y=0 = canvas center. Asset origin = its center (transform: translate(-50%,-50%))
    switch (direction) {
      case 'left':    asset.x = -(cw / 2) + (aw / 2); break;
      case 'centerH': asset.x = 0;                     break;
      case 'right':   asset.x =  (cw / 2) - (aw / 2); break;
      case 'top':     asset.y = -(ch / 2) + (ah / 2);  break;
      case 'centerV': asset.y = 0;                      break;
      case 'bottom':  asset.y =  (ch / 2) - (ah / 2);  break;
    }
    applyGraphicPosition();
    renderGraphic();
  }

  function setPP(key, val, min, max) {
    const l = getSelLayer(); if(!l) return;
    if(typeof min === 'number' && typeof max === 'number') { let v=parseFloat(val); if(isNaN(v)) return; val=Math.max(min,Math.min(max,v)); }
    pushUndoContinuous('pp-' + key, 'Preset parameter');
    l.params[key] = val;
    renderGraphic();
    // Only rebuild panel for non-numeric changes (like slideDir) that change UI state
    if (typeof val === 'string') buildRightPanel();
  }
  function setPPSlider(key, val, displayId) {
    const l = getSelLayer(); if(!l) return;
    const next = parseFloat(val);
    if (l.params[key] !== next) pushUndoContinuous('pp-' + key, 'Preset parameter');
    l.params[key] = next;
    const el=document.getElementById(displayId);
    if(el) {
      const step = parseFloat(document.getElementById(displayId.replace('-val','-sl'))?.step || 1);
      el.value = step >= 1 ? Math.round(next) : next.toFixed(2);
    }
    const slId = displayId.replace('-val', '-sl');
    const sl=document.getElementById(slId);
    if(sl) sl.style.setProperty('--rp',pct(parseFloat(val),parseFloat(sl.min),parseFloat(sl.max))+'%');
    renderGraphic();
  }
  function setPPDirect(key, val) {
    const l = getSelLayer(); if(!l) return;
    if (l.params[key] === val) return;
    pushUndo('Preset parameter');
    l.params[key] = val;
    renderGraphic();
  }

  function currentShapeAsset() {
    const asset = currentAsset();
    return asset && asset.type === 'shape' ? asset : null;
  }

  function setShapeKind(shapeType) {
    const asset = currentShapeAsset(); if(!asset) return;
    if (!['square','circle','triangle','star'].includes(shapeType)) shapeType = 'square';
    if (asset.shapeType === shapeType) return;
    pushUndo('Shape type');
    asset.shapeType = shapeType;
    asset.name = ({ square:'Square', circle:'Circle', triangle:'Triangle', star:'Star' })[shapeType] || 'Shape';
    if (shapeType === 'circle') { asset.w = asset.w || 150; asset.h = asset.h || 150; asset.radius = 50; }
    if (shapeType === 'triangle') { asset.radius = Math.min(asset.radius || 0, 40); }
    if (shapeType === 'star') { asset.points = asset.points || 5; asset.radius = Math.min(asset.radius || 0, 18); }
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function setShapeProp(key, val, min, max) {
    const asset = currentShapeAsset(); if(!asset) return;
    let next = parseFloat(val);
    if (isNaN(next)) return;
    next = Math.max(min, Math.min(max, next));
    if (asset[key] === next) return;
    pushUndo('Shape setting');
    asset[key] = next;
    renderGraphic();
    buildRightPanel();
  }

  // Live (oninput) version — only rerenders, no panel rebuild
  function setShapePropLive(key, val, min, max) {
    const asset = currentShapeAsset(); if(!asset) return;
    let next = parseFloat(val);
    if (isNaN(next)) return;
    next = Math.max(min, Math.min(max, next));
    if (asset[key] === next) return;
    pushUndoContinuous('shape-' + key, 'Shape setting');
    asset[key] = next;
    renderGraphic();
  }

  function setShapeSlider(key, val, displayId) {
    const asset = currentShapeAsset(); if(!asset) return;
    const next = parseFloat(val);
    if (asset[key] !== next) pushUndoContinuous('shape-' + key, 'Shape setting');
    asset[key] = next;
    const el = document.getElementById(displayId);
    if (el) el.value = Number.isFinite(next) ? next.toFixed(0) : '';
    const sl = document.getElementById(displayId.replace('-val','-sl'));
    if (sl) sl.style.setProperty('--rp', pct(next, parseFloat(sl.min), parseFloat(sl.max)) + '%');
    renderGraphic();
  }

  function setShapeDirect(key, val) {
    const asset = currentShapeAsset(); if(!asset) return;
    if (asset[key] === val) return;
    pushUndo('Shape color');
    asset[key] = val;
    // If changing a mode key, keep the relevant section open
    if (key === 'fillMode')   window.rp_open_fill   = true;
    if (key === 'strokeMode') window.rp_open_stroke = true;
    renderGraphic(); buildRightPanel();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // LAYER ROW RIGHT-CLICK CONTEXT MENU (Rename / Duplicate / Delete)
  // ═══════════════════════════════════════════════════════════════════════════
  function showLayerRowContextMenu(ev, assetId) {
    hideSegmentContextMenu();
    hideLayerContextMenu();

    let menu = document.getElementById('layer-row-ctx-menu');
    if (!menu) {
      menu = document.createElement('div');
      menu.id = 'layer-row-ctx-menu';
      menu.style.cssText = 'position:fixed;z-index:100001;min-width:160px;background:#111;border:1px solid #333;box-shadow:4px 4px 0 rgba(0,0,0,.8);padding:4px;display:none;';
      document.body.appendChild(menu);
    }

    const asset = getAsset(assetId);
    if (!asset) return;

    menu.innerHTML = `
      <div style="padding:5px 10px 4px;font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:none;color:#555;border-bottom:1px solid #222;margin-bottom:3px;">${asset.name}</div>
    `;

    const btn = (icon, label, cls, fn) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.style.cssText = 'width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:10px;font-weight:700;color:' + (cls === 'danger' ? '#f87171' : '#fff') + ';background:transparent;text-align:left;';
      b.innerHTML = icon + label;
      b.onmouseenter = () => b.style.background = cls === 'danger' ? '#2a0a0a' : '#222';
      b.onmouseleave = () => b.style.background = 'transparent';
      b.addEventListener('click', () => { menu.style.display = 'none'; fn(); });
      menu.appendChild(b);
    };

    // Rename — inline inside the layer row
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      'Rename', '', () => {
        // Find the name span in timeline OR right panel
        const span = document.querySelector(`.asset-name-label[data-asset-id="${assetId}"]`);
        if (!span) return;

        const original = asset.name;
        window.__renamingAsset = true; // block DOM rebuilds

        const input = document.createElement('input');
        input.type = 'text';
        input.value = original;
        input.style.cssText = 'background:transparent;border:none;border-bottom:1.5px solid #FFB000;outline:none;width:100%;min-width:0;font-size:inherit;font-weight:inherit;font-family:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:0;margin:0;line-height:inherit;';

        span.textContent = '';
        span.style.overflow = 'visible';
        span.appendChild(input);
        input.focus();
        input.select();

        let done = false;
        const commit = () => {
          if (done) return;
          done = true;
          window.__renamingAsset = false;
          const val = input.value.trim();
          if (val && val !== original) {
            pushUndo('Rename layer');
            asset.name = val;
          }
          buildTimeline();
          buildRightPanel();
        };
        const cancel = () => {
          if (done) return;
          done = true;
          window.__renamingAsset = false;
          span.textContent = original;
          span.style.overflow = '';
        };

        input.addEventListener('blur',    () => commit());
        input.addEventListener('keydown', e => {
          e.stopPropagation();
          if (e.key === 'Enter')  { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        });
        input.addEventListener('click',       e => e.stopPropagation());
        input.addEventListener('pointerdown', e => e.stopPropagation());
      });

    // Duplicate
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="16" height="16" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
      'Duplicate', '', () => {
        S.activeAssetId = assetId;
        duplicateSelectedAsset();
      });

    // Separator
    const sep = document.createElement('div');
    sep.style.cssText = 'height:1px;background:#222;margin:3px 0;';
    menu.appendChild(sep);

    // Delete
    btn(`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
      'Delete', 'danger', () => removeAsset(assetId));

    // Position
    menu.style.display = 'block';
    menu.style.left = '0'; menu.style.top = '0';
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(ev.clientX, window.innerWidth  - r.width  - 8) + 'px';
    menu.style.top  = Math.min(ev.clientY, window.innerHeight - r.height - 8) + 'px';

    // Close on outside click
    const close = () => { menu.style.display = 'none'; window.removeEventListener('click', close); window.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    setTimeout(() => { window.addEventListener('click', close); window.addEventListener('keydown', onKey); }, 0);
  }

  function toggleAssetVis(id) {
    const asset = getAsset(id); if(!asset) return;
    pushUndo('Toggle layer visibility');
    asset.visible = asset.visible === false;
    renderGraphic(); buildTimeline(); buildRightPanel();
  }

  function toggleVis(id) {
    const l = S.layers.find(l => l.id === id); if(!l) return;
    pushUndo('Toggle visibility');
    l.visible = !l.visible;
    renderGraphic(); buildTimeline(); if(S.sel===id) buildRightPanel();
  }

  function removeLayer(id) {
    const oldLayer = S.layers.find(l => l.id === id);
    if (!oldLayer) return;
    pushUndo('Remove layer');
    S.layers = S.layers.filter(l => l.id !== id);
    if(S.sel === id) S.sel = S.layers.find(l => l.assetId === oldLayer.assetId)?.id || S.layers[0]?.id || null;
    const selected = getSelLayer();
    if (selected) S.activeAssetId = selected.assetId;
    refreshAll();
  }

  function removeAsset(id) {
    const asset = getAsset(id);
    if (!asset) return;
    if (!confirm(`Remove ${asset.name}? Its effects will also be removed.`)) return;
    pushUndo('Remove asset');
    S.assets = S.assets.filter(a => a.id !== id);
    S.layers = S.layers.filter(l => l.assetId !== id);
    if (S.activeAssetId === id) S.activeAssetId = S.assets[0]?.id || null;
    S.file = currentAsset();
    if (S.sel && !S.layers.some(l => l.id === S.sel)) S.sel = S.layers.find(l => l.assetId === S.activeAssetId)?.id || null;
    refreshAll();
  }

  function deleteSelectedArtboardObject() {
    const asset = getAsset(S.activeAssetId);
    if (!asset) return false;
    pushUndo('Delete object');
    const oldIndex = S.assets.findIndex(a => a.id === asset.id);
    S.assets = S.assets.filter(a => a.id !== asset.id);
    S.layers = S.layers.filter(l => l.assetId !== asset.id);
    const nextAsset = S.assets[Math.min(Math.max(oldIndex, 0), S.assets.length - 1)] || S.assets[0] || null;
    S.activeAssetId = nextAsset?.id || null;
    S.file = currentAsset();
    S.sel = S.layers.find(l => l.assetId === S.activeAssetId)?.id || null;
    refreshAll();
    return true;
  }

  function duplicateSelectedAsset() {
    const asset = getAsset(S.activeAssetId);
    if (!asset) return false;
    pushUndo('Duplicate object');
    const newId = newAssetId();
    // Deep-clone the asset, give it a new id and offset position
    const clone = JSON.parse(JSON.stringify(asset));
    clone.id = newId;
    clone.name = asset.name.replace(/ copy(\s\d+)?$/, '') + ' copy';
    clone.x = (asset.x || 0) + 20;
    clone.y = (asset.y || 0) + 20;
    // Insert the clone directly after the original in the array
    const idx = S.assets.findIndex(a => a.id === asset.id);
    S.assets.splice(idx + 1, 0, clone);
    // Deep-clone all layers that belong to the original asset, reassign to new asset
    const originalLayers = S.layers.filter(l => l.assetId === asset.id);
    const clonedLayers = originalLayers.map(l => {
      const lc = JSON.parse(JSON.stringify(l));
      lc.id = newLayerId() + Math.floor(Math.random() * 9999);
      lc.assetId = newId;
      return lc;
    });
    // Insert cloned layers right after the original layers in S.layers
    if (originalLayers.length) {
      const lastOrigIdx = (() => { let li=-1; S.layers.forEach((l,i)=>{ if(l.assetId===asset.id) li=i; }); return li; })();
      S.layers.splice(lastOrigIdx + 1, 0, ...clonedLayers);
    } else {
      S.layers.push(...clonedLayers);
    }
    S.activeAssetId = newId;
    S.file = clone;
    S.sel = clonedLayers[0]?.id || null;
    refreshAll();
    return true;
  }

  function deleteProject() {
    if (confirm("Delete this project? All uploaded assets and layers will be removed and you'll start fresh.")) {
      pushUndo('Delete project');
      S.file = null;
      S.assets = [];
      S.activeAssetId = null;
      S.layers = [];
      S.sel = null;
      S.bg = 'light';
      S.customBg = '#FFFFFF';
      S.customBg2 = '#FFB000';
      S.customBgStops = normalizeGradientStops(null, '#FFFFFF', '#FFB000');
      S.customBgAngle = 135;
      S.size = '400x400';
      S.scale = 1;
      S.time = 0;
      if (S.playing) togglePlay();
      refreshAll();
      setCustomBgInputs(S.customBg, S.customBg2);
      setBg(S.bg);
      applySize(S.size);
    }
  }

  function newProject() {
    if (hasAssets() || S.layers.length) {
      if (!confirm("Start a new project? Unsaved changes will be lost.")) return;
    }
    pushUndo('New project');
    S.file = null;
    S.assets = [];
    S.activeAssetId = null;
    S.layers = [];
    S.sel = null;
    S.bg = 'light';
    S.customBg = '#FFFFFF';
    S.customBg2 = '#FFB000';
    S.customBgStops = normalizeGradientStops(null, '#FFFFFF', '#FFB000');
    S.customBgAngle = 135;
    S.size = '400x400';
    S.scale = 1;
    S.time = 0;
    S.compDur = 4.0;
    if (S.playing) togglePlay();
    refreshAll();
    setCustomBgInputs(S.customBg, S.customBg2);
    setBg(S.bg);
    applySize(S.size);
  }

  function addAssetFromPicker() {
    document.getElementById('file-upload').click();
  }

  function duplicateLayer(id) {
    const src = S.layers.find(l => l.id === id); if(!src) return;
    pushUndo('Duplicate layer');
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = newLayerId();
    copy.delay = src.delay + src.duration;
    S.layers.push(copy);
    S.sel = copy.id;
    refreshAll();
  }

  function toggleCustomBgDrop(e) {
    if (e) e.stopPropagation();
    const drop = document.getElementById('bg-custom-drop');
    const willOpen = drop?.classList.contains('hidden');

    if (bgLabel) bgLabel.textContent = bg === 'transparent' ? 'Transparent' : toTitleCase(bg);

        const c1 = S.customBg || (colorInput ? colorInput.value : '#ffffff');
        const c2 = S.customBg2 || '#FFB000';
        const angle = clampGradientAngle(S.customBgAngle, 135);
        const stops = gradientStops(S, 'customBgStops', c1, c2, 'customBg', 'customBg2');
        c.style.backgroundColor = '';

  function addAssetRecord(type, data, name) {
    pushUndo('Add asset');
    const n = S.assets.length;
    const offset = Math.min(96, n * 24);
    const asset = {
      id:newAssetId(),
      type,
      data,
      name,
      x:offset,
      y:offset,
      visible:true,
      borderGradientStops: normalizeGradientStops(null, '#FFFFFF', '#FFB000'),
    };

    // For raster images, detect natural size and fit within canvas
    if (type !== 'svg' && type !== 'text' && type !== 'shape') {
      const img = new window.Image();
      img.onload = () => {
        const canvasW = S.size ? parseInt(S.size) : 400;
        const canvasH = S.size ? parseInt(S.size.split('x')[1] || S.size) : 400;
        const maxW = canvasW * 0.9;
        const maxH = canvasH * 0.9;
        let w = img.naturalWidth || img.width || maxW;
        let h = img.naturalHeight || img.height || maxH;
        // Scale down to fit if needed, preserve ratio
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        asset.w = w;
        asset.h = h;
        renderGraphic();
        buildRightPanel();
      };
      img.src = data;
    }

    S.assets.unshift(asset);
    S.activeAssetId = asset.id;
    S.file = asset;
    S.sel = null;
    refreshAll();
  }

  function handleAssetFile(file) {
    if(!file) return;
    const fn = file.name.toLowerCase();
    const isSvg = file.type==='image/svg+xml' || fn.endsWith('.svg');
    const isImg = file.type.startsWith('image/') || /\.(png|jpg|jpeg|webp|gif)$/.test(fn);
    const reader = new FileReader();
    if(isSvg) {
      reader.onload = ev => addAssetRecord('svg', ev.target.result, file.name);
      reader.readAsText(file);
    } else if(isImg) {
      reader.onload = ev => addAssetRecord('png', ev.target.result, file.name);
      reader.readAsDataURL(file);
    } else {
      alert('Please upload SVG, PNG, JPG, WEBP or GIF.');
    }
  }

  function handleAssetFiles(files) {
    Array.from(files || []).forEach(handleAssetFile);
  }

  function initFileDrop() {
    const target = document.getElementById('canvas-target');
    if(!target) return;
    const hasFileDrag = e => Array.from(e.dataTransfer?.types || []).includes('Files');
    const clearDrop = () => target.classList.remove('drop-active');

    window.addEventListener('dragover', e => {
      if(hasFileDrag(e)) e.preventDefault();
    });
    window.addEventListener('drop', e => {
      if(hasFileDrag(e)) e.preventDefault();
      clearDrop();
    });
    target.addEventListener('dragenter', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      target.classList.add('drop-active');
    });
    target.addEventListener('dragover', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      target.classList.add('drop-active');
    });
    target.addEventListener('dragleave', e => {
      if(!target.contains(e.relatedTarget)) clearDrop();
    });
    target.addEventListener('drop', e => {
      if(!hasFileDrag(e)) return;
      e.preventDefault();
      e.stopPropagation();
      clearDrop();
      handleAssetFiles(e.dataTransfer.files);
    });
  }

  function startInlineTextEdit(wrapperEl, asset) {
    // Find the inner text div
    const textDiv = wrapperEl.querySelector('[data-text-content]') || wrapperEl.querySelector('div');
    if (!textDiv || wrapperEl.dataset.editing) return;
    wrapperEl.dataset.editing = '1';

    const original = asset.content || '';

    // Make it contenteditable in-place
    textDiv.contentEditable = 'true';
    textDiv.style.outline = '2px dashed #FFB000';
    textDiv.style.cursor = 'text';
    textDiv.style.userSelect = 'text';
    textDiv.style.webkitUserSelect = 'text';
    // Remove gradient clip so text is visible while editing
    if (asset.colorMode === 'gradient') {
      textDiv.style.webkitTextFillColor = asset.textColor || '#1F1F1F';
      textDiv.style.background = 'none';
    }
    textDiv.focus();

    // Place cursor at end
    const range = document.createRange();
    range.selectNodeContents(textDiv);
    range.collapse(false);
    const sel = window.getSelection();
    sel?.removeAllRanges();
    sel?.addRange(range);

    const commit = () => {
      if (!wrapperEl.dataset.editing) return;
      delete wrapperEl.dataset.editing;
      textDiv.contentEditable = 'false';
      textDiv.style.outline = '';
      textDiv.style.cursor = '';
      textDiv.style.userSelect = '';
      textDiv.style.webkitUserSelect = '';
      const newContent = textDiv.innerText || textDiv.textContent || '';
      if (newContent !== original) {
        pushUndo('Edit text');
        asset.content = newContent;
      }
      renderGraphic();
      buildRightPanel();
    };

    textDiv.addEventListener('blur', commit, { once: true });
    textDiv.addEventListener('keydown', e => {
      e.stopPropagation();
      // Shift+Enter = newline (default), plain Enter = commit
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        textDiv.blur();
      }
      if (e.key === 'Escape') {
        textDiv.innerText = original;
        textDiv.blur();
      }
    });
    // Prevent drag from firing while editing
    textDiv.addEventListener('pointerdown', e => e.stopPropagation());
  }

  function initObjectDrag() {
    const target = document.getElementById('canvas-target');
    const wrap = document.getElementById('graphic-wrapper');
    if(!target || !wrap) return;

    let drag = null;

    const finishDrag = () => {
      if (!drag) return;
      try { drag.el.releasePointerCapture(drag.pointerId); } catch(_) {}
      drag.el.classList.remove('dragging');

      if (drag.isDup && drag.moved) {
        // The element was visually dragged to a new position (asset.x/y updated live).
        // Capture final position, restore original, then create clone at that position.
        const finalX = drag.asset.x;
        const finalY = drag.asset.y;

        // Restore original to where it started
        drag.asset.x = drag.origX;
        drag.asset.y = drag.origY;

        // Create duplicate at the dropped position
        pushUndo('Duplicate object');
        const newId = newAssetId();
        const clone = JSON.parse(JSON.stringify(drag.asset));
        clone.id = newId;
        clone.name = drag.asset.name.replace(/ copy(\s\d+)?$/, '') + ' copy';
        clone.x = finalX;
        clone.y = finalY;

        const idx = S.assets.findIndex(a => a.id === drag.asset.id);
        S.assets.splice(idx + 1, 0, clone);

        const originalLayers = S.layers.filter(l => l.assetId === drag.asset.id);
        const clonedLayers = originalLayers.map(l => {
          const lc = JSON.parse(JSON.stringify(l));
          lc.id = 'L' + Date.now() + Math.floor(Math.random() * 99999);
          lc.assetId = newId;
          return lc;
        });
        if (clonedLayers.length) {
          const lastIdx = (() => {
            let li = -1;
            S.layers.forEach((l, i) => { if (l.assetId === drag.asset.id) li = i; });
            return li;
          })();
          if (lastIdx >= 0) S.layers.splice(lastIdx + 1, 0, ...clonedLayers);
          else S.layers.push(...clonedLayers);
        }

        S.activeAssetId = newId;
        S.file = clone;
        S.sel = clonedLayers[0]?.id || null;
        refreshAll();
      }

      drag = null;
    };

    // Double-click on text asset → inline edit directly on artboard
    wrap.addEventListener('dblclick', e => {
      const el = e.target.closest('.asset-wrapper');
      if (!el) return;
      const asset = getAsset(el.dataset.assetId);
      if (!asset || asset.type !== 'text') return;
      e.preventDefault();
      e.stopPropagation();
      startInlineTextEdit(el, asset);
    });

    wrap.addEventListener('pointerdown', e => {
      const el = e.target.closest('.asset-wrapper');
      if (!el || e.button !== 0) return;
      const asset = getAsset(el.dataset.assetId);
      if (!asset) return;
      e.preventDefault();
      e.stopPropagation();

      S.activeAssetId = asset.id;
      S.file = asset;
      S.sel = S.layers.find(l => l.assetId === asset.id)?.id || null;

      const rect = target.getBoundingClientRect();
      const scaleX = rect.width  ? target.offsetWidth  / rect.width  : 1;
      const scaleY = rect.height ? target.offsetHeight / rect.height : 1;

      drag = {
        pointerId: e.pointerId,
        el,
        asset,
        startX:  e.clientX,
        startY:  e.clientY,
        origX:   asset.x || 0,
        origY:   asset.y || 0,
        scaleX,
        scaleY,
        moved:   false,
        isDup:   e.altKey,
      };

      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      document.querySelectorAll('.asset-wrapper.selected').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
      buildPresets();
      buildTimeline();
      buildRightPanel();
    });

    wrap.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;

      if (!drag.moved && Math.hypot(dx, dy) > 3) {
        drag.moved = true;
        if (!drag.isDup) pushUndo('Move asset');
      }
      if (!drag.moved) return;

      // Both normal drag and alt+drag move the element visually — on release we decide
      drag.asset.x = drag.origX + dx * drag.scaleX;
      drag.asset.y = drag.origY + dy * drag.scaleY;
      clampAssetPosition(drag.asset);
      drag.el.style.cssText = assetPositionStyle(drag.asset);
    });

    wrap.addEventListener('pointerup',           finishDrag);
    wrap.addEventListener('pointercancel',        finishDrag);
    wrap.addEventListener('lostpointercapture',   finishDrag);
  }

  function ensureLayerContextMenu() {
    let menu = document.getElementById('layer-context-menu');
    if (menu) return menu;
    menu = document.createElement('div');
    menu.id = 'layer-context-menu';
    menu.className = 'layer-context-menu';
    document.body.appendChild(menu);
    return menu;

  function hideLayerContextMenu() {
    const menu = document.getElementById('layer-context-menu');

  function showLayerContextMenu(ev) {
    const target = document.getElementById('canvas-target');
    if (!target || !target.contains(ev.target)) return;
    ev.preventDefault();
    ev.stopPropagation();

    const clickedAssetId = ev.target.closest('.asset-wrapper')?.dataset.assetId || null;
    let assets = (S.assets || [])
      .filter(a => a.visible !== false)
      .sort((a, b) => getAssetZIndex(b) - getAssetZIndex(a));
    if (clickedAssetId) {
      assets = assets.sort((a, b) => (a.id === clickedAssetId ? -1 : b.id === clickedAssetId ? 1 : 0));
    }

    const menu = ensureLayerContextMenu();
    menu.innerHTML = '';

    if (!assets.length) {

  function showSegmentContextMenu(ev, layer) {

      hideSegmentContextMenu();

      newLayer.id = 'L' + Date.now() + Math.floor(Math.random() * 99999);
      newLayer.delay = Math.min(src.delay + src.duration, getTotalDur() - src.duration);
      const srcIdx = S.layers.findIndex(l => l.id === src.id);
      S.layers.splice(srcIdx + 1, 0, newLayer);
      S.sel = newLayer.id;
      refreshAll();

    delBtn.addEventListener('click', () => {

  // ═══════════════════════════════════════════════════════════════════════════
  // RESIZABLE SIDE PANELS
  // ═══════════════════════════════════════════════════════════════════════════
  const PANEL_STORAGE_KEY = 'vom-panel-widths-v1';
  const TIMELINE_STORAGE_KEY = 'vom-timeline-height-v1';
  const TIMELINE_LABEL_STORAGE_KEY = 'vom-timeline-label-width-v1';
  const PANEL_LIMITS = {
    left: { min: 280, max: 540, def: 300 },
    right: { min: 240, max: 560, def: 320 },
    centerMin: 360,
    resizers: 2,
  };
  const TIMELINE_LIMITS = {
    min: 120,
    max: 440,
    def: 180,
    canvasMin: 220,
    toolbar: 40,
    resizer: 1,
  };
  const TIMELINE_LABEL_LIMITS = {
    min: 150,
    max: 420,
    def: 220,
    trackMin: 280,
    resizer: 1,
  };

  function clampPanelValue(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function readPanelWidth(side) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(`--${side}-panel-w`);
    return parseFloat(raw) || PANEL_LIMITS[side].def;
  }

  function fitPanelWidths(left, right) {
    const shell = document.getElementById('workspace-shell');
    const total = shell?.getBoundingClientRect().width || window.innerWidth || 1440;
    left = clampPanelValue(left, PANEL_LIMITS.left.min, PANEL_LIMITS.left.max);
    right = clampPanelValue(right, PANEL_LIMITS.right.min, PANEL_LIMITS.right.max);

    const maxSides = Math.max(
      PANEL_LIMITS.left.min + PANEL_LIMITS.right.min,
      total - PANEL_LIMITS.centerMin - PANEL_LIMITS.resizers
    );

    if (left + right > maxSides) {
      let overflow = left + right - maxSides;
      const leftFlex = Math.max(0, left - PANEL_LIMITS.left.min);
      const rightFlex = Math.max(0, right - PANEL_LIMITS.right.min);
      const flex = leftFlex + rightFlex;
      if (flex > 0) {
        const leftCut = Math.min(leftFlex, overflow * (leftFlex / flex));
        left -= leftCut;
        overflow -= leftCut;
        right -= Math.min(rightFlex, overflow);
      } else {
        left = PANEL_LIMITS.left.min;
        right = PANEL_LIMITS.right.min;
      }
    }

    return {
      left: Math.round(clampPanelValue(left, PANEL_LIMITS.left.min, PANEL_LIMITS.left.max)),
      right: Math.round(clampPanelValue(right, PANEL_LIMITS.right.min, PANEL_LIMITS.right.max)),
    };
  }

  function applyPanelWidths(left, right, persist=false) {
    const fitted = fitPanelWidths(left, right);
    document.documentElement.style.setProperty('--left-panel-w', fitted.left + 'px');
    document.documentElement.style.setProperty('--right-panel-w', fitted.right + 'px');
    if (persist) {
      try { localStorage.setItem(PANEL_STORAGE_KEY, JSON.stringify(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initPanelResize() {
    const shell = document.getElementById('workspace-shell');
    const leftHandle = document.getElementById('left-panel-resizer');
    const rightHandle = document.getElementById('right-panel-resizer');
    if (!shell || !leftHandle || !rightHandle) return;

    try {
      const saved = JSON.parse(localStorage.getItem(PANEL_STORAGE_KEY) || 'null');
      if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.right)) {
        applyPanelWidths(saved.left, saved.right, false);
      } else {
        applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false);
      }
    } catch(_) {
      applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false);
    }

    const startDrag = (side, handle, ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      const rect = shell.getBoundingClientRect();
      const start = {
        side,
        handle,
        left: readPanelWidth('left'),
        right: readPanelWidth('right'),
        shellLeft: rect.left,
        shellRight: rect.right,
      };

      handle.classList.add('is-dragging');
      document.body.classList.add('resizing-panels');
      try { handle.setPointerCapture(ev.pointerId); } catch(_) {}

      const move = e => {
        let nextLeft = start.left;
        let nextRight = start.right;
        if (side === 'left') {
          nextLeft = e.clientX - start.shellLeft;
        } else {
          nextRight = start.shellRight - e.clientX;
        }
        applyPanelWidths(nextLeft, nextRight, false);
      };

      const stop = e => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-panels');
        try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
        applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), true);
      };

      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
      move(ev);
    };

    const resizeByKeyboard = (side, delta) => {
      const left = readPanelWidth('left');
      const right = readPanelWidth('right');
      if (side === 'left') applyPanelWidths(left + delta, right, true);
      else applyPanelWidths(left, right + delta, true);
    };

    leftHandle.addEventListener('pointerdown', ev => startDrag('left', leftHandle, ev));
    rightHandle.addEventListener('pointerdown', ev => startDrag('right', rightHandle, ev));
    leftHandle.addEventListener('dblclick', () => applyPanelWidths(PANEL_LIMITS.left.def, readPanelWidth('right'), true));
    rightHandle.addEventListener('dblclick', () => applyPanelWidths(readPanelWidth('left'), PANEL_LIMITS.right.def, true));
    leftHandle.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        resizeByKeyboard('left', e.key === 'ArrowLeft' ? -20 : 20);
      }
    });
    rightHandle.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        resizeByKeyboard('right', e.key === 'ArrowLeft' ? 20 : -20);
      }
    });
    window.addEventListener('resize', () => applyPanelWidths(readPanelWidth('left'), readPanelWidth('right'), false));
  }

  function readTimelineHeight() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--timeline-panel-h');
    return parseFloat(raw) || TIMELINE_LIMITS.def;
  }

  function fitTimelineHeight(height) {
    const center = document.getElementById('center-panel');
    const total = center?.getBoundingClientRect().height || window.innerHeight || 720;
    const availableMax = total - TIMELINE_LIMITS.toolbar - TIMELINE_LIMITS.resizer - TIMELINE_LIMITS.canvasMin;
    const max = Math.max(TIMELINE_LIMITS.min, Math.min(TIMELINE_LIMITS.max, availableMax));
    return Math.round(clampPanelValue(height, TIMELINE_LIMITS.min, max));
  }

  function applyTimelineHeight(height, persist=false) {
    const fitted = fitTimelineHeight(height);
    document.documentElement.style.setProperty('--timeline-panel-h', fitted + 'px');
    if (persist) {
      try { localStorage.setItem(TIMELINE_STORAGE_KEY, String(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initTimelineResize() {
    const center = document.getElementById('center-panel');
    const handle = document.getElementById('timeline-resizer');
    if (!center || !handle) return;

    try {
      const saved = parseFloat(localStorage.getItem(TIMELINE_STORAGE_KEY) || '');
      applyTimelineHeight(Number.isFinite(saved) ? saved : readTimelineHeight(), false);
    } catch(_) {
      applyTimelineHeight(readTimelineHeight(), false);
    }

    const startDrag = ev => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      const startY = ev.clientY;
      const startHeight = readTimelineHeight();

      handle.classList.add('is-dragging');
      document.body.classList.add('resizing-timeline');
      try { handle.setPointerCapture(ev.pointerId); } catch(_) {}

      const move = e => {
        applyTimelineHeight(startHeight - (e.clientY - startY), false);
      };

      const stop = e => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-timeline');
        try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
        applyTimelineHeight(readTimelineHeight(), true);
      };

      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
      move(ev);
    };

    handle.addEventListener('pointerdown', startDrag);
    handle.addEventListener('dblclick', () => applyTimelineHeight(TIMELINE_LIMITS.def, true));
    handle.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        applyTimelineHeight(readTimelineHeight() + (e.key === 'ArrowUp' ? 20 : -20), true);
      }
    });
    window.addEventListener('resize', () => applyTimelineHeight(readTimelineHeight(), false));
  }

  function readTimelineLabelWidth() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--timeline-label-w');
    return parseFloat(raw) || TIMELINE_LABEL_LIMITS.def;
  }

  function fitTimelineLabelWidth(width) {
    const body = document.getElementById('timeline-body');
    const total = body?.getBoundingClientRect().width || window.innerWidth || 900;
    const availableMax = total - TIMELINE_LABEL_LIMITS.trackMin - TIMELINE_LABEL_LIMITS.resizer;
    const max = Math.max(TIMELINE_LABEL_LIMITS.min, Math.min(TIMELINE_LABEL_LIMITS.max, availableMax));
    return Math.round(clampPanelValue(width, TIMELINE_LABEL_LIMITS.min, max));
  }

  function applyTimelineLabelWidth(width, persist=false) {
    const fitted = fitTimelineLabelWidth(width);
    document.documentElement.style.setProperty('--timeline-label-w', fitted + 'px');
    if (persist) {
      try { localStorage.setItem(TIMELINE_LABEL_STORAGE_KEY, String(fitted)); } catch(_) {}
    }
    return fitted;
  }

  function initTimelineColumnResize() {
    const handle = document.getElementById('timeline-column-resizer');

    try {
      const saved = parseFloat(localStorage.getItem(TIMELINE_LABEL_STORAGE_KEY) || '');

      handle.classList.add('is-dragging');

        document.removeEventListener('pointermove', move);

        document.removeEventListener('pointercancel', stop);
        handle.classList.remove('is-dragging');
        document.body.classList.remove('resizing-timeline-column');

      document.addEventListener('pointermove', move);

    handle.addEventListener('pointerdown', startDrag);

    handle.addEventListener('keydown', e => {

  function initSoftScrollbars() {
    const timers = new WeakMap();
    document.addEventListener('scroll', e => {
      const el = e.target;
      if (!(el instanceof HTMLElement)) return;
      el.classList.add('is-scrolling');
      const prev = timers.get(el);
      if (prev) window.clearTimeout(prev);
      timers.set(el, window.setTimeout(() => {
        el.classList.remove('is-scrolling');
        timers.delete(el);
      }, 850));
    }, true);
  }

  document.getElementById('json-import').onchange = function(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const cfg = JSON.parse(ev.target.result);
        // Validate it's a Vibe on Motion project file
        if (!cfg.layers && !cfg.file && !cfg.assets) { alert('This does not appear to be a Vibe on Motion project file.'); return; }
        pushUndo('Load project');
        if (cfg.assets && Array.isArray(cfg.assets)) {
          S.assets = cfg.assets.map(a => ({ ...a, id:a.id || newAssetId(), type:a.type, data:a.data, name:a.name || 'Asset', x:parseFloat(a.x)||0, y:parseFloat(a.y)||0, visible:a.visible !== false }));
          S.activeAssetId = cfg.activeAssetId || S.assets[0]?.id || null;
        } else if (cfg.file) {
          S.assets = [{ id:newAssetId(), type:cfg.file.type, data:cfg.file.data, name:cfg.file.name || 'Asset', x:parseFloat(cfg.assetX)||0, y:parseFloat(cfg.assetY)||0, visible:true }];
          S.activeAssetId = S.assets[0].id;
        }
        if (cfg.layers)  S.layers  = cfg.layers;
        if (cfg.scale)   S.scale   = cfg.scale;
        if (cfg.sel)     S.sel     = cfg.sel;
        if (cfg.size)    S.size    = cfg.size;
        if (cfg.bg)      S.bg      = cfg.bg;
        if (cfg.customBg) S.customBg = cfg.customBg;
        if (cfg.customBg2) S.customBg2 = cfg.customBg2;
        if (cfg.customBgStops) S.customBgStops = normalizeGradientStops(cfg.customBgStops, S.customBg || '#FFFFFF', S.customBg2 || '#FFB000');
        if (cfg.customBgAngle !== undefined) S.customBgAngle = clampGradientAngle(cfg.customBgAngle, 135);
        if (cfg.compDur) S.compDur = cfg.compDur;
        normalizeProjectState();
        setCustomBgInputs(S.customBg || '#FFFFFF', S.customBg2 || '#FFB000');
        refreshAll();
        setBg(S.bg);
        applySize(S.size);
        const durEl = document.getElementById('comp-dur-val');
        if (durEl) durEl.value = S.compDur.toFixed(1);
      } catch(err) { alert('Could not load project: '+err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  function resetLayer(id) {
    const l = S.layers.find(x => x.id === id); if(!l) return;
    const fresh = mkLayer(l.presetId); if(!fresh) return;
    pushUndo('Reset layer');
    Object.assign(l, { duration:fresh.duration, delay:fresh.delay, easing:fresh.easing, direction:fresh.direction, playback:fresh.playback, params:{...fresh.params} });
    refreshAll();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PLAYBACK
  // ═══════════════════════════════════════════════════════════════════════════
  function togglePlay() {
    S.playing = !S.playing;
    const btn = document.getElementById('play-btn');
    if(btn) btn.innerHTML = S.playing ? '<i data-lucide="pause" class="w-4 h-4"></i>' : '<i data-lucide="play" class="w-4 h-4"></i>';
    updateToolbarPlayIcon();
    lucide.createIcons();
    if(S.playing) {
      rafStart = performance.now() - S.time * 1000;
      raf = requestAnimationFrame(tick);
    } else {
      if(raf) cancelAnimationFrame(raf); raf = null;
    }
    renderGraphic();
  }

  function tick(ts) {
    if(!S.playing) return;
    const total = getTotalDur();
    const newTime = (ts - rafStart) / 1000;
    if (newTime >= total) {
      rafStart = ts;
      S.time = 0;
      renderGraphic();
    } else {
      S.time = newTime;
      renderGraphic();
    }
    updatePlayhead();
    raf = requestAnimationFrame(tick);
  }

  function restartAnim() {
    S.time = 0;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
    if(S.playing) {
      rafStart = performance.now();
      raf = requestAnimationFrame(tick);
    } else {
      renderGraphic();
      updatePlayhead();
    }
  }
