<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE ON MOTION — Interactive Animation Workspace</title>
  <link rel="icon" type="image/png" href="VOM_favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { orange: '#FFB000', dark: '#050505' } } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js"></script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #000; height: 100vh; }
    .font-outfit { font-family: 'Outfit', sans-serif; }
    .desktop-only-screen {
      display:none;
      min-height:100vh;
      padding:32px;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:#FAF9F6;
      color:#000;
    }
    .desktop-only-content { max-width:380px; }
    .desktop-only-logo {
      width:96px;
      height:auto;
      margin:0 auto 8px;
      display:block;
      object-fit:contain;
    }
    .desktop-only-brand {
      margin-bottom:18px;
      font-family:'Outfit', sans-serif;
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .desktop-only-screen h1 {
      margin:0 0 12px;
      font-family:'Outfit', sans-serif;
      font-size:32px;
      line-height:1;
      font-weight:900;
      letter-spacing:0;
      text-transform:uppercase;
    }
    .desktop-only-screen p {
      margin:0;
      font-size:14px;
      line-height:1.6;
      color:#57534e;
    }
    @media (max-width: 1023px) {
      body > header,
      body > main { display:none !important; }
      .desktop-only-screen { display:flex; }
    }
    :root {
      --left-panel-w: 300px;
      --right-panel-w: 320px;
      --timeline-panel-h: 180px;
      --timeline-label-w: 220px;
      --panel-resizer-w: 1px;
    }
    .workspace-header {
      display:grid;
      grid-template-columns:var(--left-panel-w) minmax(0,1fr) var(--right-panel-w);
    }
    .workspace-shell {
      display:grid;
      grid-template-columns:var(--left-panel-w) var(--panel-resizer-w) minmax(360px,1fr) var(--panel-resizer-w) var(--right-panel-w);
    }
    .workspace-left,
    .workspace-center,
    .workspace-right,
    .workspace-header > * {
      min-width:0;
    }
    .panel-resizer {
      position:relative;
      z-index:30;
      background:#d6d3d1;
      cursor:col-resize;
      touch-action:none;
      user-select:none;
    }
    .panel-resizer::after {
      content:none;
      display:none;
    }
    .panel-resizer:hover,
    .panel-resizer.is-dragging {
      background:#a8a29e;
    }
    .timeline-resizer {
      position:relative;
      z-index:30;
      flex:0 0 1px;
      height:1px;
      background:#d6d3d1;
      cursor:row-resize;
      touch-action:none;
      user-select:none;
    }
    .timeline-resizer::after {
      content:none;
      display:none;
    }
    .timeline-resizer:hover,
    .timeline-resizer.is-dragging {
      background:#a8a29e;
    }
    .timeline-column-resizer {
      position:relative;
      z-index:30;
      flex:0 0 1px;
      width:1px;
      background:#d6d3d1;
      cursor:col-resize;
      touch-action:none;
      user-select:none;
    }
    .timeline-column-resizer::after {
      content:none;
      display:none;
    }
    .timeline-column-resizer:hover,
    .timeline-column-resizer.is-dragging {
      background:#a8a29e;
    }
    body.resizing-panels {
      cursor:col-resize;
      user-select:none;
    }
    body.resizing-timeline {
      cursor:row-resize;
      user-select:none;
    }
    body.resizing-timeline-column {
      cursor:col-resize;
      user-select:none;
    }
    body.resizing-panels iframe,
    body.resizing-panels img,
    body.resizing-panels svg,
    body.resizing-timeline iframe,
    body.resizing-timeline img,
    body.resizing-timeline svg,
    body.resizing-timeline-column iframe,
    body.resizing-timeline-column img,
    body.resizing-timeline-column svg {
      pointer-events:none;
    }
    @media (max-width: 1279px) {
      :root {
        --left-panel-w: 250px;
        --right-panel-w: 280px;
      }
    }

    /* ── Keyframes ────────────────────────────────────────────────────────── */
    /* Fade group */
    @keyframes kf-fade         { 0%{opacity:0} 100%{opacity:1} }
    @keyframes kf-slide        { 0%{transform:translateX(var(--slide-x,-60px)) translateY(var(--slide-y,0px));opacity:var(--slide-fade,0)} 100%{transform:translate(0,0);opacity:1} }
    @keyframes kf-fade-slide   { 0%{transform:translateX(-40px);opacity:0} 100%{transform:translateX(0);opacity:1} }
    /* Move group (no fade) */
    @keyframes kf-move         { 0%{transform:translateX(var(--slide-x,-60px)) translateY(var(--slide-y,0px))} 100%{transform:translate(0,0)} }
    /* Scale group */
    @keyframes kf-grow         { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes kf-shrink       { 0%{transform:scale(1.6);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes kf-spin         { 0%{transform:rotate(var(--spin-deg,-180deg)) scale(0);opacity:0} 100%{transform:rotate(0deg) scale(1);opacity:1} }
    @keyframes kf-twist        { 0%{transform:scale(0) rotate(-270deg);opacity:0} 70%{transform:scale(1.1) rotate(8deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    @keyframes kf-move-scale   { 0%{transform:translateY(40px) scale(0.8);opacity:0} 100%{transform:translate(0,0) scale(1);opacity:1} }
    @keyframes kf-scale-pop    { 0%{transform:scale(0);opacity:0} 55%{transform:scale(var(--pop-scale,1.25))} 100%{transform:scale(1);opacity:1} }
    /* Mask group */
    @keyframes kf-mask-reveal  { 0%{clip-path:inset(100% 0 0 0)} 100%{clip-path:inset(0% 0 0 0)} }
    @keyframes kf-mask-center  { 0%{clip-path:inset(50% 50%)} 100%{clip-path:inset(0%)} }
    @keyframes kf-mask-resize  { 0%{clip-path:inset(0 50%)} 100%{clip-path:inset(0 0%)} }
    @keyframes kf-mask-slide   { 0%{clip-path:inset(0 100% 0 0);transform:translateX(-30px)} 100%{clip-path:inset(0 0% 0 0);transform:translateX(0)} }
    @keyframes kf-mask-expand  { 0%{clip-path:circle(0% at 50% 50%)} 100%{clip-path:circle(100% at 50% 50%)} }
    /* Blur group */
    @keyframes kf-blur         { 0%{filter:blur(var(--blur-px,20px));opacity:0} 100%{filter:blur(0px);opacity:1} }
    @keyframes kf-blur-slide   { 0%{filter:blur(16px);transform:translateX(-30px);opacity:0} 100%{filter:blur(0px);transform:translateX(0);opacity:1} }
    @keyframes kf-blur-scale   { 0%{filter:blur(12px);transform:scale(0.85);opacity:0} 100%{filter:blur(0px);transform:scale(1);opacity:1} }
    @keyframes kf-soft-blur    { 0%{filter:blur(6px);opacity:0.4} 100%{filter:blur(0px);opacity:1} }
    /* Basic Motion (loops) */
    @keyframes kf-float        { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--float-y,-24px))} }
    @keyframes kf-rotate       { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-bounce       { 0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(var(--bounce-y,-36px));animation-timing-function:cubic-bezier(0,0,.2,1)} }
    @keyframes kf-pulse        { 0%,100%{transform:scale(1)} 50%{transform:scale(var(--pulse-scale,1.1))} }
    @keyframes kf-wave         { 0%,100%{transform:rotate(0deg) translateY(0)} 25%{transform:rotate(5deg) translateY(-6px)} 75%{transform:rotate(-5deg) translateY(6px)} }
    @keyframes kf-wiggle       { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }
    /* UI Motion */
    @keyframes kf-hover-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes kf-icon-nudge   { 0%,100%{transform:translate(0,0)} 50%{transform:translate(4px,-4px)} }
    @keyframes kf-notif-pop    { 0%{transform:scale(0)} 75%{transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes kf-card-lift    { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.02)} }
    @keyframes kf-magnetic     { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-8px)} }
    /* Fade */
    @keyframes kf-fade         { 0%{opacity:0} 100%{opacity:1} }
    @keyframes kf-slide        { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0));opacity:var(--slide-fade,0)} 100%{transform:translate(0,0);opacity:1} }
    
    /* Move (no fade) */
    @keyframes kf-move         { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0))} 100%{transform:translate(0,0)} }
    @keyframes kf-prev-move-r  { 0%{transform:translateX(-10px)} 100%{transform:translateX(0)} }
    @keyframes kf-prev-move-l  { 0%{transform:translateX(10px)} 100%{transform:translateX(0)} }
    @keyframes kf-prev-move-t  { 0%{transform:translateY(10px)} 100%{transform:translateY(0)} }
    @keyframes kf-prev-move-b  { 0%{transform:translateY(-10px)} 100%{transform:translateY(0)} }

    /* Scale */
    @keyframes kf-grow         { 0%{transform:scale(var(--scale-from,0))} 100%{transform:scale(1)} }
    @keyframes kf-shrink       { 0%{transform:scale(var(--scale-from,2))} 100%{transform:scale(1)} }
    @keyframes kf-spin         { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-move-scale   { 0%{transform:translate(var(--slide-x,-40px),var(--slide-y,0)) scale(0)} 100%{transform:translate(0,0) scale(1)} }
    @keyframes kf-scale-pop    { 0%{transform:scale(0)} 70%{transform:scale(var(--pop-scale,1.25))} 100%{transform:scale(1)} }
    
    /* Mask */
    @keyframes kf-mask-top    { 0%{clip-path:inset(100% 0 0 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-bottom { 0%{clip-path:inset(0 0 100% 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-left   { 0%{clip-path:inset(0 0 0 100%)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-right  { 0%{clip-path:inset(0 100% 0 0)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-center  { 0%{clip-path:circle(0%)} 100%{clip-path:circle(100%)} }
    @keyframes kf-mask-resize  { 0%{clip-path:inset(20% 20% 20% 20%)} 100%{clip-path:inset(0)} }
    @keyframes kf-mask-slide   { 0%{clip-path:inset(0 100% 0 0);transform:translateX(-20px)} 100%{clip-path:inset(0);transform:translateX(0)} }
    @keyframes kf-mask-expand  { 0%{clip-path:ellipse(0% 0% at 50% 50%)} 100%{clip-path:ellipse(100% 100% at 50% 50%)} }

    /* Blur */
    @keyframes kf-blur         { 0%{filter:blur(var(--blur-px,20px))} 100%{filter:blur(0)} }
    @keyframes kf-blur-slide   { 0%{filter:blur(var(--blur-px,20px));transform:translateX(-40px)} 100%{filter:blur(0);transform:translateX(0)} }
    @keyframes kf-blur-scale   { 0%{filter:blur(var(--blur-px,20px));transform:scale(1.5)} 100%{filter:blur(0);transform:scale(1)} }
    @keyframes kf-soft-blur    { 0%{filter:blur(var(--blur-px,10px));opacity:0} 100%{filter:blur(0);opacity:1} }

    /* Basic Motion */
    @keyframes kf-float        { 0%,100%{transform:translateY(0)} 50%{transform:translateY(var(--float-y,-24px))} }
    @keyframes kf-rotate       { 0%{transform:rotate(0deg)} 100%{transform:rotate(var(--rot-deg,360deg))} }
    @keyframes kf-bounce       { 0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(var(--bounce-y,-36px));animation-timing-function:cubic-bezier(0,0,.2,1)} }
    @keyframes kf-pulse        { 0%,100%{transform:scale(1)} 50%{transform:scale(var(--pulse-scale,1.1))} }
    @keyframes kf-wave         { 0%,100%{transform:rotate(0deg) translateY(0)} 25%{transform:rotate(5deg) translateY(-6px)} 75%{transform:rotate(-5deg) translateY(6px)} }
    @keyframes kf-wiggle       { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(6deg)} 75%{transform:rotate(-6deg)} }
    
    /* UI Motion */
    @keyframes kf-hover-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes kf-notif-pop    { 0%{transform:scale(0)} 75%{transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes kf-card-lift    { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.02)} }
    @keyframes kf-magnetic     { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-8px)} }
    
    /* Premium */
    @keyframes kf-luxury       { 0%{transform:translateY(20px) scale(.96);opacity:0;filter:blur(8px)} 100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)} }
    @keyframes kf-soft-hover   { 0%,100%{transform:scale(1) translateY(0)} 50%{transform:scale(1.02) translateY(-3px)} }
    @keyframes kf-glass-shimmer{ 0%,100%{opacity:.85;filter:brightness(1)} 50%{opacity:1;filter:brightness(1.12)} }
    
    /* Previews */
    @keyframes kf-prev-move-r { 0% {transform:translateX(-10px); opacity:0;} 100% {transform:translateX(0); opacity:1;} }
    @keyframes kf-prev-move-l { 0% {transform:translateX(10px); opacity:0;} 100% {transform:translateX(0); opacity:1;} }
    @keyframes kf-prev-move-t { 0% {transform:translateY(10px); opacity:0;} 100% {transform:translateY(0); opacity:1;} }
    @keyframes kf-prev-move-b { 0% {transform:translateY(-10px); opacity:0;} 100% {transform:translateY(0); opacity:1;} }
    @keyframes kf-prev-blur { 0% {filter:blur(8px); opacity:0.25;} 50% {filter:blur(0); opacity:1;} 100% {filter:blur(8px); opacity:0.25;} }
    @keyframes kf-prev-blur-slide { 0% {filter:blur(8px); opacity:0.25; transform:translateX(-10px);} 50% {filter:blur(0); opacity:1; transform:translateX(0);} 100% {filter:blur(8px); opacity:0.25; transform:translateX(0);} }
    @keyframes kf-prev-blur-scale { 0% {filter:blur(8px); opacity:0.25; transform:scale(0.85);} 50% {filter:blur(0); opacity:1; transform:scale(1);} 100% {filter:blur(8px); opacity:0.25; transform:scale(1);} }
    @keyframes kf-prev-soft-blur { 0% {filter:blur(4px); opacity:0.45;} 100% {filter:blur(0); opacity:1;} }
    
    /* Playful */
    @keyframes kf-elastic-pop  { 0%{transform:scale(0)} 50%{transform:scale(1.2)} 75%{transform:scale(.92)} 100%{transform:scale(1)} }
    @keyframes kf-jelly        { 0%,100%{transform:scale(1,1)} 30%{transform:scale(1.2,.8)} 50%{transform:scale(.9,1.15)} 70%{transform:scale(1.05,.95)} }
    @keyframes kf-bloom        { 0%{transform:scale(.4);filter:blur(10px);opacity:0} 100%{transform:scale(1);filter:blur(0);opacity:1} }
    @keyframes kf-bubble-rise  { 0%{transform:translateY(60px) scale(.5);opacity:0} 50%{transform:translateY(0) scale(1.05);opacity:1} 100%{transform:translateY(-60px) scale(.8);opacity:0} }
    @keyframes kf-orbit        { 0%{transform:rotate(0deg) translateX(var(--orbit-r,50px)) rotate(0deg)} 100%{transform:rotate(360deg) translateX(var(--orbit-r,50px)) rotate(-360deg)} }
    
    /* Tech */
    @keyframes kf-glitch       { 0%,100%{transform:translate(0);clip-path:inset(0);filter:none} 10%{transform:translate(-4px,2px);clip-path:inset(10% 0 60% 0);filter:drop-shadow(var(--rgb-split,-4px) 0 0 red) drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 blue)} 20%{transform:translate(4px,-2px);clip-path:inset(80% 0 5% 0);filter:drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 red) drop-shadow(var(--rgb-split,-4px) 0 0 blue)} 30%{transform:translate(-2px,2px);clip-path:inset(40% 0 40% 0);filter:none} 40%{transform:translate(2px,-2px);clip-path:inset(20% 0 20% 0);filter:drop-shadow(var(--rgb-split,-4px) 0 0 red)} 50%{transform:translate(0);clip-path:inset(0);filter:none} }
    @keyframes kf-hologram     { 0%,100%{opacity:1;filter:hue-rotate(0deg) brightness(1)} 33%{opacity:.7;filter:hue-rotate(90deg) brightness(1.3)} 66%{opacity:.9;filter:hue-rotate(180deg) brightness(.9)} }
    @keyframes kf-neon-glow    { 0%,100%{filter:drop-shadow(0 0 2px var(--glow-color,#FFB000))} 50%{filter:drop-shadow(0 0 12px var(--glow-color,#FFB000)) drop-shadow(0 0 24px var(--glow-color,#FFB000))} }
    @keyframes kf-pixel        { 0%{opacity:0;filter:contrast(2) brightness(1.3)} 100%{opacity:1;filter:contrast(1) brightness(1)} }
    @keyframes kf-rgb-split    { 0%,100%{filter:none} 50%{filter:drop-shadow(var(--rgb-split,-4px) 0 0 red) drop-shadow(calc(var(--rgb-split,-4px) * -1) 0 0 blue)} }
    @keyframes kf-x-ray        { 0%,100%{filter:invert(1) grayscale(1) opacity(var(--xray-op,0.8)) drop-shadow(0 0 4px rgba(255,255,255,0.5))} 50%{filter:invert(1) grayscale(1) opacity(calc(var(--xray-op,0.8) + 0.2)) drop-shadow(0 0 12px rgba(255,255,255,0.8))} }

    /* Gaming */
    @keyframes kf-loot-glow    { 0%,100%{filter:drop-shadow(0 0 4px gold) brightness(1)} 50%{filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 40px gold) brightness(1.4)} }
    @keyframes kf-damage-shake { 0%,100%{transform:translate(0,0) rotate(0deg)} 15%{transform:translate(-6px,2px) rotate(-2deg)} 30%{transform:translate(6px,-2px) rotate(2deg)} 45%{transform:translate(-4px,1px) rotate(-1deg)} 60%{transform:translate(4px,-1px) rotate(1deg)} }
    @keyframes kf-energy       { 0%{transform:scale(.9);filter:brightness(1) saturate(1)} 50%{transform:scale(1.05);filter:brightness(1.5) saturate(2)} 100%{transform:scale(1);filter:brightness(1) saturate(1)} }

    /* Stroke / Trim Paths: dasharray set per-element, no auto-animation (JS drives it via stroke-dashoffset) */
    .layer-trim-paths svg path, .layer-trim-paths svg line, .layer-trim-paths svg polyline, .layer-trim-paths svg polygon, .layer-trim-paths svg rect, .layer-trim-paths svg circle, .layer-trim-paths svg ellipse {
      stroke-dasharray: var(--path-len, 2000) !important;
      fill: transparent !important;
      stroke-width: var(--stroke-w, 2px) !important;
      stroke-linecap: var(--stroke-cap, round) !important;
      stroke-linejoin: var(--stroke-join, round) !important;
      stroke: var(--stroke-color, #FFB000) !important;
    }

    /* ── Utilities ──────────────────────────────────────────────────────────── */
    .bg-grid {
      background-size:20px 20px;
      background-image: linear-gradient(to right,rgba(0,0,0,.04) 1px,transparent 1px),
                        linear-gradient(to bottom,rgba(0,0,0,.04) 1px,transparent 1px);
    }
    .bg-checkerboard {
      background-image: linear-gradient(45deg, #e5e5e5 25%, transparent 25%), linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e5e5 75%), linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    /* Range sliders */
    input[type="range"] {
      -webkit-appearance:none; appearance:none; width:100%; height:4px;
      background:linear-gradient(to right,#FFB000 var(--rp,0%),#E5E7EB var(--rp,0%));
      outline:none; border:none; border-radius:0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none; width:12px; height:12px;
      border-radius:50%; background:#000; cursor:pointer;
    }
    input[type="range"]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#000; border:none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance:none;
      appearance:none;
      margin:0;
    }
    input[type="number"] {
      color-scheme:light;
      -moz-appearance:textfield;
    }
    /* Scrollbars: hidden until scrolling, then soft and thin */
    * {
      scrollbar-width:thin;
      scrollbar-color:transparent transparent;
    }
    .is-scrolling {
      scrollbar-color:#b8b4ae transparent;
    }
    ::-webkit-scrollbar {
      width:4px;
      height:4px;
    }
    ::-webkit-scrollbar-track,
    ::-webkit-scrollbar-corner {
      background:transparent;
    }
    ::-webkit-scrollbar-thumb {
      background:transparent;
      border-radius:999px;
    }
    .is-scrolling::-webkit-scrollbar-thumb {
      background:#b8b4ae;
    }
    .is-scrolling::-webkit-scrollbar-thumb:hover {
      background:#8f8a83;
    }
    /* Preset card hover preview */
    .preset-card:hover .card-dot {
      animation: var(--prev-anim, kf-float 1.2s ease-in-out infinite);
      background:#FFFFFF !important;
      border-color:#FFFFFF !important;
    }
    .preset-card.preset-id-move-in-right:hover .card-dot { animation: kf-prev-move-r 1s infinite; }
    .preset-card.preset-id-move-in-left:hover .card-dot { animation: kf-prev-move-l 1s infinite; }

  function getPreset(id) {
    for (const g of PRESET_GROUPS) {
      const p = g.presets.find(p => p.id === id);
      if (p) return p;
    }
    return null;

    customBg2: '#FFB000',
    size: '400x400',
    scale: 1,
    playing: false,
    time: 0,
    compDur: 5.0,          // total composition duration
  };

  let raf = null, rafStart = null;
  const HISTORY_LIMIT = 35;
  let undoStack = [];
  let redoStack = [];
  let historyRestoring = false;
  const continuousHistoryKeys = new Set();

  function projectSnapshot() {
    return JSON.stringify({
      assets: S.assets || [],
      activeAssetId: S.activeAssetId,
      selectedAssetIds: S.selectedAssetIds || [],
      layers: S.layers || [],
      sel: S.sel,
      bg: S.bg,
      customBg: S.customBg || '#FFFFFF',
      customBg2: S.customBg2 || '#FFB000',
      size: S.size,
      scale: S.scale,
      time: S.time,
      compDur: S.compDur,
    });
  }

  function pushUndo(label='Edit') {
    if (historyRestoring) return;
    const state = projectSnapshot();
    if (undoStack.length && undoStack[undoStack.length - 1].state === state) return;
    undoStack.push({ label, state });
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
  }

  function pushUndoContinuous(key, label='Edit') {
    if (continuousHistoryKeys.has(key)) return;
    pushUndo(label);
    continuousHistoryKeys.add(key);
  }

  function endContinuousUndo() {
    continuousHistoryKeys.clear();
  }

  function setCustomBgInputs(color, color2) {
    const safe = color || '#FFFFFF';
    const safe2 = color2 || S.customBg2 || '#FFB000';
    const cCol = document.getElementById('bg-custom-color');
    const cHex = document.getElementById('bg-custom-hex');
    const gCol = document.getElementById('bg-gradient-color');
    const gHex = document.getElementById('bg-gradient-hex');
    if (cCol) cCol.value = safe;
    if (cHex) cHex.value = safe;
    if (gCol) gCol.value = safe2;
    if (gHex) gHex.value = safe2;
    updateCustomBgModeUI();
  }

  function restoreProjectSnapshot(state) {
    let snap;
    try { snap = JSON.parse(state); } catch(_) { return; }
    historyRestoring = true;
    if (S.playing) togglePlay();
    S.assets = JSON.parse(JSON.stringify(snap.assets || []));
    S.activeAssetId = snap.activeAssetId || null;
    S.layers = JSON.parse(JSON.stringify(snap.layers || []));
    S.sel = snap.sel || null;
    S.bg = snap.bg || 'light';
    S.customBg = snap.customBg || '#FFFFFF';
    S.customBg2 = snap.customBg2 || '#FFB000';
    S.size = snap.size || '400x400';
    S.scale = parseFloat(snap.scale) || 1;
    S.time = parseFloat(snap.time) || 0;
    S.compDur = parseFloat(snap.compDur) || 5;
    normalizeProjectState();
    setCustomBgInputs(S.customBg, S.customBg2);
    refreshAll();
    setBg(S.bg, false);
    applySize(S.size, false);
    setScale(S.scale, false);
    const durEl = document.getElementById('comp-dur-val');
    if (durEl) durEl.value = S.compDur.toFixed(1);
    updatePlayhead();
    historyRestoring = false;
  }

  function undoProject() {
    endContinuousUndo();
    if (!undoStack.length) return;
    const current = projectSnapshot();
    let previous = undoStack.pop();
    if (!previous) return;
    redoStack.push({ label: 'Redo', state: current });
    restoreProjectSnapshot(previous.state);
  }

  function redoProject() {
    endContinuousUndo();
    if (!redoStack.length) return;
    const current = projectSnapshot();
    const next = redoStack.pop();
    undoStack.push({ label: 'Undo', state: current });
    restoreProjectSnapshot(next.state);
  }

  function newLayerId() { return 'L' + Date.now(); }
  function newAssetId() { return 'A' + Date.now() + Math.floor(Math.random() * 1000); }

  function hasAssets() { return S.assets && S.assets.length > 0; }
  function getAsset(id) { return (S.assets || []).find(a => a.id === id) || null; }
  function currentAsset() {
    if (!S.assets) S.assets = [];
    return getAsset(S.activeAssetId) || S.assets[0] || null;
  }
  function setActiveAsset(id, selectLayer=true) {
    const asset = getAsset(id);
    if (!asset) return;
    S.activeAssetId = asset.id;
    S.file = asset;
    if (selectLayer) S.sel = S.layers.find(l => l.assetId === asset.id)?.id || null;
    buildPresets();
    renderGraphic();
    buildTimeline();
    buildRightPanel();
  }

  function reorderAssetByIndex(fromIdx, toIdx) {
    if (!S.assets || fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= S.assets.length || toIdx >= S.assets.length) return;
    pushUndo('Reorder layers');
    const temp = S.assets[fromIdx];
    S.assets.splice(fromIdx, 1);
    S.assets.splice(toIdx, 0, temp);
    refreshAll();
  }

  function reorderAssetById(fromId, toId) {
    const fromIdx = (S.assets || []).findIndex(a => a.id === fromId);
    const toIdx = (S.assets || []).findIndex(a => a.id === toId);
    reorderAssetByIndex(fromIdx, toIdx);
  }

  function movePresetToTimelineRow(layerId, targetAssetId, insertAt=999) {
    const layer = S.layers.find(l => l.id === layerId);
    if (!layer || !getAsset(targetAssetId)) return false;
    const targetEffects = S.layers.filter(l => l.assetId === targetAssetId && l.id !== layerId);
    const currentEffects = S.layers.filter(l => l.assetId === layer.assetId);
    const currentPos = currentEffects.findIndex(l => l.id === layerId);
    const nextPos = Math.max(0, Math.min(insertAt, targetEffects.length));
    if (layer.assetId === targetAssetId && currentPos === nextPos) return false;

    pushUndo('Move preset');
    S.layers = S.layers.filter(l => l.id !== layerId);
    layer.assetId = targetAssetId;

    if (!targetEffects.length) {
      S.layers.push(layer);
    } else {
      const ref = targetEffects[Math.min(nextPos, targetEffects.length - 1)];
      let refIdx = S.layers.findIndex(l => l.id === ref.id);
      if (nextPos >= targetEffects.length) refIdx += 1;
      S.layers.splice(refIdx, 0, layer);
    }

    S.activeAssetId = targetAssetId;
    S.sel = layer.id;
    refreshAll();
    return true;
  }

  function startAssetDrag(ev, id) {
    ev.stopPropagation();
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('vom-asset-id', id);
    ev.dataTransfer.setData('text/plain', id);
    ev.currentTarget.style.opacity = '0.45';
  }
  function overAssetDrag(ev) {
    ev.preventDefault();
    ev.currentTarget.style.boxShadow = 'inset 0 0 0 2px #FFB000';
  }
  function leaveAssetDrag(ev) {
    ev.currentTarget.style.boxShadow = '';
  }
  function dropAssetDrag(ev, id) {
    ev.preventDefault();
    ev.stopPropagation();
    ev.currentTarget.style.boxShadow = '';
    const fromId = ev.dataTransfer.getData('vom-asset-id') || ev.dataTransfer.getData('text/plain');
    if (fromId) reorderAssetById(fromId, id);
  }
  function endAssetDrag(ev) {
    ev.currentTarget.style.opacity = '';
    ev.currentTarget.style.boxShadow = '';
  }

  function normalizeProjectState() {
    if (!S.assets) S.assets = [];
    if (!S.assets.length && S.file) {
      S.assets = [{
        id: newAssetId(),
        type: S.file.type,
        data: S.file.data,
        name: S.file.name || 'Asset',
        x: S.assetX || 0,
        y: S.assetY || 0,
        visible: true,
      }];
      S.activeAssetId = S.assets[0].id;
    }
    if ((!S.activeAssetId || !getAsset(S.activeAssetId)) && S.assets[0]) S.activeAssetId = S.assets[0].id;
    S.assets.forEach(a => {
      if (a.type === 'text') {
        if (!a.content)      a.content = 'Your Text';
        if (!a.fontFamily)   a.fontFamily = 'Inter';
        if (!a.fontSize)     a.fontSize = 48;
        if (!a.fontWeight)   a.fontWeight = '700';
        if (!a.fontStyle)    a.fontStyle = 'normal';
        if (!a.textColor)    a.textColor = '#1F1F1F';
        if (!a.textColor2)   a.textColor2 = '#FFB000';
        if (!a.colorMode)    a.colorMode = 'solid';
        if (a.gradientAngle === undefined) a.gradientAngle = 90;
        if (!a.textAlign)    a.textAlign = 'center';
        if (a.letterSpacing === undefined) a.letterSpacing = 0;
        if (a.lineHeight    === undefined) a.lineHeight = 1.2;
        if (!a.w) a.w = 320;
        if (!a.h) a.h = 80;
        loadGoogleFont(a.fontFamily);
        return;
      }
      if (a.type !== 'shape') return;
      if (!['square','circle','triangle','star'].includes(a.shapeType)) a.shapeType = 'square';
      if (!a.w) a.w = 150;
      if (!a.h) a.h = 150;
      if (a.rotation === undefined) a.rotation = 0;
      if (a.radius === undefined) a.radius = 0;
      if (a.points === undefined) a.points = a.shapeType === 'star' ? 5 : 3;
      if (!a.fill) a.fill = '#1F1F1F';
      if (!a.fill2) a.fill2 = '#FFB000';
      if (!a.fillMode) a.fillMode = 'solid';
      if (!a.stroke) a.stroke = '#FFFFFF';
      if (!a.stroke2) a.stroke2 = '#FFB000';
      if (!a.strokeMode) a.strokeMode = 'solid';
      if (a.strokeWidth === undefined) a.strokeWidth = 0;
      if (!a.strokeJoin) a.strokeJoin = 'round';
    });
    S.layers.forEach(l => {
      if (!l.assetId && S.activeAssetId) l.assetId = S.activeAssetId;
      if (l.presetId === 'trim-paths') {
        if (!l.params) l.params = {};
        if (l.params.trimEnd === undefined) l.params.trimEnd = 100;
        if (l.params['stroke-width'] === undefined) l.params['stroke-width'] = 4;
        if (l.params['stroke-cap'] === undefined) l.params['stroke-cap'] = 'round';
        if (l.params['stroke-c1'] === undefined) l.params['stroke-c1'] = '#FFB000';
        if (l.params['stroke-c2'] === undefined) l.params['stroke-c2'] = '#FFFFFF';
        if (l.params['stroke-color-mode'] === undefined) l.params['stroke-color-mode'] = 'solid';
      }
    });
    S.file = currentAsset();
  }
  function getAssetLabel(id) {
    const asset = getAsset(id);
    return asset ? asset.name.replace(/\.[^.]+$/, '') : 'Object';
  }

  function getLayerTimelineColor(layerOrId) {
    const id = typeof layerOrId === 'string' ? layerOrId : layerOrId?.id;
    const idx = Math.max(0, S.layers.findIndex(l => l.id === id));
    return TIMELINE_COLORS[idx % TIMELINE_COLORS.length];
  }

  function mkLayer(presetId) {
    const p = getPreset(presetId);
    const asset = currentAsset();
    if (!p || !asset) return null;
    const params = {};
    // defaults
    if (p.controls.includes('opacity'))     params.opacity     = 1;
    if (p.controls.includes('blur-amt'))    params.blurAmt     = 20;
    if (p.controls.includes('scale-range')) params.scaleFrom   = 0;
    if (p.controls.includes('slide-dir'))   params.slideDir    = 'left';
    if (p.controls.includes('slide-dist'))  params.slideDist   = 60;
    if (p.controls.includes('slide-fade'))  params.slideFade   = 100;
    if (p.controls.includes('rot-deg'))     params.rotDeg      = 360;
    if (p.controls.includes('pop-scale'))   params.popScale    = 1.25;
    if (p.controls.includes('mask-dir'))    params.maskDir     = 'top';
    if (p.controls.includes('float-dist'))  params.floatDist   = 24;
    if (p.controls.includes('bounce-h'))    params.bounceH     = 36;
    if (p.controls.includes('pulse-scale')) params.pulseScale  = 1.1;
    if (p.controls.includes('orbit-r'))     params.orbitR      = 50;
    if (p.controls.includes('glitch-int'))  params.glitchInt   = 1;
    if (p.controls.includes('glow-color'))  params.glowColor   = '#FFB000';
    if (p.controls.includes('glow-size'))   params.glowSize    = 12;
    if (p.controls.includes('stroke-width')) params['stroke-width'] = 4;
    if (p.controls.includes('stroke-cap')) params['stroke-cap'] = 'round';
    if (p.controls.includes('stroke-color')) {
      params['stroke-color-mode'] = 'solid';
      params['stroke-c1'] = '#FFB000';
      params['stroke-c2'] = '#FFFFFF';
    }
    if (p.controls.includes('trim-end')) params.trimEnd = 100;
    const layer = {
      id: newLayerId(),
      assetId: asset.id,
      presetId,
      name: p.name,
      kf: p.kf,
      visible: true,
      direction: 'in',                     // 'in'|'out'
      duration: 1.5,
      delay: 0,
      easing: p.easing,
      params,
    };
    if (presetId === 'move-in-right') { layer.params.slideDir = 'right'; }
    if (presetId === 'move-in-left') { layer.params.slideDir = 'left'; }
    if (presetId === 'move-top') { layer.params.slideDir = 'top'; }
    if (presetId === 'move-bottom') { layer.params.slideDir = 'bottom'; }
    
    return layer;
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // LEFT PANEL — preset grid
  // ═══════════════════════════════════════════════════════════════════════════
  function buildPresets() {
    normalizeProjectState();
    const c = document.getElementById('presets-container');
    const countEl = document.getElementById('presets-count');
    c.innerHTML = '';

    const asset = currentAsset();
    const hasFile = !!asset;

    let total = 0;
    PRESET_GROUPS.forEach(group => {
      total += group.presets.length;
      const sec = document.createElement('div');
      sec.className = 'preset-section space-y-2';
      sec.innerHTML = `<h3 class="text-[10px] font-bold uppercase tracking-widest text-stone-500 font-outfit">${group.title}</h3>`;
      const grid = document.createElement('div');
      grid.className = 'preset-grid';

      group.presets.forEach(p => {
        const isApplied = asset ? S.layers.some(l => l.assetId === asset.id && l.presetId === p.id) : false;
        const div = document.createElement('div');
        div.className = `preset-card preset-id-${p.id} flex flex-col justify-between border border-black p-1.5 cursor-pointer select-none transition-colors ${isApplied ? 'applied' : 'bg-white hover:bg-stone-50'} ${!hasFile ? 'opacity-40 cursor-not-allowed' : ''}`;
        // For blur presets, don't set --prev-anim so the preset-id selectors above apply instead.
        if (!['blur', 'blur-slide', 'blur-scale', 'soft-blur'].includes(p.id)) {
          div.style.setProperty('--prev-anim', `${p.kf} 1.4s ease-in-out infinite`);
        }

        if (hasFile) {
          if (!isApplied) {
            div.onclick = () => applyPreset(p.id);
          } else {
            div.onclick = () => {
              const layer = S.layers.find(l => l.assetId === asset.id && l.presetId === p.id);
              if (layer) { S.sel = layer.id; refreshAll(); }
            };
          }
        }

        div.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="card-label text-[8px] font-bold uppercase leading-tight text-stone-700 ${isApplied ? 'text-brand-orange' : ''}">${p.name}</span>
            ${isApplied ? `<button onclick="event.stopPropagation(); removeLayerByPreset('${p.id}')" class="text-brand-orange hover:text-orange-700 p-1 -mr-1 -mt-1"><i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
          </div>
          <div class="flex-1 mt-1 flex items-center justify-center">
            <div class="card-dot w-3 h-3 ${isApplied ? 'bg-brand-orange' : 'bg-black border border-black'}"></div>
          </div>`;
        grid.appendChild(div);
      });

      sec.appendChild(grid);
      c.appendChild(sec);
    });

    if (countEl) countEl.textContent = `${total} LIBRARY`;
    lucide.createIcons();
  }

  function removeLayerByPreset(presetId) {
    const asset = currentAsset();
    const layer = asset ? S.layers.find(l => l.assetId === asset.id && l.presetId === presetId) : null;
    if (layer) removeLayer(layer.id);
  }

  function applyPreset(presetId) {
    // Multi-select: apply to all selected assets
    if (isMultiSelect()) {
      const ids = getSelectedIds();
      pushUndo('Apply preset to ' + ids.length + ' layers');
      ids.forEach(assetId => {
        const already = S.layers.find(l => l.assetId === assetId && l.presetId === presetId);
        if (already) return;
        const layer = mkLayer(presetId);
        if (!layer) return;
        layer.assetId = assetId;
        S.layers.push(layer);
      });
      refreshAll();
      return;
    }
    // Single asset
    const asset = currentAsset();
    if (!asset) return;
    const existing = S.layers.find(l => l.assetId === asset.id && l.presetId === presetId);
    if (existing) {
      S.sel = existing.id;
      refreshAll();
      return;
    }
    pushUndo('Apply preset');
    const layer = mkLayer(presetId);
    if (!layer) return;
    S.layers.push(layer);
    S.sel = layer.id;
    refreshAll();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // RENDER GRAPHIC — uses nested wrapper divs so each layer's animation is
  //   on its own element, allowing transforms from different presets to stack.
  // ═══════════════════════════════════════════════════════════════════════════
  function getAssetTimelineIndex(asset) {
    return (S.assets || []).findIndex(a => a.id === asset.id);
  }

  function getAssetZIndex(asset) {
    const assetIndex = getAssetTimelineIndex(asset);
    if (assetIndex >= 0) return 1000 + ((S.assets || []).length - assetIndex);
    return 100;
  }

  function assetPositionStyle(asset) {
    const width = asset.w ? `${asset.w}px` : '80%';
    const height = asset.h ? `${asset.h}px` : '80%';
    const rotation = parseFloat(asset.rotation) || 0;
    return `left:calc(50% + ${asset.x || 0}px);top:calc(50% + ${asset.y || 0}px);width:${width};height:${height};transform:translate(-50%,-50%) rotate(${rotation}deg);z-index:${getAssetZIndex(asset)};`;
  }

  function applyGraphicPosition() {
    (S.assets || []).forEach(asset => {
      const el = document.querySelector(`[data-asset-id="${asset.id}"]`);
      if (el) el.style.cssText = assetPositionStyle(asset);
    });
  }

  function clampAssetPosition(asset=currentAsset()) {
    if (!asset) return;
    const c = document.getElementById('canvas-target');
    const [wStr, hStr] = (S.size || '400x400').split('x');
    const cw = c?.offsetWidth || parseInt(wStr) || 400;
    const ch = c?.offsetHeight || parseInt(hStr) || 400;
    asset.x = Math.max(-cw / 2, Math.min(cw / 2, asset.x || 0));
    asset.y = Math.max(-ch / 2, Math.min(ch / 2, asset.y || 0));
  }

  function buildAssetHTML(asset) {
    if (asset.type === 'shape') return buildShapeHTML(asset);
    if (asset.type === 'text')  return buildTextHTML(asset);
    if (asset.type === 'svg') {
      let d = asset.data;
      const xi = d.indexOf('<svg');
      if (xi > -1) d = d.substring(xi);
      return d;
    }
    return `<img src="${asset.data}" alt="Graphic" style="width:100%;height:100%;object-fit:contain;display:block;">`;
  }

  function buildTextHTML(asset) {
    const font    = asset.fontFamily || 'Inter';
    const size    = asset.fontSize   || 48;
    const weight  = asset.fontWeight || '700';
    const align   = asset.textAlign  || 'center';
    const content = asset.content    || 'Text';
    const italic  = asset.fontStyle === 'italic' ? 'italic' : 'normal';
    const ls      = asset.letterSpacing !== undefined ? asset.letterSpacing : 0;
    const lh      = asset.lineHeight    !== undefined ? asset.lineHeight    : 1.2;
    const justify = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';

    let colorStyle = '';
    if (asset.colorMode === 'gradient') {
      const c1    = asset.textColor  || '#1F1F1F';
      const c2    = asset.textColor2 || '#FFB000';
      const angle = asset.gradientAngle !== undefined ? asset.gradientAngle : 90;
      colorStyle  = `background:linear-gradient(${angle}deg,${c1},${c2});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;`;
    } else {
      colorStyle = `color:${asset.textColor || '#1F1F1F'};`;
    }

    return `<div style="font-family:'${font}',sans-serif;font-size:${size}px;font-weight:${weight};font-style:${italic};${colorStyle}text-align:${align};letter-spacing:${ls}px;line-height:${lh};white-space:pre-wrap;word-break:break-word;width:100%;height:100%;display:flex;align-items:center;justify-content:${justify};padding:4px;">${content}</div>`;
  }

  function safeShapeColor(value, fallback) {
    return /^#[0-9a-f]{6}$/i.test(value || '') ? value : fallback;
  }

  function shapeGradientId(asset, kind) {
    return `shape-${String(asset.id || 'asset').replace(/[^a-z0-9_-]/gi, '')}-${kind}`;
  }

  function shapePaint(asset, kind, fallbackA, fallbackB, defs) {
    const mode = asset[`${kind}Mode`] || 'solid';
    const c1 = safeShapeColor(asset[kind], fallbackA);
    const c2 = safeShapeColor(asset[`${kind}2`], fallbackB);
    if (mode === 'gradient') {
      const id = shapeGradientId(asset, kind);
      defs.push(`<linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient>`);
      return `url(#${id})`;
    }
    return c1;
  }

  function pointFmt(n) {
    return Number(n).toFixed(2).replace(/\.?0+$/,'');
  }

  function roundedPolygonPath(points, radius=0) {
    const pts = (points || []).filter(p => Array.isArray(p) && p.length === 2);
    if (pts.length < 3) return '';
    const rBase = Math.max(0, Math.min(24, parseFloat(radius) || 0));
    if (!rBase) {
      return `M ${pointFmt(pts[0][0])} ${pointFmt(pts[0][1])} ` +
        pts.slice(1).map(p => `L ${pointFmt(p[0])} ${pointFmt(p[1])}`).join(' ') + ' Z';
    }
    let d = '';
    pts.forEach((curr, i) => {
      const prev = pts[(i - 1 + pts.length) % pts.length];
      const next = pts[(i + 1) % pts.length];
      const prevDist = Math.hypot(prev[0] - curr[0], prev[1] - curr[1]) || 1;
      const nextDist = Math.hypot(next[0] - curr[0], next[1] - curr[1]) || 1;
      const r = Math.min(rBase, prevDist / 2, nextDist / 2);
      const start = [
        curr[0] + (prev[0] - curr[0]) / prevDist * r,
        curr[1] + (prev[1] - curr[1]) / prevDist * r,
      ];
      const end = [
        curr[0] + (next[0] - curr[0]) / nextDist * r,
        curr[1] + (next[1] - curr[1]) / nextDist * r,
      ];
      d += i === 0
        ? `M ${pointFmt(start[0])} ${pointFmt(start[1])} `
        : `L ${pointFmt(start[0])} ${pointFmt(start[1])} `;
      d += `Q ${pointFmt(curr[0])} ${pointFmt(curr[1])} ${pointFmt(end[0])} ${pointFmt(end[1])} `;
    });
    return d + 'Z';
  }

  function starPoints(count=5, innerRatio=0.45) {
    const spikes = Math.max(3, Math.min(12, Math.round(parseFloat(count) || 5)));
    const pts = [];
    const cx = 50, cy = 50, outer = 44;
    const inner = Math.max(5, Math.min(43, outer * (parseFloat(innerRatio) || 0.45)));
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = -Math.PI / 2 + (i * Math.PI / spikes);
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }

  function buildShapeHTML(asset) {
    const defs = [];
    const fill = shapePaint(asset, 'fill', '#1F1F1F', '#FFB000', defs);
    const stroke = shapePaint(asset, 'stroke', '#FFFFFF', '#FFB000', defs);
    const sw = Math.max(0, Math.min(24, parseFloat(asset.strokeWidth) || 0));
    const radius = Math.max(0, Math.min(50, parseFloat(asset.radius) || 0));
    const strokeJoin = ['round','miter','bevel'].includes(asset.strokeJoin) ? asset.strokeJoin : 'round';
    const common = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="${strokeJoin}" stroke-linecap="${strokeJoin === 'round' ? 'round' : 'butt'}" vector-effect="non-scaling-stroke"`;
    let shape = '';
    if (asset.shapeType === 'circle') {
      shape = `<ellipse cx="50" cy="50" rx="44" ry="44" ${common}/>`;
    } else if (asset.shapeType === 'triangle') {
      shape = `<path d="${roundedPolygonPath([[50,8],[94,92],[6,92]], radius)}" ${common}/>`;
    } else if (asset.shapeType === 'star') {
      shape = `<path d="${roundedPolygonPath(starPoints(asset.points, asset.innerRadius ?? 0.45), radius)}" ${common}/>`;
    } else {
      shape = `<rect x="8" y="8" width="84" height="84" rx="${radius}" ry="${radius}" ${common}/>`;
    }
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">${defs.length ? `<defs>${defs.join('')}</defs>` : ''}${shape}</svg>`;
  }

  function renderGraphic() {
    normalizeProjectState();
    const w = document.getElementById('graphic-wrapper');
    if (!w) return;

    if (!hasAssets()) {
      w.style.animation = 'none';
      w.innerHTML = `
        <div onclick="document.getElementById('file-upload').click()" class="upload-drop-card cursor-pointer flex flex-col items-center justify-center p-6 space-y-3 group border-2 border-dashed border-stone-300 hover:border-brand-orange transition-colors bg-white w-full h-full shadow-sm">
          <div class="flex items-center justify-center transition-colors">
            <i data-lucide="upload" class="w-6 h-6 text-stone-400 group-hover:text-brand-orange transition-colors"></i>
          </div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-stone-400 group-hover:text-brand-orange transition-colors text-center">Click or Drop File<br><span class="text-[9px] font-normal tracking-normal text-stone-400">SVG, PNG, JPG, WEBP, GIF</span></p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    let stageHTML = '';
    (S.assets || [])
      .filter(a => a.visible !== false)
      .sort((a, b) => getAssetZIndex(a) - getAssetZIndex(b))
      .forEach(asset => {
      clampAssetPosition(asset);
      let html = buildAssetHTML(asset);
      const vis = S.layers.filter(l => l.visible && l.assetId === asset.id);

      for (let i = vis.length - 1; i >= 0; i--) {
        const l = vis[i];
        let kf = l.kf;
        if (l.presetId === 'mask-reveal' && l.params && l.params.maskDir) {
          kf = 'kf-mask-' + l.params.maskDir;
        }
        const iters = '1';
        const dir = l.direction === 'out' ? 'reverse' : 'normal';
        const fill = 'forwards';
        const ps = S.playing ? 'running' : 'paused';

        let animStr = 'none';
        if (S.time < l.delay) {
          if (S.playing) {
            const delayVal = l.delay - S.time;
            animStr = `${kf} ${l.duration}s ${l.easing} ${delayVal.toFixed(3)}s ${iters} ${dir} ${fill}`;
          } else {
            animStr = 'none';
          }
        } else if (S.time <= l.delay + l.duration) {
          const elapsed = S.time - l.delay;
          animStr = `${kf} ${l.duration}s ${l.easing} -${elapsed.toFixed(3)}s ${iters} ${dir} ${fill}`;
        } else {
          animStr = `${kf} ${l.duration}s ${l.easing} -${l.duration.toFixed(3)}s ${iters} ${dir} ${fill}`;
        }

        const stScale = (l.params && l.params.layerScale !== undefined) ? l.params.layerScale : 1;
        const stRot = (l.params && l.params.layerRot !== undefined) ? l.params.layerRot : 0;

        if (l.presetId === 'trim-paths') {
          animStr = 'none';
        }

        const extraClass = l.presetId === 'trim-paths' ? 'layer-trim-paths' : '';
        let defsInject = '';
        if (l.presetId === 'trim-paths' && (l.params?.['stroke-color-mode'] || 'solid') === 'gradient') {
          const c1 = l.params?.['stroke-c1'] || '#FFB000';
          const c2 = l.params?.['stroke-c2'] || '#FFB020';
          defsInject = `<svg class="gradient-defs-svg" width="0" height="0" style="position:absolute;pointer-events:none;"><defs><linearGradient id="grad-${l.id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs></svg>`;
        }
        const inner = `<div class="${extraClass}" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;animation:${animStr};animation-play-state:${ps};">${defsInject}${html}</div>`;
        html = `<div data-layer-id="${l.id}" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;transform:scale(${stScale}) rotate(${stRot}deg);">${inner}</div>`;
      }
      stageHTML += `<div class="asset-wrapper ${asset.id === S.activeAssetId ? 'selected' : ''}" data-asset-id="${asset.id}" ${asset.type==='text'?'data-text-asset="1"':''} style="${assetPositionStyle(asset)}">${html}</div>`;
    });

    w.innerHTML = stageHTML;
    w.style.animation = 'none';
    applyGraphicPosition();

    // Fix SVG sizing
    w.querySelectorAll('svg:not(.gradient-defs-svg)').forEach(svgEl => {
      svgEl.style.cssText = 'width:100%;height:100%;max-width:100%;max-height:100%;display:block;overflow:visible;';
    });

    // Apply CSS vars to each layer wrapper
    S.layers.filter(l => l.visible).forEach(l => {
      const el = w.querySelector(`[data-layer-id="${l.id}"]`);
      if (el) applyCSSVars(el, l);
    });
  }

  function applyCSSVars(el, l) {
    const p = l.params || {};
    const set = (k,v) => el.style.setProperty(k, v);
    if (p.blurAmt    !== undefined) set('--blur-px',    `${p.blurAmt}px`);
    if (p.rotDeg     !== undefined) { set('--rot-deg', `${p.rotDeg}deg`); set('--spin-deg', `-${p.rotDeg}deg`); }
    if (p.popScale   !== undefined) set('--pop-scale',  p.popScale);
    if (p.floatDist  !== undefined) set('--float-y',    `-${p.floatDist}px`);
    if (p.bounceH    !== undefined) set('--bounce-y',   `-${p.bounceH}px`);
    if (p.pulseScale !== undefined) set('--pulse-scale',p.pulseScale);
    if (p.orbitR     !== undefined) set('--orbit-r',    `${p.orbitR}px`);
    if (p.glowColor  !== undefined) set('--glow-color', p.glowColor);
    if (p.slideFade  !== undefined) set('--slide-fade', 1 - (p.slideFade/100));
    if (p.slideDist  !== undefined) {
      const dir = p.slideDir || 'left';
      const x = (dir==='left'?-1:dir==='right'?1:0) * p.slideDist;
      const y = (dir==='top'?-1:dir==='bottom'?1:0) * p.slideDist;
      set('--slide-x', `${x}px`);
      set('--slide-y', `${y}px`);
    }
    if (p.rgbSplit   !== undefined) set('--rgb-split',  `${p.rgbSplit}px`);
    if (p.xrayOp     !== undefined) set('--xray-op',    p.xrayOp);
    if (l.presetId === 'trim-paths') {
      set('--stroke-w', `${p['stroke-width'] ?? 2}px`);
      set('--stroke-cap', p['stroke-cap'] ?? 'round');
      set('--stroke-join', 'round');
      if ((p['stroke-color-mode'] || 'solid') === 'gradient') {
        set('--stroke-color', `url(#grad-${l.id})`);
      } else {
        set('--stroke-color', p['stroke-c1'] || '#FFB000');
      }
      // Measure each stroke's real path length. In the editor, Path % directly previews the
      // visible path amount; during playback/export it animates up to that same amount.
      try {
        const wrap = el;
        if (wrap) {
          const els = wrap.querySelectorAll('svg path, svg line, svg polyline, svg polygon, svg rect, svg circle, svg ellipse');
          els.forEach(pathEl => {
            let len = 0;
            try { if (typeof pathEl.getTotalLength === 'function') len = pathEl.getTotalLength(); } catch(_) { len = 0; }
            // Fallbacks for shapes where getTotalLength may report 0 or error
            if (!len || !isFinite(len)) {
              const tag = pathEl.tagName.toLowerCase();
              if (tag === 'rect') { const w=+pathEl.getAttribute('width')||0, h=+pathEl.getAttribute('height')||0; len = 2*(w+h); }
              else if (tag === 'circle') { const r=+pathEl.getAttribute('r')||0; len = 2*Math.PI*r; }
              else if (tag === 'ellipse') { const rx=+pathEl.getAttribute('rx')||0, ry=+pathEl.getAttribute('ry')||0; len = Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry))); }
            }
            if (!len || !isFinite(len)) len = 1000;
            len = Math.ceil(len);
            pathEl.style.setProperty('--path-len', len);
            pathEl.style.strokeDasharray = len;
            
            const trimEnd = Math.max(0, Math.min(100, parseFloat(p.trimEnd ?? 100))) / 100;
            let drawn = trimEnd;
            if (S.playing || S.renderingExport) {
              const elapsed = S.time - l.delay;
              let prog = 0;
              if (elapsed >= 0 && elapsed <= l.duration) {
                prog = elapsed / l.duration;
              } else if (elapsed > l.duration) {
                prog = 1;
              }
              if (l.direction === 'out') prog = 1 - prog;
              drawn = Math.max(0, Math.min(1, prog * trimEnd));
            }
            const offset = len * (1 - drawn);
            pathEl.style.strokeDashoffset = offset <= 0.5 ? 0 : offset;
          });
        }
      } catch(e) { /* ignore */ }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // TIMELINE
  // ═══════════════════════════════════════════════════════════════════════════
  function updateCompDur(val) {
    let v = parseFloat(val);
    if(isNaN(v)) v=5;
    v = Math.max(0.5, Math.min(60, v));
    if (v === S.compDur) return;
    pushUndo('Duration');
    S.compDur = v;
    document.getElementById('comp-dur-val').value = v.toFixed(1);
    buildTimeline();
  }

  function getTotalDur() {
    return S.compDur || 5;
  }

  function buildTimeline() {
    if (window.__renamingAsset) return;
    const headers = document.getElementById('tl-headers');
    const ruler   = document.getElementById('tl-ruler');
    const rows    = document.getElementById('tl-rows');
    if (!headers || !ruler || !rows) return;
    normalizeProjectState();

    const total = getTotalDur();
    const W = total * PX_PER_SEC;

    // Ruler
    ruler.style.width = W + 'px';
    let rHTML = '';
    for (let t = 0; t <= total; t += 0.5) {
      const x = t * PX_PER_SEC;
      const major = Number.isInteger(t);
      const labelShift = t === 0 ? 'translateX(0)' : (Math.abs(t - total) < 0.001 ? 'translateX(-100%)' : 'translateX(-50%)');
      rHTML += `<div class="absolute" style="left:${x}px;top:0;height:100%">
        <div style="width:1px;height:${major?12:7}px;background:rgba(255,255,255,.5)"></div>
        ${major ? `<span style="position:absolute;top:12px;left:0;transform:${labelShift};font-size:10px;line-height:1;font-family:monospace;color:rgba(255,255,255,.72);white-space:nowrap">${t.toFixed(1)}s</span>` : ''}
      </div>`;
    }
    ruler.innerHTML = rHTML;

    // Draggable end handle at right edge of ruler
    const endHandle = document.createElement('div');
    endHandle.id = 'tl-end-handle';
    endHandle.title = 'Drag to change total duration';
    endHandle.style.cssText = `position:absolute;right:0;top:0;bottom:0;width:8px;background:#e53e3e;cursor:ew-resize;z-index:30;display:flex;align-items:center;justify-content:center;`;
    endHandle.innerHTML = `<div style="width:2px;height:12px;background:rgba(255,255,255,.7);border-radius:1px;pointer-events:none;"></div>`;
    ruler.appendChild(endHandle);

    endHandle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX;
      const startDur = getTotalDur();
      document.body.style.cursor = 'ew-resize';
      const mm = ev => {
        const delta = (ev.clientX - startX) / PX_PER_SEC;
        const next = Math.max(0.5, Math.min(60, Math.round((startDur + delta) * 10) / 10));
        if (next !== S.compDur) {
          S.compDur = next;
          const durEl = document.getElementById('comp-dur-val');
          if (durEl) durEl.value = next.toFixed(1);
          buildTimeline();
          renderGraphic();
        }
      };
      const mu = () => {
        document.body.style.cursor = '';
        window.removeEventListener('mousemove', mm);
        window.removeEventListener('mouseup', mu);
        endContinuousUndo();
      };
      window.addEventListener('mousemove', mm);
      window.addEventListener('mouseup', mu);
    });

    headers.innerHTML = '';
    rows.innerHTML = '';

    if (!S.assets.length) {
      headers.innerHTML = `<div class="flex-1 flex items-center justify-center text-[10px] text-stone-400 px-3">No layers</div>`;
      rows.innerHTML = `<div style="width:${W}px;height:40px" class="flex items-center justify-center text-[10px] text-stone-400">Add an asset to start</div>`;
      return;
    }

    const snap = (v) => Math.round(v * 10) / 10;
    const attachSegmentHandlers = (seg, layer) => {
      // Drag horizontally to move time, vertically to move to another row.
      // Alt+drag: duplicate the preset (horizontally = duplicate in place, vertically = duplicate to another row)
      let dx0=0, dy0=0, dl0=0;
      seg.addEventListener('mousedown', ev => {
        if (ev.target.classList.contains('seg-resize-l') || ev.target.classList.contains('seg-resize-r')) return;
        ev.preventDefault(); ev.stopPropagation();
        selectLayer(layer.id, { timeline:false });
        dx0=ev.clientX; dy0=ev.clientY; dl0=layer.delay;
        const isDup = ev.altKey;
        let mode = null;
        let didPushTiming = false;
        let dropRow = null;
        // For alt+drag: ghost clone shown on canvas
        let ghost = null;
        if (isDup) {
          ghost = seg.cloneNode(true);
          ghost.style.cssText += ';opacity:0.55;pointer-events:none;position:absolute;z-index:999;outline:2px dashed #FFB000;';
          const badge = document.createElement('span');
          badge.textContent = '+';
          badge.style.cssText = 'position:absolute;top:2px;right:4px;font-size:9px;font-weight:900;color:#000;background:#FFB000;padding:1px 4px;border-radius:2px;pointer-events:none;';
          ghost.appendChild(badge);
          seg.parentElement.appendChild(ghost);
        }
        const clearDrop = () => {
          if (dropRow) dropRow.classList.remove('preset-drop-target');
          dropRow = null;
        };
        const findDropRow = e => {
          const row = document.elementsFromPoint(e.clientX, e.clientY)
            .map(el => el.closest?.('.timeline-track-row'))
            .find(Boolean);
          if (row !== dropRow) {
            clearDrop();
            dropRow = row || null;
            if (dropRow) dropRow.classList.add('preset-drop-target');
          }
        };
        const mm = e => {
          const dx = e.clientX - dx0;
          const dy = e.clientY - dy0;
          if (!mode && Math.hypot(dx, dy) > 5) {
            mode = Math.abs(dy) > Math.abs(dx) * 1.15 && Math.abs(dy) > 10 ? 'drop' : 'time';
            if (mode === 'drop') seg.classList.add('dragging-preset');
          }
          if (mode === 'drop') {
            findDropRow(e);
            if (ghost) { ghost.style.left = (snap(Math.max(0, dl0 + dx/PX_PER_SEC)) * PX_PER_SEC) + 'px'; }
            return;
          }
          if (mode === 'time') {
            const newDelay = snap(Math.max(0, dl0 + dx/PX_PER_SEC));
            if (isDup) {
              // Ghost follows; original stays
              if (ghost) ghost.style.left = (newDelay * PX_PER_SEC) + 'px';
            } else {
              if (!didPushTiming) { pushUndo('Move preset timing'); didPushTiming = true; }
              layer.delay = newDelay;
              seg.style.left = (layer.delay * PX_PER_SEC) + 'px';
              syncRPDelayDisplay();
              renderGraphic();
            }
          }
        };
        const mu = e => {
          window.removeEventListener('mousemove',mm);
          window.removeEventListener('mouseup',mu);
          seg.classList.remove('dragging-preset');
          if (ghost) ghost.remove();
          const dx = e.clientX - dx0;
          const dy = e.clientY - dy0;
          const moved = Math.hypot(dx, dy) > 5;
          if (isDup && moved) {
            // Duplicate the layer
            const srcLayer = S.layers.find(l => l.id === layer.id);
            if (srcLayer) {
              pushUndo('Duplicate preset');
              const newLayer = JSON.parse(JSON.stringify(srcLayer));
              newLayer.id = newLayerId() + Math.floor(Math.random() * 9999);
              if (mode === 'drop' && dropRow?.dataset.assetId) {
                newLayer.assetId = dropRow.dataset.assetId;
                const rect = dropRow.getBoundingClientRect();
                const insertAt = Math.max(0, Math.floor((e.clientY - rect.top - 4) / 34));
                const targetLayers = S.layers.filter(l => l.assetId === newLayer.assetId);
                const insertIdx = S.layers.findIndex(l => l.id === (targetLayers[Math.min(insertAt, targetLayers.length-1)]?.id));
                if (insertIdx >= 0) S.layers.splice(insertIdx + 1, 0, newLayer);
                else S.layers.push(newLayer);
              } else {
                // Horizontal dup: same asset, new delay position
                newLayer.delay = snap(Math.max(0, dl0 + dx/PX_PER_SEC));
                const li = (() => { let idx=-1; S.layers.forEach((l,i)=>{ if(l.id===srcLayer.id) idx=i; }); return idx; })();
                S.layers.splice(li + 1, 0, newLayer);
              }
              S.sel = newLayer.id;
              clearDrop();
              refreshAll();
            }
            return;
          }
          clearDrop();
          if (!isDup) {
            let moved2 = false;
            if (mode === 'drop' && dropRow?.dataset.assetId) {
              const rect = dropRow.getBoundingClientRect();
              const insertAt = Math.max(0, Math.floor((e.clientY - rect.top - 4) / 34));
              moved2 = movePresetToTimelineRow(layer.id, dropRow.dataset.assetId, insertAt);
            }
            if (!moved2) buildTimeline();
          } else {
            buildTimeline(); // no move happened
          }
        };
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
      });

      // Resize left edge
      const lh = seg.querySelector('.seg-resize-l');
      let lx0=0, ldl0=0, ldr0=0;
      lh.addEventListener('mousedown', ev => {
        ev.preventDefault(); ev.stopPropagation();
        selectLayer(layer.id, { timeline:false });
        pushUndo('Resize preset timing');
        lx0=ev.clientX; ldl0=layer.delay; ldr0=layer.duration;
        const mm = e => {
          let newD = snap(Math.max(0, ldl0+(e.clientX-lx0)/PX_PER_SEC));
          if (newD > ldl0 + ldr0 - 0.1) newD = ldl0 + ldr0 - 0.1;
          layer.delay = newD;
          layer.duration = snap(ldl0 + ldr0 - newD);
          seg.style.left=(layer.delay*PX_PER_SEC)+'px';
          seg.style.width=(layer.duration*PX_PER_SEC)+'px';
          syncRPDelayDisplay(); syncRPDurDisplay(); renderGraphic();
        };
        const mu = () => { window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); buildTimeline(); };
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
      });

      // Resize right edge
      const rh = seg.querySelector('.seg-resize-r');
      let rx0=0, rd0=0;
      rh.addEventListener('mousedown', ev => {
        ev.preventDefault(); ev.stopPropagation();
        selectLayer(layer.id, { timeline:false });
        pushUndo('Resize preset timing');
        rx0=ev.clientX; rd0=layer.duration;
        const mm = e => { layer.duration=snap(Math.max(0.1,rd0+(e.clientX-rx0)/PX_PER_SEC)); seg.style.width=(layer.duration*PX_PER_SEC)+'px'; syncRPDurDisplay(); renderGraphic(); };
        const mu = () => { window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); buildTimeline(); };
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
      });
    };

    const selectedAssetId = getSelectedTimelineAssetId();
    const multi = isMultiSelect();
    const selectedIds = new Set(multi ? getSelectedIds() : []);
    S.assets.forEach((asset, i) => {
      const effects = S.layers.filter(l => l.assetId === asset.id);
      const isSel = asset.id === selectedAssetId;
      const isMultiSel = multi && selectedIds.has(asset.id);
      const rowH = Math.max(40, effects.length ? (effects.length * 34 + 8) : 40);

      // Header
      const h = document.createElement('div');
      h.className = `flex items-center px-2 space-x-1.5 cursor-pointer select-none ${isSel || isMultiSel ? 'bg-stone-900 text-white' : 'bg-stone-50 text-black hover:bg-stone-100'} timeline-row ${isSel ? 'selected' : ''} ${isMultiSel ? 'multi-selected' : ''}`;
      h.dataset.assetId = asset.id;
      h.style.height = rowH + 'px';
      h.style.flex = `0 0 ${rowH}px`;
      h.style.borderLeft = `3px solid ${isSel || isMultiSel ? 'var(--theme-accent, #FFB000)' : 'transparent'}`;
      h.onclick = e => selectAssetRow(asset.id, e);
      
      // Make row draggable — normal drag = reorder, Alt+drag = duplicate asset
      h.draggable = true;
      h.addEventListener('dragstart', e => {
        if (e.altKey) {
          e.dataTransfer.setData('vom-dup-asset-id', asset.id);
          e.dataTransfer.setData('text/plain', 'dup:' + asset.id);
          h.style.opacity = '0.55';
          // Show "+" badge on drag image
          const ghost = h.cloneNode(true);
          ghost.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:' + h.offsetWidth + 'px;opacity:1;background:#1c1c1c;border:1px solid #FFB000;color:#FFB000;font-size:9px;font-weight:800;padding:8px 10px;display:flex;align-items:center;gap:6px;';
          const badge = document.createElement('span');
          badge.textContent = '+ DUPLICATE';
          badge.style.cssText = 'background:#FFB000;color:#000;font-size:8px;font-weight:900;padding:2px 5px;border-radius:2px;margin-left:auto;';
          ghost.appendChild(badge);
          document.body.appendChild(ghost);
          e.dataTransfer.setDragImage(ghost, 20, ghost.offsetHeight / 2);
          setTimeout(() => ghost.remove(), 0);
        } else {
          e.dataTransfer.setData('text/plain', String(i));
          e.dataTransfer.setData('vom-asset-idx', String(i));
          h.style.opacity = '0.4';
        }
      });
      h.addEventListener('dragover', e => {
        e.preventDefault();
        h.classList.add('bg-stone-800');
      });
      h.addEventListener('dragleave', () => {
        h.classList.remove('bg-stone-800');
      });
      h.addEventListener('drop', e => {
        e.preventDefault();
        h.classList.remove('bg-stone-800');
        const dupId = e.dataTransfer.getData('vom-dup-asset-id');
        if (dupId) {
          // Alt+drag duplicate: activate the dragged asset, duplicate it
          S.activeAssetId = dupId;
          duplicateSelectedAsset();
          return;
        }
        const fromIdx = parseInt(e.dataTransfer.getData('vom-asset-idx') || e.dataTransfer.getData('text/plain'));
        if (!isNaN(fromIdx) && fromIdx !== i) {
          reorderAssetByIndex(fromIdx, i);
        }
      });
      h.addEventListener('dragend', () => {
        h.style.opacity = '1';
      });

      h.innerHTML = `
        <div class="flex items-center shrink-0 mr-1 cursor-grab" title="Drag to reorder">
          <i data-lucide="grip-vertical" class="w-3.5 h-3.5 text-stone-400"></i>

        <button onclick="event.stopPropagation();toggleAssetVis('${asset.id}')" class="shrink-0 ${asset.visible !== false?'':'opacity-40'}">

        </button>
        <span class="text-[9px] font-bold truncate flex-1 asset-name-label" data-asset-id="${asset.id}">${asset.name}</span>
        <span class="text-[8px] font-mono ${isSel || isMultiSel ? 'text-stone-300' : 'text-stone-400'}">${effects.length}</span>
        <button onclick="event.stopPropagation();removeAsset('${asset.id}')" class="shrink-0 text-stone-400 hover:text-red-500 transition-colors">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>`;
      headers.appendChild(h);
      h.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showLayerRowContextMenu(e, asset.id); });

      // Track row
      const r = document.createElement('div');
      r.className = `timeline-track-row relative cursor-pointer ${isSel || isMultiSel ? 'bg-stone-800' : 'bg-stone-100 hover:bg-stone-200'} ${isSel ? 'selected' : ''} ${isMultiSel ? 'multi-selected' : ''}`;
      r.dataset.assetId = asset.id;
      r.style.width = W + 'px';
      r.style.height = rowH + 'px';
      r.style.flex = `0 0 ${rowH}px`;
      r.onclick = e => selectAssetRow(asset.id, e);

      if (!effects.length) {
        r.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-[10px] text-stone-400">Add a preset to this layer</div>`;
      }

      effects.forEach((layer, j) => {
        const segColor = getLayerTimelineColor(layer);
        const bLeft = layer.delay * PX_PER_SEC;
        const bW    = Math.max(layer.duration * PX_PER_SEC, 10);
        const laneTop = effects.length <= 1 ? 4 : 4 + (j * 34);
        const laneHeight = effects.length <= 1 ? rowH - 8 : 28;
        const seg   = document.createElement('div');
        seg.className = 'seg-block';
        seg.style.cssText = `left:${bLeft}px;width:${bW}px;top:${laneTop}px;height:${laneHeight}px;bottom:auto;background:${segColor}`;
        seg.innerHTML = `<div class="seg-resize-l"></div><span class="truncate z-10 relative pointer-events-none px-1">${layer.name}</span><div class="seg-resize-r"></div>`;
        attachSegmentHandlers(seg, layer);
        seg.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); showSegmentContextMenu(ev, layer); });
        r.appendChild(seg);
      });
      rows.appendChild(r);
    });

    lucide.createIcons();
    updatePlayhead();
  }

  function syncTimelineSelection() {
    const selectedAssetId = getSelectedTimelineAssetId();
    const multi = isMultiSelect();

    document.querySelectorAll('#tl-headers .timeline-row').forEach(row => {

      row.classList.toggle('bg-stone-900', selected || multiSelected);

      row.style.borderLeft = `3px solid ${selected || multiSelected ? 'var(--theme-accent, #FFB000)' : 'transparent'}`;

  function setAssetXY(axis, val) {
    const asset = currentAsset();
    if (!asset || !Number.isFinite(val)) return;
    pushUndo('Move');
    asset[axis] = val;
    clampAssetPosition(asset);
    applyGraphicPosition();
    renderGraphic();
  }

  function stepTFInput(id, dir) {
    const el = document.getElementById(id);
    if (!el) return;
    const step = parseFloat(el.step) || 1;
    const min = Number.isFinite(parseFloat(el.min)) ? parseFloat(el.min) : -Infinity;
    const max = Number.isFinite(parseFloat(el.max)) ? parseFloat(el.max) : Infinity;
    const cur = parseFloat(el.value) || 0;
    const next = Math.max(min, Math.min(max, cur + (dir * step)));
    el.value = Math.round(next);
    el.dispatchEvent(new Event('input', { bubbles:true }));
    el.dispatchEvent(new Event('change', { bubbles:true }));
  }

  function holdTFStep(event, id, dir) {
    event.preventDefault();
    event.stopPropagation();
    let delay = 260;
    let timer = null;
    let running = true;
    const run = () => {
      if (!running) return;
      stepTFInput(id, dir);
      delay = Math.max(45, delay * 0.78);
      timer = window.setTimeout(run, delay);
    };
    const stop = () => {
      running = false;
      if (timer) window.clearTimeout(timer);
      window.removeEventListener('pointerup', stop);
      window.removeEventListener('pointercancel', stop);
      window.removeEventListener('blur', stop);
    };
    run();
    window.addEventListener('pointerup', stop, { once:true });
    window.addEventListener('pointercancel', stop, { once:true });
    window.addEventListener('blur', stop, { once:true });
  }

        <div class="flex-1">${wField}</div>
        ${lockBtn}
        <div class="flex-1">${hField}</div>
      </div>` : ''}
      ${isShape ? `<div class="grid grid-cols-2 gap-2">
        ${numField('tf-rot','Rotate °', asset.rotation||0, `setShapeProp('rotation',this.value,-360,360)`, -360, 360)}
        ${asset.shapeType === 'circle'
          ? `<div class="opacity-40 pointer-events-none">${numField('tf-rad','Radius', 50, ``, 0, 50)}</div>`
          : numField('tf-rad','Radius', asset.radius||0, `setShapeProp('radius',this.value,0,50)`, 0, 50)}
      </div>` : ''}`;

    return `
    <div class="border-t border-black">
      <div class="py-2.5 px-4 text-[10px] font-bold uppercase tracking-wider text-stone-500">
        Transform
      </div>
      <div class="space-y-2 pb-3 px-4">${fields}</div>
    </div>`;
  }

  // W/H size setter that respects aspect lock
  function setTFSize(axis, val) {
    const asset = currentAsset();
    if (!asset) return;
    const v = Math.max(10, Math.min(2000, parseFloat(val) || 10));
    if (window._tfLock && asset.w && asset.h) {
      const ratio = asset.w / asset.h;
      if (axis === 'w') {
        asset.w = v;
        asset.h = Math.round(v / ratio);
        const hEl = document.getElementById('tf-h');
        if (hEl) hEl.value = asset.h;
      } else {
        asset.h = v;
        asset.w = Math.round(v * ratio);
        const wEl = document.getElementById('tf-w');
        if (wEl) wEl.value = asset.w;
      }
    } else {
      asset[axis] = v;
    }
    if (asset.type === 'shape') {
      if (axis === 'w') setShapeProp('w', asset.w, 20, 2000);
      else setShapeProp('h', asset.h, 20, 2000);
    } else {
      setTextProp(axis, v);
    }
    renderGraphic();
  }

  function rpSwitchTab(tab) {}

  function rpTab(tab) {
    window._rpTab = tab;
    buildRightPanel();
    return;
    const dPanel = document.getElementById('rp-panel-design');
    const aPanel = document.getElementById('rp-panel-animate');
    const dTab   = document.getElementById('rp-tab-design');
    const aTab   = document.getElementById('rp-tab-animate');
    if (!dPanel || !aPanel) { buildRightPanel(); return; }
    if (tab === 'animate') {
      dPanel.style.display = 'none';
      aPanel.style.display = '';
      if (dTab) { dTab.style.background = 'white'; dTab.style.color = '#a8a29e'; }
      if (aTab) { aTab.style.background = '#FFB000'; aTab.style.color = 'white'; }
    } else {
      aPanel.style.display = 'none';
      dPanel.style.display = '';
      if (aTab) { aTab.style.background = 'white'; aTab.style.color = '#a8a29e'; }
      if (dTab) { dTab.style.background = '#FFB000'; dTab.style.color = 'white'; }
    }
  }

  function presetSpecificHTML(layer) {
    const p = layer.params || {};
    const preset = getPreset(layer.presetId);
    if (!preset || !preset.controls.length) return '';

    let html = `<div class="border-t border-black pt-4 space-y-3">
      <label class="text-[10px] font-bold uppercase tracking-wider text-stone-500">Preset Controls</label>`;

    const sRow = (key, label, min, max, step, valKey) => {
      const v = p[valKey] ?? min;
      return `<div class="space-y-1">
        <div class="flex justify-between items-center">
          <span class="text-xs text-stone-600">${label}</span>
          <input id="pc-${key}-val" type="text" value="${v}" onchange="setPP('${valKey}',this.value,${min},${max})" class="w-14 text-center font-mono text-[11px] border border-black focus:outline-none py-0.5">
        </div>
        <input id="pc-${key}-sl" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setPPSlider('${valKey}',this.value,'pc-${key}-val')" class="w-full" style="--rp:${pct(v,min,max)}%">
      </div>`;
    };

    if (preset.controls.includes('opacity'))     html += sRow('opacity','Opacity',0,1,0.05,'opacity');
    if (preset.controls.includes('blur-amt'))    html += sRow('blur','Blur (px)',0,100,1,'blurAmt');
    if (preset.controls.includes('scale-range')) html += sRow('scale-from','Scale from',-2,5,0.05,'scaleFrom');

    if (preset.controls.includes('slide-fade'))  html += sRow('slide-fade','Fade Intensity %',0,100,1,'slideFade');
    if (preset.controls.includes('slide-dir')) {
      const dirs = ['left','right','top','bottom'];
      html += `<div class="space-y-1.5">
        <span class="text-xs text-stone-600">Slide direction</span>

        </div>
      </div>`;
    }
    if (preset.controls.includes('stroke-width')) html += sRow('stroke-width','Thickness (px)',0,50,0.5,'stroke-width');
    if (preset.controls.includes('trim-end')) html += sRow('trim-end','Path %',0,100,1,'trimEnd');
    if (preset.controls.includes('stroke-cap')) {
      const caps = ['round','square','butt'];
      html += `<div class="space-y-1.5">
        <span class="text-xs text-stone-600">Stroke End</span>

        </div>
      </div>`;
    }
    if (preset.controls.includes('stroke-color')) {
      const mode = p['stroke-color-mode'] || 'solid';
      const c1 = p['stroke-c1'] || '#FFB000';
      const c2 = p['stroke-c2'] || '#FFB020';
      html += `<div class="space-y-1.5 border border-stone-200 p-2 bg-white">

              <i data-lucide="chevron-down" class="w-3 h-3 text-stone-600"></i>
            </button>
            <div id="stroke-mode-drop" class="vom-menu-list absolute right-0 top-full mt-1 w-28 bg-white border border-black shadow-[2px_2px_0_rgba(0,0,0,1)] z-50 hidden" onclick="event.stopPropagation()">

              <button onclick="pickStrokeMode('gradient', event)" class="vom-menu-row w-full text-left px-3 py-2 text-[9px] font-bold hover:bg-stone-100 transition uppercase">Gradient</button>

        <div class="flex space-x-2">
          <input type="color" value="${c1}" onchange="setPPDirect('stroke-c1',this.value)" class="flex-1 h-8 border border-black cursor-pointer">

    if (preset.controls.includes('rot-deg'))     html += sRow('rot','Angle (°)',-360,360,1,'rotDeg');
    if (preset.controls.includes('pop-scale'))   html += sRow('pop-scale','Peak scale',-2,5,0.05,'popScale');
    if (preset.controls.includes('float-dist'))  html += sRow('float-dist','Distance (px)',-200,200,1,'floatDist');

    if (preset.controls.includes('pulse-scale')) html += sRow('pulse-scale','Scale peak',-2,3,0.05,'pulseScale');
    if (preset.controls.includes('orbit-r'))     html += sRow('orbit-r','Orbit radius (px)',-500,500,1,'orbitR');
    if (preset.controls.includes('glitch-int'))  html += sRow('glitch','Intensity',0.2,3,0.1,'glitchInt');
    if (preset.controls.includes('rgb-split'))   html += sRow('rgb-split','Split Dist',-20,20,1,'rgbSplit');
    if (preset.controls.includes('xray-op'))     html += sRow('xray-op','Opacity',0,1,0.05,'xrayOp');
    if (preset.controls.includes('glow-color')) {
      html += `<div class="space-y-1.5">

        </div>
      </div>`;
    }

    html += '</div>';
    return html;
